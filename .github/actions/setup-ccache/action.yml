name: Set up native ccache
description: Install SHA256-pinned ccache 4.14.2 through the shared curl downloader.
outputs:
  version:
    description: Installed ccache version.
    value: ${{ steps.install.outputs.version }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install pinned native compiler cache
      id: install
      shell: python
      env:
        ACTION_ROOT: ${{ github.action_path }}
      run: |
        import importlib.util
        import os
        from pathlib import Path
        import tarfile
        import tempfile

        root = Path(os.environ["ACTION_ROOT"]).parents[2]
        spec = importlib.util.spec_from_file_location("tool_download", root / "scripts/setup-compiler-toolchain.py")
        downloads = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(downloads)
        version = "4.14.2"
        archives = {
            "Linux-X64": ("linux-x86_64-glibc", "b1f7fbb60ee24b80a6abae09ec4fcc6554fbf98c933c9bd25a3f53ab685fc00b"),
            "Linux-ARM64": ("linux-aarch64-glibc", "bc537a1f29232be50be3219ffe80c7c1955bc80a99c75311d7fb839828c80dd0"),
            "macOS-X64": ("darwin", "cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc"),
            "macOS-ARM64": ("darwin", "cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc"),
            "Windows-X64": ("windows-x86_64", "6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84"),
            "Windows-ARM64": ("windows-aarch64", "47ea5a0ed661bea53962d8fb8ee9a1769092d979a6f7c73d3081499b3305b2ab"),
        }
        platform, digest = archives[f'{os.environ["RUNNER_OS"]}-{os.environ["RUNNER_ARCH"]}']
        name = f"ccache-{version}-{platform}"
        extension = "zip" if os.name == "nt" else "tar.gz"
        stage = Path(tempfile.mkdtemp(prefix="qigao-ccache-", dir=os.environ["RUNNER_TEMP"]))
        archive = stage / f"{name}.{extension}"
        downloads.verified_download(
            f"https://github.com/ccache/ccache/releases/download/v{version}/{archive.name}",
            archive, digest, 20 * 1024 * 1024)
        unpacked = stage / "unpacked"
        if os.name == "nt":
            downloads.safe_extract(archive, unpacked)
        else:
            with tarfile.open(archive, "r:gz") as payload:
                payload.extractall(unpacked, filter="data")
        downloads.append_github(os.environ["GITHUB_PATH"], [(unpacked / name).as_posix()])
        downloads.append_github(os.environ["GITHUB_OUTPUT"], {"version": version})

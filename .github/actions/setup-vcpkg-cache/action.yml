name: Set up shared vcpkg cache
description: Configure runner-provided vcpkg, overlay ports, local L1 cache, and GitHub Packages L2 cache.

inputs:
  mode:
    description: Binary cache access mode (read, write, or readwrite)
    required: false
    default: read
  token:
    description: GitHub Packages token. Defaults to the workflow GITHUB_TOKEN.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate cache mode
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.mode }}
      run: |
        case "$CACHE_MODE" in
          read|write|readwrite) ;;
          *) echo "invalid vcpkg cache mode: $CACHE_MODE" >&2; exit 1 ;;
        esac

    - name: Ensure Mono on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v mono >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mono-complete
        fi

    - name: Ensure Mono on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        command -v mono >/dev/null 2>&1 || brew install mono

    - name: Use runner-provided vcpkg on Unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail

        root=""
        for candidate in "${VCPKG_ROOT:-}" "${VCPKG_INSTALLATION_ROOT:-}"; do
          if [ -n "$candidate" ] &&
             [ -x "$candidate/vcpkg" ] &&
             [ -f "$candidate/scripts/buildsystems/vcpkg.cmake" ]; then
            root="$candidate"
            break
          fi
        done

        if [ -z "$root" ]; then
          vcpkg_bin="$(command -v vcpkg || true)"
          if [ -n "$vcpkg_bin" ]; then
            vcpkg_bin="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$vcpkg_bin")"
            candidate="$(dirname "$vcpkg_bin")"
            if [ -f "$candidate/scripts/buildsystems/vcpkg.cmake" ]; then
              root="$candidate"
            fi
          fi
        fi

        if [ -z "$root" ]; then
          echo "runner-provided vcpkg is unavailable; provision vcpkg before setup-vcpkg-cache" >&2
          exit 1
        fi

        "$root/vcpkg" version
        revision="$(git -C "$root" rev-parse HEAD 2>/dev/null || true)"
        if [ -z "$revision" ]; then
          revision="runner-provided"
        fi

        echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
        echo "VCPKG_TOOL_REVISION=$revision" >> "$GITHUB_ENV"

    - name: Use runner-provided vcpkg on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        $root = $null
        foreach ($candidate in @($env:VCPKG_ROOT, $env:VCPKG_INSTALLATION_ROOT)) {
          if ([string]::IsNullOrWhiteSpace($candidate)) { continue }
          $exe = Join-Path $candidate "vcpkg.exe"
          $toolchain = Join-Path $candidate "scripts\buildsystems\vcpkg.cmake"
          if ((Test-Path -LiteralPath $exe -PathType Leaf) -and
              (Test-Path -LiteralPath $toolchain -PathType Leaf)) {
            $root = $candidate
            break
          }
        }

        if ([string]::IsNullOrWhiteSpace($root)) {
          $command = Get-Command vcpkg.exe -ErrorAction SilentlyContinue
          if ($null -eq $command) {
            $command = Get-Command vcpkg -ErrorAction SilentlyContinue
          }
          if ($null -ne $command) {
            $candidate = Split-Path -Parent $command.Source
            $toolchain = Join-Path $candidate "scripts\buildsystems\vcpkg.cmake"
            if (Test-Path -LiteralPath $toolchain -PathType Leaf) {
              $root = $candidate
            }
          }
        }

        if ([string]::IsNullOrWhiteSpace($root)) {
          throw "runner-provided vcpkg is unavailable; provision vcpkg before setup-vcpkg-cache"
        }

        $exe = Join-Path $root "vcpkg.exe"
        & $exe version
        if ($LASTEXITCODE -ne 0) { throw "runner-provided vcpkg version failed" }

        $revision = (& git -C $root rev-parse HEAD 2>$null)
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($revision)) {
          $revision = "runner-provided"
        } else {
          $revision = $revision.Trim()
        }

        "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
        "VCPKG_TOOL_REVISION=$revision" >> $env:GITHUB_ENV

    - name: Configure shared vcpkg cache on Unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.mode }}
        INPUT_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        token="$INPUT_TOKEN"
        if [ -z "$token" ]; then token="$GITHUB_TOKEN"; fi
        test -n "$token"

        feed="https://nuget.pkg.github.com/qigao/index.json"
        action_root="$(cd "${{ github.action_path }}/../../.." && pwd)"
        revision="$(python3 -c 'import hashlib,pathlib,sys;root=pathlib.Path(sys.argv[1]);files=[p for p in (root/"ports").rglob("*") if p.is_file()]+[root/".github/actions/setup-vcpkg-cache/action.yml",root/"vcpkg.json"];h=hashlib.sha256();[(h.update(p.relative_to(root).as_posix().encode()+b"\\0"),h.update(p.read_bytes()),h.update(b"\\0")) for p in sorted(files,key=lambda p:p.relative_to(root).as_posix())];print(h.hexdigest())' "$action_root")"
        config="$RUNNER_TEMP/qigao-vcpkg-nuget.config"
        binary_cache="${VCPKG_BINARY_CACHE:-$GITHUB_WORKSPACE/build/vcpkg-binary-cache}"
        mkdir -p "$binary_cache"

        cat > "$config" <<EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="qigao-vcpkg" value="$feed" />
          </packageSources>
          <packageSourceCredentials>
            <qigao-vcpkg>
              <add key="Username" value="qigao" />
              <add key="ClearTextPassword" value="$token" />
            </qigao-vcpkg>
          </packageSourceCredentials>
          <apiKeys>
            <add key="$feed" value="$token" />
          </apiKeys>
          <config>
            <add key="defaultPushSource" value="$feed" />
          </config>
        </configuration>
        EOF
        chmod 600 "$config"

        sources="clear;files,$binary_cache,readwrite;nugettimeout,600;nugetconfig,$config,$CACHE_MODE"

        echo "VCPKG_BINARY_CACHE=$binary_cache" >> "$GITHUB_ENV"
        echo "VCPKG_CACHE_REVISION=$revision" >> "$GITHUB_ENV"
        echo "VCPKG_OVERLAY_PORTS=$action_root/ports" >> "$GITHUB_ENV"
        echo "VCPKG_BINARY_SOURCES=$sources" >> "$GITHUB_ENV"
        echo "VCPKG_NUGET_REPOSITORY=https://github.com/qigao/vcpkg-cache" >> "$GITHUB_ENV"

    - name: Configure shared vcpkg cache on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CACHE_MODE: ${{ inputs.mode }}
        INPUT_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = "Stop"
        $token = $env:INPUT_TOKEN
        if ([string]::IsNullOrWhiteSpace($token)) { $token = $env:GITHUB_TOKEN }
        if ([string]::IsNullOrWhiteSpace($token)) { throw "GitHub Packages token is unavailable" }

        $feed = "https://nuget.pkg.github.com/qigao/index.json"
        $actionRoot = (Resolve-Path (Join-Path "${{ github.action_path }}" "..\..\..")).Path
        $revisionFiles = @(
          Get-ChildItem -LiteralPath (Join-Path $actionRoot "ports") -Recurse -File |
            Sort-Object FullName
        )
        $revisionFiles += Get-Item -LiteralPath (Join-Path $actionRoot ".github\actions\setup-vcpkg-cache\action.yml")
        $revisionFiles += Get-Item -LiteralPath (Join-Path $actionRoot "vcpkg.json")
        $revisionMaterial = foreach ($file in $revisionFiles) {
          $relative = [IO.Path]::GetRelativePath($actionRoot, $file.FullName).Replace("\", "/")
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$relative$([char]0)$hash"
        }
        $revisionBytes = [Text.Encoding]::UTF8.GetBytes(($revisionMaterial -join [Environment]::NewLine))
        $revision = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($revisionBytes)).ToLowerInvariant()
        $config = Join-Path $env:RUNNER_TEMP "qigao-vcpkg-nuget.config"
        $binaryCache = $env:VCPKG_BINARY_CACHE
        if ([string]::IsNullOrWhiteSpace($binaryCache)) {
          $binaryCache = Join-Path $env:GITHUB_WORKSPACE "build\vcpkg-binary-cache"
        }
        New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null

        @"
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="qigao-vcpkg" value="$feed" />
          </packageSources>
          <packageSourceCredentials>
            <qigao-vcpkg>
              <add key="Username" value="qigao" />
              <add key="ClearTextPassword" value="$token" />
            </qigao-vcpkg>
          </packageSourceCredentials>
          <apiKeys>
            <add key="$feed" value="$token" />
          </apiKeys>
          <config>
            <add key="defaultPushSource" value="$feed" />
          </config>
        </configuration>
        "@ | Set-Content -LiteralPath $config

        $sources = "clear;files,$binaryCache,readwrite;nugettimeout,600;nugetconfig,$config,$env:CACHE_MODE"

        "VCPKG_BINARY_CACHE=$binaryCache" >> $env:GITHUB_ENV
        "VCPKG_CACHE_REVISION=$revision" >> $env:GITHUB_ENV
        "VCPKG_OVERLAY_PORTS=$(Join-Path $actionRoot 'ports')" >> $env:GITHUB_ENV
        "VCPKG_BINARY_SOURCES=$sources" >> $env:GITHUB_ENV
        "VCPKG_NUGET_REPOSITORY=https://github.com/qigao/vcpkg-cache" >> $env:GITHUB_ENV

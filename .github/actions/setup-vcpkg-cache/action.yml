name: Set up shared vcpkg cache
description: Configure canonical vcpkg scripts with the runner-provided executable, overlay ports, local L1 cache, and GitHub Packages L2 cache.

inputs:
  mode:
    description: Binary cache access mode (read, write, or readwrite)
    required: false
    default: read
  token:
    description: GitHub Packages token. Defaults to the workflow GITHUB_TOKEN.
    required: false
    default: ""

outputs:
  contract-version:
    description: Semantic version of the shared cache contract.
    value: ${{ steps.contract.outputs.contract-version }}
  cache-revision:
    description: Canonical content revision for overlay ports, registry versions, manifests, and vcpkg identities.
    value: ${{ steps.contract.outputs.cache-revision }}
  tool-revision:
    description: Canonical vcpkg executable identity.
    value: ${{ steps.contract.outputs.tool-revision }}
  scripts-revision:
    description: Canonical Microsoft vcpkg scripts commit.
    value: ${{ steps.contract.outputs.scripts-revision }}

runs:
  using: composite
  steps:
    - name: Validate cache mode
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.mode }}
      run: |
        case "$CACHE_MODE" in
          read|write|readwrite) ;;
          *) echo "invalid vcpkg cache mode: $CACHE_MODE" >&2; exit 1 ;;
        esac

    - name: Ensure Mono on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v mono >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mono-complete
        fi

    - name: Ensure Mono on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        command -v mono >/dev/null 2>&1 || brew install mono

    - name: Prepare canonical vcpkg scripts with runner tool on Unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        action_root="$(cd "${{ github.action_path }}/../../.." && pwd)"
        scripts_revision="$(tr -d '\r\n' < "$action_root/vcpkg-scripts-revision.txt")"
        expected_tool_version="$(tr -d '\r\n' < "$action_root/vcpkg-tool-version.txt")"
        test -n "$scripts_revision"
        test -n "$expected_tool_version"

        runner_tool=""
        for candidate in "${VCPKG_ROOT:-}" "${VCPKG_INSTALLATION_ROOT:-}"; do
          if [ -n "$candidate" ] && [ -x "$candidate/vcpkg" ]; then
            runner_tool="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$candidate/vcpkg")"
            break
          fi
        done
        if [ -z "$runner_tool" ]; then
          candidate="$(command -v vcpkg || true)"
          if [ -n "$candidate" ]; then
            runner_tool="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$candidate")"
          fi
        fi
        if [ -z "$runner_tool" ] || [ ! -x "$runner_tool" ]; then
          echo "runner-provided vcpkg executable is unavailable" >&2
          exit 1
        fi

        actual_tool_version="$("$runner_tool" version | awk '/^vcpkg package management program version / {print $NF; exit}')"
        if [ "$actual_tool_version" != "$expected_tool_version" ]; then
          echo "runner vcpkg tool version mismatch: $actual_tool_version != $expected_tool_version" >&2
          exit 1
        fi

        root="$RUNNER_TEMP/qigao-vcpkg-$scripts_revision"
        if [ ! -d "$root/.git" ] || [ "$(git -C "$root" rev-parse HEAD 2>/dev/null || true)" != "$scripts_revision" ]; then
          rm -rf "$root"
          fetched=false
          for attempt in 1 2 3; do
            rm -rf "$root"
            mkdir -p "$root"
            git -C "$root" init
            git -C "$root" remote add origin https://github.com/microsoft/vcpkg.git
            if git -c protocol.version=2 -C "$root" fetch                 --no-tags --depth=1 origin "$scripts_revision" &&
               git -C "$root" checkout --detach FETCH_HEAD; then
              fetched=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 2))
            fi
          done
          if [ "$fetched" != "true" ]; then
            echo "failed to shallow-fetch canonical vcpkg scripts after 3 attempts" >&2
            exit 1
          fi
        fi

        test "$(git -C "$root" rev-parse HEAD)" = "$scripts_revision"
        test "$(git -C "$root" rev-parse --is-shallow-repository)" = "true"

        while IFS= read -r baseline; do
          [ -n "$baseline" ] || continue
          if ! git -C "$root" cat-file -e "$baseline^{commit}" 2>/dev/null; then
            baseline_fetched=false
            for attempt in 1 2 3; do
              if git -c protocol.version=2 -C "$root" fetch                   --no-tags --depth=1 origin "$baseline"; then
                baseline_fetched=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 2))
              fi
            done
            if [ "$baseline_fetched" != "true" ]; then
              echo "failed to shallow-fetch required vcpkg baseline $baseline" >&2
              exit 1
            fi
          fi
          git -C "$root" cat-file -e "$baseline:versions/baseline.json"
        done < <(
          python3 "$action_root/scripts/vcpkg-required-commits.py"             "$action_root" "${GITHUB_WORKSPACE:-$action_root}"
        )

        test "$(git -C "$root" rev-parse HEAD)" = "$scripts_revision"
        test "$(git -C "$root" rev-parse --is-shallow-repository)" = "true"
        cp "$runner_tool" "$root/vcpkg"
        chmod +x "$root/vcpkg"
        "$root/vcpkg" version

        echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
        echo "VCPKG_TOOL_REVISION=$expected_tool_version" >> "$GITHUB_ENV"
        echo "VCPKG_SCRIPTS_REVISION=$scripts_revision" >> "$GITHUB_ENV"

    - name: Prepare canonical vcpkg scripts with runner tool on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $actionRoot = (Resolve-Path (Join-Path "${{ github.action_path }}" "..\..\..")).Path
        $scriptsRevision = (Get-Content -LiteralPath (Join-Path $actionRoot "vcpkg-scripts-revision.txt") -Raw).Trim()
        if ([string]::IsNullOrWhiteSpace($scriptsRevision)) { throw "canonical vcpkg scripts revision is unavailable" }
        $expectedToolVersion = (Get-Content -LiteralPath (Join-Path $actionRoot "vcpkg-tool-version.txt") -Raw).Trim()
        if ([string]::IsNullOrWhiteSpace($expectedToolVersion)) { throw "canonical vcpkg tool version is unavailable" }

        $runnerTool = $null
        foreach ($candidate in @($env:VCPKG_ROOT, $env:VCPKG_INSTALLATION_ROOT)) {
          if ([string]::IsNullOrWhiteSpace($candidate)) { continue }
          $exe = Join-Path $candidate "vcpkg.exe"
          if (Test-Path -LiteralPath $exe -PathType Leaf) {
            $runnerTool = (Resolve-Path -LiteralPath $exe).Path
            break
          }
        }
        if ([string]::IsNullOrWhiteSpace($runnerTool)) {
          $command = Get-Command vcpkg.exe -ErrorAction SilentlyContinue
          if ($null -eq $command) { $command = Get-Command vcpkg -ErrorAction SilentlyContinue }
          if ($null -ne $command) { $runnerTool = $command.Source }
        }
        if ([string]::IsNullOrWhiteSpace($runnerTool) -or -not (Test-Path -LiteralPath $runnerTool -PathType Leaf)) {
          throw "runner-provided vcpkg executable is unavailable"
        }

        $versionOutput = @(& $runnerTool version 2>&1)
        $versionExitCode = $LASTEXITCODE
        if ($versionExitCode -ne 0) {
          throw "runner-provided vcpkg version failed with exit code $versionExitCode"
        }
        if ($versionOutput.Count -lt 1) {
          throw "runner-provided vcpkg version produced no output"
        }
        $versionLine = [string]$versionOutput[0]
        $actualToolVersion = ($versionLine -replace '^vcpkg package management program version\s+', '').Trim()
        if ($actualToolVersion -ne $expectedToolVersion) {
          throw "runner vcpkg tool version mismatch: $actualToolVersion != $expectedToolVersion"
        }

        $root = Join-Path $env:RUNNER_TEMP "qigao-vcpkg-$scriptsRevision"
        $head = $null
        if (Test-Path -LiteralPath (Join-Path $root ".git")) {
          $head = (& git -C $root rev-parse HEAD 2>$null)
          if ($LASTEXITCODE -ne 0) { $head = $null }
        }
        if ([string]::IsNullOrWhiteSpace($head) -or $head.Trim() -ne $scriptsRevision) {
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          $fetched = $false
          foreach ($attempt in 1..3) {
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            git -C $root init
            if ($LASTEXITCODE -ne 0) { throw "failed to initialize vcpkg scripts repository" }
            git -C $root remote add origin https://github.com/microsoft/vcpkg.git
            if ($LASTEXITCODE -ne 0) { throw "failed to configure vcpkg scripts remote" }

            git -c protocol.version=2 -C $root fetch --no-tags --depth=1 origin $scriptsRevision
            $fetchExit = $LASTEXITCODE
            if ($fetchExit -eq 0) {
              git -C $root checkout --detach FETCH_HEAD
              if ($LASTEXITCODE -eq 0) {
                $fetched = $true
                break
              }
            }

            if ($attempt -lt 3) { Start-Sleep -Seconds ($attempt * 2) }
          }
          if (-not $fetched) { throw "failed to shallow-fetch canonical vcpkg scripts after 3 attempts" }
        }

        $actual = (& git -C $root rev-parse HEAD).Trim()
        if ($actual -ne $scriptsRevision) { throw "vcpkg scripts revision mismatch: $actual != $scriptsRevision" }
        $isShallow = (& git -C $root rev-parse --is-shallow-repository).Trim()
        if ($isShallow -ne "true") { throw "canonical vcpkg scripts repository is not shallow" }

        $baselineScript = Join-Path $actionRoot "scripts\vcpkg-required-commits.py"
        $requiredBaselines = @(& python $baselineScript $actionRoot $env:GITHUB_WORKSPACE 2>&1)
        if ($LASTEXITCODE -ne 0) {
          throw "required vcpkg baseline discovery failed: $($requiredBaselines -join [Environment]::NewLine)"
        }
        foreach ($baselineLine in $requiredBaselines) {
          $baseline = ([string]$baselineLine).Trim()
          if ([string]::IsNullOrWhiteSpace($baseline)) { continue }

          git -C $root cat-file -e "${baseline}^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            $baselineFetched = $false
            foreach ($attempt in 1..3) {
              git -c protocol.version=2 -C $root fetch --no-tags --depth=1 origin $baseline
              if ($LASTEXITCODE -eq 0) {
                $baselineFetched = $true
                break
              }
              if ($attempt -lt 3) { Start-Sleep -Seconds ($attempt * 2) }
            }
            if (-not $baselineFetched) {
              throw "failed to shallow-fetch required vcpkg baseline $baseline"
            }
          }

          git -C $root cat-file -e "${baseline}:versions/baseline.json"
          if ($LASTEXITCODE -ne 0) {
            throw "required vcpkg baseline does not contain versions/baseline.json: $baseline"
          }
        }

        $actual = (& git -C $root rev-parse HEAD).Trim()
        if ($actual -ne $scriptsRevision) { throw "vcpkg scripts HEAD changed while fetching baselines: $actual" }
        $isShallow = (& git -C $root rev-parse --is-shallow-repository).Trim()
        if ($isShallow -ne "true") { throw "canonical vcpkg scripts repository is not shallow after baseline fetch" }

        $exe = Join-Path $root "vcpkg.exe"
        Copy-Item -LiteralPath $runnerTool -Destination $exe -Force
        & $exe version
        if ($LASTEXITCODE -ne 0) { throw "runner-provided vcpkg executable failed in canonical scripts root" }

        "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
        "VCPKG_TOOL_REVISION=$expectedToolVersion" >> $env:GITHUB_ENV
        "VCPKG_SCRIPTS_REVISION=$scriptsRevision" >> $env:GITHUB_ENV

    - name: Configure shared vcpkg cache on Unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.mode }}
        INPUT_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        token="$INPUT_TOKEN"
        if [ -z "$token" ]; then token="$GITHUB_TOKEN"; fi
        test -n "$token"

        feed="https://nuget.pkg.github.com/qigao/index.json"
        action_root="$(cd "${{ github.action_path }}/../../.." && pwd)"
        contract_version="$(tr -d '\r\n' < "$action_root/cache-contract-version.txt")"
        test -n "$contract_version"
        revision="$(python3 "$action_root/scripts/cache-contract-revision.py" "$action_root")"
        config="$RUNNER_TEMP/qigao-vcpkg-nuget.config"
        binary_cache="${VCPKG_BINARY_CACHE:-$GITHUB_WORKSPACE/build/vcpkg-binary-cache}"
        mkdir -p "$binary_cache"

        cat > "$config" <<EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="qigao-vcpkg" value="$feed" />
          </packageSources>
          <packageSourceCredentials>
            <qigao-vcpkg>
              <add key="Username" value="qigao" />
              <add key="ClearTextPassword" value="$token" />
            </qigao-vcpkg>
          </packageSourceCredentials>
          <apiKeys>
            <add key="$feed" value="$token" />
          </apiKeys>
          <config>
            <add key="defaultPushSource" value="$feed" />
          </config>
        </configuration>
        EOF
        chmod 600 "$config"

        sources="clear;files,$binary_cache,readwrite;nugettimeout,1800;nugetconfig,$config,$CACHE_MODE"

        echo "VCPKG_BINARY_CACHE=$binary_cache" >> "$GITHUB_ENV"
        echo "VCPKG_CACHE_CONTRACT_VERSION=$contract_version" >> "$GITHUB_ENV"
        echo "VCPKG_CACHE_REVISION=$revision" >> "$GITHUB_ENV"
        echo "VCPKG_CACHE_REPOSITORY_ROOT=$action_root" >> "$GITHUB_ENV"
        echo "VCPKG_OVERLAY_PORTS=$action_root/ports" >> "$GITHUB_ENV"
        echo "VCPKG_BINARY_SOURCES=$sources" >> "$GITHUB_ENV"
        echo "VCPKG_NUGET_REPOSITORY=https://github.com/qigao/vcpkg-cache" >> "$GITHUB_ENV"

    - name: Configure shared vcpkg cache on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CACHE_MODE: ${{ inputs.mode }}
        INPUT_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = "Stop"
        $token = $env:INPUT_TOKEN
        if ([string]::IsNullOrWhiteSpace($token)) { $token = $env:GITHUB_TOKEN }
        if ([string]::IsNullOrWhiteSpace($token)) { throw "GitHub Packages token is unavailable" }

        $feed = "https://nuget.pkg.github.com/qigao/index.json"
        $actionRoot = (Resolve-Path (Join-Path "${{ github.action_path }}" "..\..\..")).Path
        $contractVersion = (Get-Content -LiteralPath (Join-Path $actionRoot "cache-contract-version.txt") -Raw).Trim()
        if ([string]::IsNullOrWhiteSpace($contractVersion)) { throw "cache contract version is unavailable" }

        $revisionScript = Join-Path $actionRoot "scripts\cache-contract-revision.py"
        $revisionOutput = @(& python $revisionScript $actionRoot 2>&1)
        if ($LASTEXITCODE -ne 0) {
          throw "cache contract revision calculation failed: $($revisionOutput -join [Environment]::NewLine)"
        }
        $revision = ([string]$revisionOutput[-1]).Trim()
        if ([string]::IsNullOrWhiteSpace($revision)) { throw "cache contract revision is unavailable" }
        $config = Join-Path $env:RUNNER_TEMP "qigao-vcpkg-nuget.config"
        $binaryCache = $env:VCPKG_BINARY_CACHE
        if ([string]::IsNullOrWhiteSpace($binaryCache)) {
          $binaryCache = Join-Path $env:GITHUB_WORKSPACE "build\vcpkg-binary-cache"
        }
        New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null

        @"
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="qigao-vcpkg" value="$feed" />
          </packageSources>
          <packageSourceCredentials>
            <qigao-vcpkg>
              <add key="Username" value="qigao" />
              <add key="ClearTextPassword" value="$token" />
            </qigao-vcpkg>
          </packageSourceCredentials>
          <apiKeys>
            <add key="$feed" value="$token" />
          </apiKeys>
          <config>
            <add key="defaultPushSource" value="$feed" />
          </config>
        </configuration>
        "@ | Set-Content -LiteralPath $config

        $sources = "clear;files,$binaryCache,readwrite;nugettimeout,1800;nugetconfig,$config,$env:CACHE_MODE"

        "VCPKG_BINARY_CACHE=$binaryCache" >> $env:GITHUB_ENV
        "VCPKG_CACHE_CONTRACT_VERSION=$contractVersion" >> $env:GITHUB_ENV
        "VCPKG_CACHE_REVISION=$revision" >> $env:GITHUB_ENV
        "VCPKG_CACHE_REPOSITORY_ROOT=$actionRoot" >> $env:GITHUB_ENV
        "VCPKG_OVERLAY_PORTS=$(Join-Path $actionRoot 'ports')" >> $env:GITHUB_ENV
        "VCPKG_BINARY_SOURCES=$sources" >> $env:GITHUB_ENV
        "VCPKG_NUGET_REPOSITORY=https://github.com/qigao/vcpkg-cache" >> $env:GITHUB_ENV


    - name: Expose cache contract identity
      id: contract
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        foreach ($name in @(
          "VCPKG_CACHE_CONTRACT_VERSION",
          "VCPKG_CACHE_REVISION",
          "VCPKG_TOOL_REVISION",
          "VCPKG_SCRIPTS_REVISION"
        )) {
          $value = [Environment]::GetEnvironmentVariable($name)
          if ([string]::IsNullOrWhiteSpace($value)) {
            throw "missing shared cache identity: $name"
          }
        }
        "contract-version=$env:VCPKG_CACHE_CONTRACT_VERSION" >> $env:GITHUB_OUTPUT
        "cache-revision=$env:VCPKG_CACHE_REVISION" >> $env:GITHUB_OUTPUT
        "tool-revision=$env:VCPKG_TOOL_REVISION" >> $env:GITHUB_OUTPUT
        "scripts-revision=$env:VCPKG_SCRIPTS_REVISION" >> $env:GITHUB_OUTPUT

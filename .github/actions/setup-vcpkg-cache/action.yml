name: Set up shared vcpkg cache
description: Configure qigao shared overlay ports and GitHub Packages binary cache.

inputs:
  mode:
    description: Binary cache access mode (read, write, or readwrite)
    required: false
    default: read

runs:
  using: composite
  steps:
    - name: Validate cache mode
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.mode }}
      run: |
        case "$CACHE_MODE" in
          read|write|readwrite) ;;
          *) echo "invalid vcpkg cache mode: $CACHE_MODE" >&2; exit 1 ;;
        esac

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "8.0.x"

    - name: Configure shared vcpkg cache
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.mode }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        feed="https://nuget.pkg.github.com/qigao/index.json"
        action_root="$(cd "${{ github.action_path }}/../../.." && pwd)"

        dotnet nuget remove source qigao-vcpkg >/dev/null 2>&1 || true
        dotnet nuget add source "$feed"           --name qigao-vcpkg           --username qigao           --password "$GITHUB_TOKEN"           --store-password-in-clear-text

        if [ "$CACHE_MODE" != "read" ]; then
          dotnet nuget setapikey "$GITHUB_TOKEN" --source "$feed"
        fi

        echo "VCPKG_OVERLAY_PORTS=$action_root/ports" >> "$GITHUB_ENV"
        echo "VCPKG_BINARY_SOURCES=clear;nuget,$feed,$CACHE_MODE" >> "$GITHUB_ENV"
        echo "VCPKG_NUGET_REPOSITORY=https://github.com/qigao/vcpkg-cache" >> "$GITHUB_ENV"

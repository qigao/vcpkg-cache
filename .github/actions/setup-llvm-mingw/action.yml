name: Set up Windows llvm-mingw
description: Install the selected immutable llvm-mingw UCRT package; no Clang validation or smoke CI.
inputs:
  version:
    description: Windows llvm-mingw release tag (MinGW-specific)
    default: "20261020"
    required: false
  target:
    description: Windows target CPU
    default: x64
    required: false
  build-type:
    description: Product build configuration; does not trigger compiler tests
    default: toolchain-only
    required: false
  plugin-path:
    description: Existing obfuscator-llvm shared library for protected target builds
    default: ""
    required: false
  obfuscation-seed:
    description: Obfuscation pass seed
    default: "0xA04252B187478C00A40BC6D81D1A8A52"
    required: false
  install-root:
    description: Optional fresh absolute toolchain folder
    default: ""
    required: false
outputs:
  root:
    value: ${{ steps.install.outputs.root }}
  cc:
    value: ${{ steps.install.outputs.cc }}
  cxx:
    value: ${{ steps.install.outputs.cxx }}
  ar:
    value: ${{ steps.install.outputs.ar }}
  rc:
    value: ${{ steps.install.outputs.rc }}
  toolchain-file:
    value: ${{ steps.install.outputs.toolchain-file }}
  target-triple:
    value: ${{ steps.install.outputs.target-triple }}
  version:
    value: ${{ steps.install.outputs.version }}
  archive-sha256:
    value: ${{ steps.install.outputs.archive-sha256 }}
  obfuscator-compile-flag:
    value: ${{ steps.install.outputs.obfuscator-compile-flag }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install Windows llvm-mingw toolchain
      id: install
      shell: pwsh
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_BUILD_TYPE: ${{ inputs.build-type }}
        INPUT_PLUGIN_PATH: ${{ inputs.plugin-path }}
        INPUT_OBF_SEED: ${{ inputs.obfuscation-seed }}
        INPUT_INSTALL_ROOT: ${{ inputs.install-root }}
        HOST_OS: ${{ runner.os }}
        HOST_ARCH: ${{ runner.arch }}
      run: |
        $ErrorActionPreference = 'Stop'
        $repo = [IO.Path]::GetFullPath((Join-Path '${{ github.action_path }}' '../../..'))
        $installer = Join-Path $repo 'scripts/setup-compiler-toolchain.py'
        $destination = $env:INPUT_INSTALL_ROOT
        if (-not $destination) {
          $destination = Join-Path $env:RUNNER_TEMP "qigao-llvm-mingw-$env:INPUT_VERSION-$env:HOST_OS-$env:HOST_ARCH-$env:INPUT_TARGET"
        }
        if ($env:INPUT_BUILD_TYPE -in @('Release', 'MinSizeRel', 'RelWithDebInfo') -and
            -not $env:INPUT_PLUGIN_PATH) {
          throw 'Protected Windows Release requires obfuscator-llvm plugin-path'
        }
        $argv = @('--compiler', 'llvm-mingw', '--version', $env:INPUT_VERSION,
                  '--target', $env:INPUT_TARGET,
                  '--build-type', $env:INPUT_BUILD_TYPE,
                  '--runner-os', $env:HOST_OS, '--runner-arch', $env:HOST_ARCH,
                  '--destination', $destination,
                  '--github-output', $env:GITHUB_OUTPUT,
                  '--github-env', $env:GITHUB_ENV,
                  '--github-path', $env:GITHUB_PATH)
        & python $installer @argv
        if ($LASTEXITCODE -ne 0) { throw 'Windows llvm-mingw package install failed' }
        if ($env:INPUT_PLUGIN_PATH) {
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "obfuscator-compile-flag=-fpass-plugin=$env:INPUT_PLUGIN_PATH"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "LLVM_OBF_SCALAROPTIMIZERLATE_PASSES=flattening,substitution"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "LLVM_OBF_SEED=$env:INPUT_OBF_SEED"
        }

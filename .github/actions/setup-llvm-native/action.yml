name: Use runner-native Clang for Linux and macOS
description: Select installed Clang directly; no download, compiler version checks, smoke or dedicated validation CI.
inputs:
  build-type:
    description: Product build configuration
    default: toolchain-only
    required: false
  plugin-path:
    description: Existing obfuscator-llvm plugin path for protected builds
    default: ""
    required: false
  obfuscation-seed:
    description: Obfuscator seed
    default: "0xA04252B187478C00A40BC6D81D1A8A52"
    required: false
  macos-llvm-formula:
    description: Runner-provided independent LLVM formula; no LLVM version is enforced
    default: "llvm@18"
    required: false
outputs:
  root:
    value: ${{ steps.local.outputs.root }}
  cc:
    value: ${{ steps.local.outputs.cc }}
  cxx:
    value: ${{ steps.local.outputs.cxx }}
  ar:
    value: ${{ steps.local.outputs.ar }}
  ranlib:
    value: ${{ steps.local.outputs.ranlib }}
  toolchain-file:
    value: ${{ steps.local.outputs.toolchain-file }}
  obfuscator-compile-flag:
    value: ${{ steps.local.outputs.obfuscator-compile-flag }}
  obfuscation-policy-cmake:
    value: ${{ steps.local.outputs.obfuscation-policy-cmake }}
runs:
  using: composite
  steps:
    - name: Select local LLVM/Clang; no verification
      id: local
      shell: bash
      env:
        BUILD_TYPE: ${{ inputs.build-type }}
        PLUGIN_PATH: ${{ inputs.plugin-path }}
        SEED: ${{ inputs.obfuscation-seed }}
        LLVM_FORMULA: ${{ inputs.macos-llvm-formula }}
      run: |
        set -euo pipefail
        if [[ "$BUILD_TYPE" =~ ^(Release|MinSizeRel|RelWithDebInfo)$ ]] && [[ -z "$PLUGIN_PATH" ]]; then
          echo 'Protected Release requires obfuscator-llvm plugin-path' >&2
          exit 1
        fi
        if [[ "$RUNNER_OS" == macOS ]]; then
          root="$(brew --prefix "$LLVM_FORMULA")"
          cc="$root/bin/clang"
          cxx="$root/bin/clang++"
          ar="$root/bin/llvm-ar"
          ranlib="$root/bin/llvm-ranlib"
          sdk="$(/usr/bin/xcrun --sdk macosx --show-sdk-path)"
          system=Darwin
        else
          cc="$(command -v clang)"
          cxx="$(command -v clang++)"
          ar="$(command -v llvm-ar)"
          ranlib="$(command -v llvm-ranlib)"
          root="$(dirname "$(dirname "$cc")")"
          system=Linux
          sdk=''
        fi
        if [[ "$system" == Darwin ]]; then
          tc="$RUNNER_TEMP/qigao-runner-clang-$RUNNER_ARCH.cmake"
          printf 'set(CMAKE_SYSTEM_NAME Darwin)\nset(CMAKE_C_COMPILER "%s")\nset(CMAKE_CXX_COMPILER "%s")\nset(CMAKE_AR "%s")\nset(CMAKE_RANLIB "%s")\nset(CMAKE_OSX_SYSROOT "%s")\n' "$cc" "$cxx" "$ar" "$ranlib" "$sdk" > "$tc"
        else
          tc="$RUNNER_TEMP/qigao-runner-clang-$RUNNER_ARCH.cmake"
          printf 'set(CMAKE_SYSTEM_NAME Linux)\nset(CMAKE_C_COMPILER "%s")\nset(CMAKE_CXX_COMPILER "%s")\nset(CMAKE_AR "%s")\nset(CMAKE_RANLIB "%s")\n' "$cc" "$cxx" "$ar" "$ranlib" > "$tc"
        fi
        echo "root=$root" >> "$GITHUB_OUTPUT"
        echo "cc=$cc" >> "$GITHUB_OUTPUT"
        echo "cxx=$cxx" >> "$GITHUB_OUTPUT"
        echo "ar=$ar" >> "$GITHUB_OUTPUT"
        echo "ranlib=$ranlib" >> "$GITHUB_OUTPUT"
        echo "toolchain-file=$tc" >> "$GITHUB_OUTPUT"
        policy_root="$(cd "${{ github.action_path }}/../../.." && pwd)"
        policy="$policy_root/cmake/QigaoFirstPartyObfuscation.cmake"
        echo "obfuscation-policy-cmake=$policy" >> "$GITHUB_OUTPUT"
        echo "QIGAO_OBFUSCATION_POLICY_CMAKE=$policy" >> "$GITHUB_ENV"
        {
          echo "LLVM_NATIVE_ROOT=$root"
          echo "LLVM_NATIVE_CC=$cc"
          echo "LLVM_NATIVE_CXX=$cxx"
          echo "LLVM_NATIVE_AR=$ar"
          echo "LLVM_NATIVE_RANLIB=$ranlib"
          echo "LLVM_NATIVE_TOOLCHAIN_FILE=$tc"
          echo "QIGAO_COMPILER_TOOLCHAIN_FILE=$tc"
        } >> "$GITHUB_ENV"
        if [[ "$system" == Darwin ]]; then
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
        fi
        if [[ -n "$PLUGIN_PATH" ]]; then
          echo "obfuscator-compile-flag=-fpass-plugin=$PLUGIN_PATH" >> "$GITHUB_OUTPUT"
          echo "QIGAO_OBFUSCATOR_PLUGIN_PATH=$PLUGIN_PATH" >> "$GITHUB_ENV"
          echo 'LLVM_OBF_SCALAROPTIMIZERLATE_PASSES=flattening,substitution' >> "$GITHUB_ENV"
          echo "LLVM_OBF_SEED=$SEED" >> "$GITHUB_ENV"
        fi

name: Set up re2c binary using authenticated curl
description: Restore the latest published Qigao.Re2c.Binary from GitHub Packages NuGet V3 without NuGet, .NET restore or Mono.

inputs:
  token:
    description: GitHub Packages read token; defaults to GITHUB_TOKEN.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Restore the published host re2c package via curl only
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $root = (Resolve-Path (Join-Path '${{ github.action_path }}' '../../..')).Path
        python (Join-Path $root 'scripts/github-packages.py') re2c (Join-Path $env:RUNNER_TEMP 'qigao-re2c-binary')
        if ($LASTEXITCODE -ne 0) { throw 'Verified curl-only GitHub Packages re2c restore failed' }

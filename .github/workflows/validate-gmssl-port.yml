name: Validate GmSSL vcpkg port

on:
  pull_request:
    paths:
      - "ports/gmssl/**"
      - ".github/workflows/validate-gmssl-port.yml"

permissions:
  contents: read
  packages: read

jobs:
  linux:
    name: GmSSL / ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap pinned curl-only vcpkg for source-build Linux x64
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          manifest-root: cache-contracts/optional-feature
          triplet: x64-linux
          host-triplet: x64-linux
      - name: Build GmSSL overlay
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/gmssl-manifest"
          install="$RUNNER_TEMP/gmssl-install"
          mkdir -p "$manifest"
          cat > "$manifest/vcpkg.json" <<'EOF'
          {
            "name": "gmssl-port-contract",
            "version-string": "1",
            "dependencies": ["gmssl"]
          }
          EOF
          # Native GmSSL port verification must compile the port, not reuse a
          # previously published or legacy NuGet cache ABI.
          VCPKG_BINARY_SOURCES=clear "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$manifest" --x-install-root="$install" \
            --triplet x64-linux --host-triplet x64-linux
          test -f "$install/x64-linux/include/gmssl/tls.h"
          test -f "$install/x64-linux/lib/libgmssl.a"
      - name: Compile and link consumer
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gmssl-install/x64-linux"
          src="$RUNNER_TEMP/gmssl-consumer-src"
          build="$RUNNER_TEMP/gmssl-consumer-build"
          mkdir -p "$src"
          cat > "$src/main.c" <<'EOF'
          #include <gmssl/tls.h>
          static tls_ret_t probe_send(void *user, const void *buf, size_t len, int flags) {
            (void)user; (void)buf; (void)len; (void)flags;
            return TLS_ERROR_SEND_AGAIN;
          }
          static tls_ret_t probe_recv(void *user, void *buf, size_t len, int flags) {
            (void)user; (void)buf; (void)len; (void)flags;
            return TLS_ERROR_RECV_AGAIN;
          }
          int main(void) {
            TLS_CONNECT conn = {0};
            TLS_IO io = {0, probe_send, probe_recv};
            if (tls_protocol_name(TLS_protocol_tls13) == 0) return 1;
            return tls_set_io(&conn, &io) == 1 ? 0 : 2;
          }
          EOF
          cat > "$src/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(gmssl_consumer C)
          find_package(GmSSL CONFIG REQUIRED)
          add_executable(gmssl-consumer main.c)
          target_link_libraries(gmssl-consumer PRIVATE GmSSL::GmSSL)
          EOF
          cmake -S "$src" -B "$build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$root"
          cmake --build "$build"
          "$build/gmssl-consumer"
      - name: Verify TLS 1.2 ALPN wire contract
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gmssl-install/x64-linux"
          build="$RUNNER_TEMP/gmssl-tls12-alpn-build"
          cmake -S ports/gmssl/tests -B "$build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$root"
          cmake --build "$build"
          "$build/gmssl-des-cbc-contract"
          "$build/gmssl-sha1-contract"
          "$build/gmssl-tls12-alpn-contract"
          "$build/gmssl-tls-version-range-contract"
          "$build/gmssl-tls-version-range-dispatch-contract"
          "$build/gmssl-tls-version-range-server-dispatch-contract"
          "$build/gmssl-tls-version-range-server-dispatch-contract"
          "$build/gmssl-rsa-public-contract"
          "$build/gmssl-rsa-signature-contract"
          "$build/gmssl-x509-rsa-contract"
          "$build/gmssl-tls-exporter-contract"
          "$build/gmssl-tls13-rsa-pss-contract"
          "$build/gmssl-rsa-private-contract"
          "$build/gmssl-rsa-private-op-contract"
          "$build/gmssl-rsa-pkcs8-contract"
          "$build/gmssl-rsa-encrypted-pkcs8-contract"
          "$build/gmssl-rsa-encrypted-pkcs8-contract"
          "$build/gmssl-rsa-private-signatures-contract"
          "$build/gmssl-tls-inspection-contract"
          "$build/gmssl-tls12-ecdhe-rsa-contract"
          "$build/gmssl-x509-basic-constraints-contract"
          "$build/gmssl-x509-ca-eku-contract"
          "$build/gmssl-tls-certificate-capacity-contract"
          "$build/gmssl-tls-cleanup-contract"
          "$build/gmssl-tls-cleanup-contract"
          "$build/gmssl-p256-plain-pkcs8-contract"
          "$build/gmssl-p256-plain-pkcs8-contract"
          "$build/gmssl-p256-ecdsa-der-contract"
          "$build/gmssl-tls13-external-io-contract"
          "$build/gmssl-tls12-external-io-contract"
          "$build/gmssl-tls13-external-io-contract" --no-sni
          "$build/gmssl-tls12-external-io-contract" --no-sni
          "$build/gmssl-tls13-external-io-contract" --no-sni --request-client
      - name: Interoperate with OpenSSL TLS 1.2 ECDHE_RSA
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gmssl-install/x64-linux"
          work="$RUNNER_TEMP/gmssl-tls12-rsa-interop"
          rm -rf "$work"
          mkdir -p "$work"
          gmssl_bin="$(find "$root/tools" -type f -name gmssl -perm -111 | head -n1)"
          test -n "$gmssl_bin"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout "$work/ca-key.pem" \
            -out "$work/ca-cert.pem" \
            -days 1 \
            -subj "/CN=GmSSL Test CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -new -newkey rsa:2048 -sha256 -nodes \
            -keyout "$work/server-key.pem" \
            -out "$work/server.csr" \
            -subj "/CN=localhost"
          cat > "$work/server.ext" <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:localhost
          EOF
          openssl x509 -req \
            -in "$work/server.csr" \
            -CA "$work/ca-cert.pem" \
            -CAkey "$work/ca-key.pem" \
            -CAcreateserial \
            -out "$work/server-cert.pem" \
            -days 1 \
            -sha256 \
            -extfile "$work/server.ext"
          openssl s_server \
            -accept 9443 \
            -cert "$work/server-cert.pem" \
            -key "$work/server-key.pem" \
            -tls1_2 \
            -cipher ECDHE-RSA-AES128-GCM-SHA256 \
            -sigalgs rsa_pkcs1_sha256 \
            -www \
            >"$work/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          client_rc=0
          "$gmssl_bin" tls12_client \
            -host 127.0.0.1 \
            -port 9443 \
            -server_name localhost \
            -cacert "$work/ca-cert.pem" \
            -cipher_suite TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256 \
            -supported_group prime256v1 \
            -sig_alg rsa_pkcs1_sha256 \
            -get / \
            -verbose \
            >"$work/client.out" 2>"$work/client.err" || client_rc=$?
          cat "$work/client.err"
          cat "$work/client.out"
          cat "$work/server.log"
          if [ "$client_rc" -ne 0 ]; then
            echo "GmSSL TLS 1.2 client failed with rc=$client_rc" >&2
            exit "$client_rc"
          fi
          grep -q "Protocol: TLS1.2" "$work/client.err"
          grep -q "CipherSuite: TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256" "$work/client.err"
          grep -q "HTTP/1.0 200 ok" "$work/client.out"
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT


      - name: Interoperate GmSSL TLS 1.2 RSA server with OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gmssl-install/x64-linux"
          work="$RUNNER_TEMP/gmssl-tls12-rsa-server-interop"
          rm -rf "$work"
          mkdir -p "$work"
          gmssl_bin="$(find "$root/tools" -type f -name gmssl -perm -111 | head -n1)"
          test -n "$gmssl_bin"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout "$work/ca-key.pem" -out "$work/ca-cert.pem" -days 1 \
            -subj "/CN=GmSSL Server Test CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -new -newkey rsa:2048 -sha256 -nodes \
            -keyout "$work/server-key.pem" -out "$work/server.csr" \
            -subj "/CN=localhost"
          cat > "$work/server.ext" <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:localhost
          EOF
          openssl x509 -req -in "$work/server.csr" \
            -CA "$work/ca-cert.pem" -CAkey "$work/ca-key.pem" -CAcreateserial \
            -out "$work/server-cert.pem" -days 1 -sha256 -extfile "$work/server.ext"
          "$gmssl_bin" tls12_server \
            -port 9444 -cert "$work/server-cert.pem" -key "$work/server-key.pem" -pass "" \
            -cipher_suite TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256 \
            -supported_group prime256v1 -sig_alg rsa_pkcs1_sha256 \
            -renegotiation_info \
            >"$work/server.out" 2>"$work/server.err" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          client_rc=0
          echoed=0
          printf 'gmssl-rsa-server\n' | openssl s_client \
            -connect 127.0.0.1:9444 -servername localhost \
            -CAfile "$work/ca-cert.pem" -verify_hostname localhost \
            -tls1_2 -cipher ECDHE-RSA-AES128-GCM-SHA256 \
            -sigalgs rsa_pkcs1_sha256 -quiet \
            >"$work/client.out" 2>"$work/client.err" &
          client_pid=$!
          for _ in $(seq 1 100); do
            if grep -q "gmssl-rsa-server" "$work/client.out" 2>/dev/null; then
              echoed=1
              break
            fi
            if ! kill -0 "$client_pid" 2>/dev/null; then
              wait "$client_pid" || client_rc=$?
              client_pid=""
              break
            fi
            sleep 0.1
          done
          if [ -n "$client_pid" ]; then
            kill "$client_pid" 2>/dev/null || true
            wait "$client_pid" 2>/dev/null || true
            client_pid=""
          fi
          cat "$work/server.err"
          cat "$work/server.out"
          cat "$work/client.err"
          cat "$work/client.out"
          if [ "$echoed" -ne 1 ]; then
            echo "OpenSSL TLS 1.2 client did not receive the GmSSL echo (rc=$client_rc)" >&2
            exit 1
          fi
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Interoperate TLS 1.2 RSA mutual authentication
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gmssl-install/x64-linux"
          gmssl_bin="$(find "$root/tools" -type f -name gmssl -perm -111 | head -n1)"
          test -n "$gmssl_bin"
          bash ports/gmssl/tests/tls12-rsa-mtls-interop.sh \
            "$gmssl_bin" "$RUNNER_TEMP/gmssl-tls12-rsa-mtls" 9450

      - name: Interoperate OpenSSL P-384 CA / P-256 ECDSA-SHA384 TLS 1.2 and 1.3
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gmssl-install/x64-linux"
          gmssl_bin="$(find "$root/tools" -type f -name gmssl -perm -111 | head -n1)"
          test -n "$gmssl_bin"
          bash ports/gmssl/tests/tls-p384-issuer-interop.sh \
            "$gmssl_bin" "$RUNNER_TEMP/gmssl-p384-issuer-interop" 9460



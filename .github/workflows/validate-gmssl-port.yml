  windows:
    name: GmSSL / windows-2025 v145
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Build GmSSL overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $triplet = "qigao-x64-windows-v145"
          $manifest = Join-Path $env:RUNNER_TEMP "gmssl-manifest"
          $install = Join-Path $env:RUNNER_TEMP "gmssl-install"
          New-Item -ItemType Directory -Force -Path $manifest | Out-Null
          @'
          {
            "name": "gmssl-port-contract",
            "version-string": "1",
            "dependencies": ["gmssl"]
          }
          '@ | Set-Content -LiteralPath (Join-Path $manifest "vcpkg.json") -Encoding utf8
          & "$env:VCPKG_ROOT\vcpkg.exe" install "--x-manifest-root=$manifest" "--x-install-root=$install" "--triplet=$triplet" "--host-triplet=$triplet"
          if ($LASTEXITCODE -ne 0) { throw "GmSSL vcpkg install failed" }
          $root = Join-Path $install $triplet
          if (-not (Test-Path (Join-Path $root "include\gmssl\tls.h"))) { throw "tls.h missing" }
          if (-not (Test-Path (Join-Path $root "lib\gmssl.lib"))) { throw "gmssl.lib missing" }
          if (Test-Path (Join-Path $root "bin\gmssl.dll")) { throw "GmSSL provider must be packaged statically" }
      - name: Compile and link consumer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $triplet = "qigao-x64-windows-v145"
          $root = Join-Path (Join-Path $env:RUNNER_TEMP "gmssl-install") $triplet
          $src = Join-Path $env:RUNNER_TEMP "gmssl-consumer-src"
          $build = Join-Path $env:RUNNER_TEMP "gmssl-consumer-build"
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          @'
          #include <gmssl/tls.h>
          static tls_ret_t probe_send(void *user, const void *buf, size_t len, int flags) {
            (void)user; (void)buf; (void)len; (void)flags;
            return TLS_ERROR_SEND_AGAIN;
          }
          static tls_ret_t probe_recv(void *user, void *buf, size_t len, int flags) {
            (void)user; (void)buf; (void)len; (void)flags;
            return TLS_ERROR_RECV_AGAIN;
          }
          int main(void) {
            TLS_CONNECT conn = {0};
            TLS_IO io = {0, probe_send, probe_recv};
            if (tls_protocol_name(TLS_protocol_tls13) == 0) return 1;
            return tls_set_io(&conn, &io) == 1 ? 0 : 2;
          }
          '@ | Set-Content -LiteralPath (Join-Path $src "main.c") -Encoding ascii
          @'
          cmake_minimum_required(VERSION 3.16)
          project(gmssl_consumer C)
          find_package(GmSSL CONFIG REQUIRED)
          add_executable(gmssl-consumer main.c)
          target_link_libraries(gmssl-consumer PRIVATE GmSSL::GmSSL)
          '@ | Set-Content -LiteralPath (Join-Path $src "CMakeLists.txt") -Encoding ascii
          cmake -S $src -B $build "-DCMAKE_PREFIX_PATH=$root" -A x64 -T v145
          if ($LASTEXITCODE -ne 0) { throw "GmSSL consumer configure failed" }
          cmake --build $build --config Release
          if ($LASTEXITCODE -ne 0) { throw "GmSSL consumer build failed" }
          if (Test-Path (Join-Path $root "bin\gmssl.dll")) { throw "unexpected GmSSL runtime DLL" }
          & (Join-Path $build "Release\gmssl-consumer.exe")
          if ($LASTEXITCODE -ne 0) { throw "static GmSSL consumer failed without provider runtime on PATH" }
      - name: Verify TLS 1.2 ALPN wire contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $triplet = "qigao-x64-windows-v145"
          $root = Join-Path (Join-Path $env:RUNNER_TEMP "gmssl-install") $triplet
          $build = Join-Path $env:RUNNER_TEMP "gmssl-tls12-alpn-build"

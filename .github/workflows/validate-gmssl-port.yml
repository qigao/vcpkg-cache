          $env:PATH = (Join-Path $root "bin") + ";" + $env:PATH
          & (Join-Path $build "Release\gmssl-des-cbc-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "DES-CBC compatibility contract failed" }
          & (Join-Path $build "Release\gmssl-tls12-alpn-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "TLS 1.2 ALPN wire contract failed" }
          & (Join-Path $build "Release\gmssl-tls-version-range-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "TLS version-range contract failed" }
          & (Join-Path $build "Release\gmssl-tls-version-range-dispatch-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "TLS version-range dispatch contract failed" }
          & (Join-Path $build "Release\gmssl-tls-version-range-server-dispatch-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "TLS server version-range dispatch contract failed" }
          & (Join-Path $build "Release\gmssl-rsa-public-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "RSA public operation contract failed" }
          & (Join-Path $build "Release\gmssl-rsa-signature-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "RSA signature verification contract failed" }
          & (Join-Path $build "Release\gmssl-x509-rsa-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "X.509 RSA verification contract failed" }
          & (Join-Path $build "Release\gmssl-tls-exporter-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "TLS exporter contract failed" }
          & (Join-Path $build "Release\gmssl-tls13-rsa-pss-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "TLS 1.3 RSA-PSS contract failed" }
          & (Join-Path $build "Release\gmssl-rsa-private-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "RSA private parser contract failed" }
          & (Join-Path $build "Release\gmssl-rsa-private-op-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "RSA private operation contract failed" }
          & (Join-Path $build "Release\gmssl-rsa-pkcs8-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "RSA PKCS8 identity contract failed" }
          & (Join-Path $build "Release\gmssl-rsa-encrypted-pkcs8-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "encrypted RSA PKCS8 key_password contract failed" }
          & (Join-Path $build "Release\gmssl-rsa-private-signatures-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "RSA private signing contract failed" }
          & (Join-Path $build "Release\gmssl-tls-inspection-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "TLS inspection contract failed" }
          & (Join-Path $build "Release\gmssl-tls12-ecdhe-rsa-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "TLS 1.2 ECDHE_RSA contract failed" }
          & (Join-Path $build "Release\gmssl-x509-basic-constraints-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "X.509 BasicConstraints contract failed" }
          & (Join-Path $build "Release\gmssl-tls-cleanup-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "TLS cleanup contract failed" }
          & (Join-Path $build "Release\gmssl-p256-plain-pkcs8-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "P-256 plain PKCS8 identity contract failed" }
          & (Join-Path $build "Release\gmssl-tls13-external-io-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "callback-only TLS 1.3 external-I/O contract failed" }
          & (Join-Path $build "Release\gmssl-tls12-external-io-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "callback-only TLS 1.2 external-I/O contract failed" }
          & (Join-Path $build "Release\gmssl-tls13-external-io-contract.exe") --no-sni
          if ($LASTEXITCODE -ne 0) { throw "TLS 1.3 no-SNI contract failed" }
          & (Join-Path $build "Release\gmssl-tls12-external-io-contract.exe") --no-sni
          if ($LASTEXITCODE -ne 0) { throw "TLS 1.2 no-SNI contract failed" }
          cmake --build $build --config Debug --target gmssl-tls13-external-io-contract gmssl-tls12-external-io-contract
          if ($LASTEXITCODE -ne 0) { throw "Debug external-I/O contract build failed" }
          & (Join-Path $build "Debug\gmssl-tls13-external-io-contract.exe") --no-sni
          if ($LASTEXITCODE -ne 0) { throw "Debug TLS 1.3 no-SNI contract failed" }
          & (Join-Path $build "Debug\gmssl-tls12-external-io-contract.exe") --no-sni
          if ($LASTEXITCODE -ne 0) { throw "Debug TLS 1.2 no-SNI contract failed" }


  android:
    name: GmSSL / Android arm64 API24 link
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Build overlay and link Android API24 consumer
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_NDK_HOME:-}"
          manifest="$RUNNER_TEMP/gmssl-android-manifest"
          install="$RUNNER_TEMP/gmssl-android-install"
          mkdir -p "$manifest"
          cat > "$manifest/vcpkg.json" <<'EOF'
          {
            "name": "gmssl-android-contract",
            "version-string": "1",
            "dependencies": ["gmssl"]
          }
          EOF
          "$VCPKG_ROOT/vcpkg" install             --x-manifest-root="$manifest"             --x-install-root="$install"             --triplet arm64-android
          root="$install/arm64-android"
          test -f "$root/include/gmssl/rand.h"
          test -f "$root/lib/libgmssl.a"

          src="$RUNNER_TEMP/gmssl-android-rng.c"
          cat > "$src" <<'EOF'
          #include <gmssl/rand.h>
          #include <stdint.h>
          int main(void) {
            uint8_t bytes[32];
            return rand_bytes(bytes, sizeof(bytes)) == 1 ? 0 : 1;
          }
          EOF

          prebuilt="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt"             -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$prebuilt"
          cc="$prebuilt/bin/aarch64-linux-android24-clang"
          nm="$prebuilt/bin/llvm-nm"
          test -x "$cc"
          test -x "$nm"
          "$cc" -I"$root/include" "$src" "$root/lib/libgmssl.a"             -pthread -latomic -lm -o "$RUNNER_TEMP/gmssl-android-rng"
          if "$nm" -u "$RUNNER_TEMP/gmssl-android-rng" | grep -q 'getentropy'; then
            echo "Android API24 consumer still depends on getentropy" >&2
            exit 1
          fi

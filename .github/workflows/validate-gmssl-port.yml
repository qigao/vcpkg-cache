name: Validate GmSSL vcpkg port

on:
  pull_request:
    paths:
      - "ports/gmssl/**"
      - ".github/workflows/validate-gmssl-port.yml"

permissions:
  contents: read
  packages: read

jobs:
  linux:
    name: GmSSL / ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Build GmSSL overlay
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/gmssl-manifest"
          install="$RUNNER_TEMP/gmssl-install"
          mkdir -p "$manifest"
          cat > "$manifest/vcpkg.json" <<'EOF'
          {
            "name": "gmssl-port-contract",
            "version-string": "1",
            "dependencies": ["gmssl"]
          }
          EOF
          "$VCPKG_ROOT/vcpkg" install --x-manifest-root="$manifest" --x-install-root="$install" --triplet x64-linux
          test -f "$install/x64-linux/include/gmssl/tls.h"
          test -f "$install/x64-linux/lib/libgmssl.a"
      - name: Compile and link consumer
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gmssl-install/x64-linux"
          cat > "$RUNNER_TEMP/gmssl-consumer.c" <<'EOF'
          #include <gmssl/tls.h>
          int main(void) {
            return tls_protocol_name(TLS_protocol_tls13) == 0;
          }
          EOF
          cc "$RUNNER_TEMP/gmssl-consumer.c" -I"$root/include" -L"$root/lib" -lgmssl -o "$RUNNER_TEMP/gmssl-consumer"
          "$RUNNER_TEMP/gmssl-consumer"

  macos:
    name: GmSSL / macos-15
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Build GmSSL overlay
        shell: bash
        run: |
          set -euo pipefail
          triplet=arm64-osx
          manifest="$RUNNER_TEMP/gmssl-manifest"
          install="$RUNNER_TEMP/gmssl-install"
          mkdir -p "$manifest"
          cat > "$manifest/vcpkg.json" <<'EOF'
          {
            "name": "gmssl-port-contract",
            "version-string": "1",
            "dependencies": ["gmssl"]
          }
          EOF
          "$VCPKG_ROOT/vcpkg" install --x-manifest-root="$manifest" --x-install-root="$install" --triplet "$triplet"
          test -f "$install/$triplet/include/gmssl/tls.h"
          test -f "$install/$triplet/lib/libgmssl.a"
      - name: Compile and link consumer
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gmssl-install/arm64-osx"
          cat > "$RUNNER_TEMP/gmssl-consumer.c" <<'EOF'
          #include <gmssl/tls.h>
          int main(void) {
            return tls_protocol_name(TLS_protocol_tls13) == 0;
          }
          EOF
          cc "$RUNNER_TEMP/gmssl-consumer.c" -I"$root/include" -L"$root/lib" -lgmssl -o "$RUNNER_TEMP/gmssl-consumer"
          "$RUNNER_TEMP/gmssl-consumer"

  windows:
    name: GmSSL / windows-2025 v145
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Build GmSSL overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $triplet = "qigao-x64-windows-v145"
          $manifest = Join-Path $env:RUNNER_TEMP "gmssl-manifest"
          $install = Join-Path $env:RUNNER_TEMP "gmssl-install"
          New-Item -ItemType Directory -Force -Path $manifest | Out-Null
          @'
          {
            "name": "gmssl-port-contract",
            "version-string": "1",
            "dependencies": ["gmssl"]
          }
          '@ | Set-Content -LiteralPath (Join-Path $manifest "vcpkg.json") -Encoding utf8
          & "$env:VCPKG_ROOT\vcpkg.exe" install "--x-manifest-root=$manifest" "--x-install-root=$install" "--triplet=$triplet" "--host-triplet=$triplet"
          if ($LASTEXITCODE -ne 0) { throw "GmSSL vcpkg install failed" }
          $root = Join-Path $install $triplet
          if (-not (Test-Path (Join-Path $root "include\gmssl\tls.h"))) { throw "tls.h missing" }
          if (-not (Test-Path (Join-Path $root "lib\gmssl.lib"))) { throw "gmssl.lib missing" }
      - name: Compile and link consumer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $triplet = "qigao-x64-windows-v145"
          $root = Join-Path (Join-Path $env:RUNNER_TEMP "gmssl-install") $triplet
          $source = Join-Path $env:RUNNER_TEMP "gmssl-consumer.c"
          @'
          #include <gmssl/tls.h>
          int main(void) {
            return tls_protocol_name(TLS_protocol_tls13) == 0;
          }
          '@ | Set-Content -LiteralPath $source -Encoding ascii
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"
          $out = Join-Path $env:RUNNER_TEMP "gmssl-consumer.exe"
          $cmd = '"'+$devcmd+'" -arch=x64 && cl /nologo /TC /I"'+$root+'\include" "'+$source+'" /link /LIBPATH:"'+$root+'\lib" gmssl.lib ws2_32.lib advapi32.lib /OUT:"'+$out+'"'
          cmd /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "GmSSL consumer link failed" }
          $env:PATH = (Join-Path $root "bin") + ";" + $env:PATH
          & $out
          if ($LASTEXITCODE -ne 0) { throw "GmSSL consumer failed" }

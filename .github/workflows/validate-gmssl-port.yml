  windows:
    name: GmSSL / windows-2025 LLVM-MinGW
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Use canonical Windows LLVM-MinGW (no MSVC toolchain)
        id: llvm
        uses: ./.github/actions/setup-llvm-mingw
        with:
          target: x64
          build-type: toolchain-only
          obfuscator: "false"
      - name: Bootstrap pinned curl-only vcpkg for source-build Windows LLVM-MinGW
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          manifest-root: cache-contracts/optional-feature
          triplet: qigao-x64-windows-llvm-mingw
          host-triplet: qigao-x64-windows-llvm-mingw
      - name: Build GmSSL overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $triplet = "qigao-x64-windows-llvm-mingw"
          $manifest = Join-Path $env:RUNNER_TEMP "gmssl-manifest"
          $install = Join-Path $env:RUNNER_TEMP "gmssl-install"
          New-Item -ItemType Directory -Force -Path $manifest | Out-Null
          @'
          {
            "name": "gmssl-port-contract",
            "version-string": "1",
            "dependencies": ["gmssl"]
          }
          '@ | Set-Content -LiteralPath (Join-Path $manifest "vcpkg.json") -Encoding utf8
          $env:VCPKG_BINARY_SOURCES = 'clear'
          & "$env:VCPKG_ROOT\vcpkg.exe" install "--x-manifest-root=$manifest" "--x-install-root=$install" "--triplet=$triplet" "--host-triplet=$triplet"
          if ($LASTEXITCODE -ne 0) { throw "GmSSL vcpkg install failed" }
          $root = Join-Path $install $triplet
          if (-not (Test-Path (Join-Path $root "include\gmssl\tls.h"))) { throw "tls.h missing" }
          if (-not (Test-Path (Join-Path $root "lib\libgmssl.a"))) { throw "libgmssl.a missing" }
          if (Test-Path (Join-Path $root "bin\gmssl.dll")) { throw "GmSSL provider must be packaged statically" }
      - name: Verify TLS 1.2 ALPN wire contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $triplet = "qigao-x64-windows-llvm-mingw"
          $root = Join-Path (Join-Path $env:RUNNER_TEMP "gmssl-install") $triplet
          $build = Join-Path $env:RUNNER_TEMP "gmssl-tls12-alpn-build"
          cmake -S ports/gmssl/tests -B $build -G Ninja "-DCMAKE_BUILD_TYPE=Release" "-DCMAKE_PREFIX_PATH=$root" "-DCMAKE_TOOLCHAIN_FILE=${{ steps.llvm.outputs.toolchain-file }}"
          if ($LASTEXITCODE -ne 0) { throw "TLS 1.2 ALPN contract configure failed" }
          cmake --build $build --config Release
          if ($LASTEXITCODE -ne 0) { throw "TLS 1.2 ALPN contract build failed" }
          $env:PATH = (Join-Path $root "bin") + ";" + $env:PATH
          & (Join-Path $build "gmssl-des-cbc-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "DES-CBC compatibility contract failed" }
          & (Join-Path $build "gmssl-tls12-alpn-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "TLS 1.2 ALPN wire contract failed" }
          & (Join-Path $build "gmssl-tls-version-range-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "TLS version-range contract failed" }
          & (Join-Path $build "gmssl-tls-version-range-dispatch-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "TLS version-range dispatch contract failed" }
          & (Join-Path $build "gmssl-tls-version-range-server-dispatch-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "TLS server version-range dispatch contract failed" }
          & (Join-Path $build "gmssl-rsa-public-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "RSA public operation contract failed" }
          & (Join-Path $build "gmssl-rsa-signature-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "RSA signature verification contract failed" }
          & (Join-Path $build "gmssl-x509-rsa-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "X.509 RSA verification contract failed" }
          & (Join-Path $build "gmssl-tls-exporter-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "TLS exporter contract failed" }
          & (Join-Path $build "gmssl-tls13-rsa-pss-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "TLS 1.3 RSA-PSS contract failed" }
          & (Join-Path $build "gmssl-rsa-private-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "RSA private parser contract failed" }
          & (Join-Path $build "gmssl-rsa-private-op-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "RSA private operation contract failed" }
          & (Join-Path $build "gmssl-rsa-pkcs8-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "RSA PKCS8 identity contract failed" }
          & (Join-Path $build "gmssl-rsa-encrypted-pkcs8-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "encrypted RSA PKCS8 key_password contract failed" }
          & (Join-Path $build "gmssl-rsa-private-signatures-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "RSA private signing contract failed" }
          & (Join-Path $build "gmssl-tls-inspection-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "TLS inspection contract failed" }
          & (Join-Path $build "gmssl-tls12-ecdhe-rsa-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "TLS 1.2 ECDHE_RSA contract failed" }
          & (Join-Path $build "gmssl-x509-basic-constraints-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "X.509 BasicConstraints contract failed" }
          & (Join-Path $build "gmssl-tls-cleanup-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "TLS cleanup contract failed" }
          & (Join-Path $build "gmssl-p256-plain-pkcs8-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "P-256 plain PKCS8 identity contract failed" }
          & (Join-Path $build "gmssl-p256-ecdsa-der-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "P-256 ECDSA DER scalar padding contract failed" }
          & (Join-Path $build "gmssl-tls13-external-io-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "callback-only TLS 1.3 external-I/O contract failed" }
          & (Join-Path $build "gmssl-tls12-external-io-contract.exe")
          if ($LASTEXITCODE -ne 0) { throw "callback-only TLS 1.2 external-I/O contract failed" }
          & (Join-Path $build "gmssl-tls13-external-io-contract.exe") --no-sni
          if ($LASTEXITCODE -ne 0) { throw "TLS 1.3 no-SNI contract failed" }
          & (Join-Path $build "gmssl-tls12-external-io-contract.exe") --no-sni
          if ($LASTEXITCODE -ne 0) { throw "TLS 1.2 no-SNI contract failed" }
          $debugBuild = Join-Path $env:RUNNER_TEMP "gmssl-tls12-alpn-debug"
          cmake -S ports/gmssl/tests -B $debugBuild -G Ninja "-DCMAKE_BUILD_TYPE=Debug" "-DCMAKE_PREFIX_PATH=$root" "-DCMAKE_TOOLCHAIN_FILE=${{ steps.llvm.outputs.toolchain-file }}"
          if ($LASTEXITCODE -ne 0) { throw "Debug external-I/O contract configure failed" }
          cmake --build $debugBuild --target gmssl-tls13-external-io-contract gmssl-tls12-external-io-contract
          if ($LASTEXITCODE -ne 0) { throw "Debug external-I/O contract build failed" }
          & (Join-Path $debugBuild "gmssl-tls13-external-io-contract.exe") --no-sni
          if ($LASTEXITCODE -ne 0) { throw "Debug TLS 1.3 no-SNI contract failed" }
          & (Join-Path $debugBuild "gmssl-tls12-external-io-contract.exe") --no-sni
          if ($LASTEXITCODE -ne 0) { throw "Debug TLS 1.2 no-SNI contract failed" }
          & (Join-Path $debugBuild "gmssl-tls13-external-io-contract.exe") --no-sni --request-client
          if ($LASTEXITCODE -ne 0) { throw "Debug TLS 1.3 optional client identity contract failed" }


  android:
    name: GmSSL / Android arm64 build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap pinned curl-only vcpkg for source-build Android arm64
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          manifest-root: cache-contracts/optional-feature
          triplet: arm64-android
          host-triplet: x64-linux
      - name: Build Android GmSSL overlay
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_NDK_HOME:-}"
          manifest="$RUNNER_TEMP/gmssl-android-manifest"
          install="$RUNNER_TEMP/gmssl-android-install"
          mkdir -p "$manifest"
          cat > "$manifest/vcpkg.json" <<'EOF'
          {
            "name": "gmssl-android-contract",
            "version-string": "1",
            "dependencies": ["gmssl"]
          }
          EOF
          VCPKG_BINARY_SOURCES=clear "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$manifest" --x-install-root="$install" \
            --triplet arm64-android --host-triplet x64-linux
          root="$install/arm64-android"
          test -f "$root/include/gmssl/rand.h"
          test -f "$root/lib/libgmssl.a"

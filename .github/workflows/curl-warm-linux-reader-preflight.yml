name: Curl-only Linux generic warm-cache L2 admission (NO PUBLISH)

on:
  pull_request:
    paths:
      - ".github/workflows/warm-cache.yml"
      - ".github/workflows/curl-warm-linux-reader-preflight.yml"
      - "scripts/ci/verify-native-linux-l2.sh"
      - "scripts/tests/test_curl_cache_warm_linux_reader.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  policy:
    name: Reject native NuGet provider and L1 reset after curl download
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test exact Linux warm-cache consumer parity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests \
            -p test_curl_cache_warm_linux_reader.py -v

  read-back:
    name: Linux x64 official immutable ABI from fresh local files L1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare compiler tools before source-dependent ABI resolution
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm libudev-dev autoconf automake libtool
      - name: Require empty L1 before restoring official immutable NuGet package ABIs
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/empty-native-warm-linux-l1"
          rm -rf "$cache"
          mkdir -p "$cache"
          test -z "$(find "$cache" -type f -name '*.zip' -print -quit)"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"
      - name: Download exact published vcpkg ABI closure with curl only
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          manifest-root: .
          triplet: x64-linux
          host-triplet: x64-linux
      - name: Install only exact native binary packages (no source fallback)
        shell: bash
        run: bash scripts/ci/verify-native-linux-l2.sh generic

name: Qualify pinned compiler setup composite actions

on:
  pull_request:
    paths:
      - '.github/actions/setup-llvm-mingw/**'
      - '.github/actions/setup-llvm-native/**'
      - '.github/actions/setup-tinycc-builder/**'
      - '.github/workflows/validate-compiler-setup-actions.yml'
      - 'compiler-contracts/release-obfuscation.json'
      - 'scripts/setup-compiler-toolchain.py'
      - 'scripts/ci/build_llvm_obfuscator_candidate.py'
      - 'scripts/ci/verify_llvm_mingw_obfuscation.py'
      - 'scripts/tests/test_compiler_setup_actions.py'
      - 'tests/compiler-consumers/**'
      - 'docs/setup-compiler-actions.md'
  push:
    branches: [master]
    paths:
      - '.github/actions/setup-llvm-mingw/**'
      - '.github/actions/setup-llvm-native/**'
      - '.github/actions/setup-tinycc-builder/**'
      - '.github/workflows/validate-compiler-setup-actions.yml'
      - 'compiler-contracts/release-obfuscation.json'
      - 'scripts/setup-compiler-toolchain.py'
      - 'scripts/ci/build_llvm_obfuscator_candidate.py'
      - 'scripts/ci/verify_llvm_mingw_obfuscation.py'
      - 'scripts/tests/test_compiler_setup_actions.py'
      - 'tests/compiler-consumers/**'
  workflow_dispatch:
    inputs:
      plugin_host:
        description: Exactly one real host source-build candidate (do not launch all expensive runners)
        required: true
        type: choice
        options:
          - linux-x64
          - linux-arm64
          - macos-arm64

permissions:
  contents: read

concurrency:
  group: compiler-setup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    name: Unit / archive safety and fail-closed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_compiler_setup_actions.py' -v
      - run: python3 -m unittest discover -s scripts/tests -p 'test_release_obfuscation_policy.py' -v
      - run: python3 scripts/ci/validate_release_obfuscation.py --validate-only


  native-llvm-obfuscator-candidate:
    # Opt-in only: ~2GB official LLVM archive, plus extraction and CMake.
    # Keep it inside the SAME compiler workflow; no extra probe workflow or
    # consumer/installer project. PR body marker enables once; dispatch reruns.
    if: (github.event_name == 'workflow_dispatch' && inputs.plugin_host == 'linux-x64') || contains(github.event.pull_request.body, '[host-plugin-candidate]')
    name: Real pinned LLVM host plugin / Linux x64 IR and native parity
    needs: offline-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache/llvm23-obf-plugin
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install and pin build cache tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache ninja-build cmake
          ccache --version
          cmake --version
          ninja --version
      - name: Restore compiler pass build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache/llvm23-obf-plugin
          key: llvm23-obf-plugin-linux-x64-v1-${{ github.sha }}
          restore-keys: |
            llvm23-obf-plugin-linux-x64-v1-
      - id: llvm
        uses: ./.github/actions/setup-llvm-native
        with:
          version: llvmorg-23.1.4
          target: x64
          build-type: toolchain-only
      - name: Compile actual source SHA plugin and check every pass on native LLVM 23.1.4
        shell: bash
        env:
          NATIVE_LLVM_ROOT: ${{ steps.llvm.outputs.root }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test -x "$NATIVE_LLVM_ROOT/bin/clang"
          python3 scripts/ci/build_llvm_obfuscator_candidate.py \
            --host linux-x64 --target linux-x64 \
            --llvm-root "$NATIVE_LLVM_ROOT" \
            --output "$RUNNER_TEMP/qigao-llvm23-host-plugin"
          test -s "$RUNNER_TEMP/qigao-llvm23-host-plugin/artifact/candidate.json"
          test -s "$RUNNER_TEMP/qigao-llvm23-host-plugin/artifact/preflight/obfuscation-preflight.json"
          ccache -s
      - name: Retain exact host plugin candidate and full IR/native receipt
        uses: actions/upload-artifact@v4
        with:
          name: llvm23-obfuscator-linux-x64-source-candidate
          path: |
            ${{ runner.temp }}/qigao-llvm23-host-plugin/artifact/
          if-no-files-found: error
          retention-days: 7

  native-llvm-obfuscator-linux-arm64:
    # Opt-in only: ~2GB official LLVM archive, plus extraction and CMake.
    # Keep it inside the SAME compiler workflow; no extra probe workflow or
    # consumer/installer project. PR body marker enables once; dispatch reruns.
    if: (github.event_name == 'workflow_dispatch' && inputs.plugin_host == 'linux-arm64') || contains(github.event.pull_request.body, '[host-plugin-linux-arm64]')
    name: Real pinned LLVM host plugin / Linux ARM64 IR and native parity
    needs: offline-contract
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache/llvm23-obf-plugin-arm64
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install and pin build cache tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache ninja-build cmake
          ccache --version
          cmake --version
          ninja --version
      - name: Restore compiler pass build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache/llvm23-obf-plugin-arm64
          key: llvm23-obf-plugin-linux-arm64-v1-${{ github.sha }}
          restore-keys: |
            llvm23-obf-plugin-linux-arm64-v1-
      - id: llvm
        uses: ./.github/actions/setup-llvm-native
        with:
          version: llvmorg-23.1.4
          target: arm64
          build-type: toolchain-only
      - name: Compile actual source SHA plugin and check every pass on native LLVM 23.1.4
        shell: bash
        env:
          NATIVE_LLVM_ROOT: ${{ steps.llvm.outputs.root }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test -x "$NATIVE_LLVM_ROOT/bin/clang"
          python3 scripts/ci/build_llvm_obfuscator_candidate.py \
            --host linux-arm64 --target linux-arm64 \
            --llvm-root "$NATIVE_LLVM_ROOT" \
            --output "$RUNNER_TEMP/qigao-llvm23-host-plugin-arm64"
          test -s "$RUNNER_TEMP/qigao-llvm23-host-plugin-arm64/artifact/candidate.json"
          test -s "$RUNNER_TEMP/qigao-llvm23-host-plugin-arm64/artifact/preflight/obfuscation-preflight.json"
          ccache -s
      - name: Retain exact host plugin candidate and full IR/native receipt
        uses: actions/upload-artifact@v4
        with:
          name: llvm23-obfuscator-linux-arm64-source-candidate
          path: |
            ${{ runner.temp }}/qigao-llvm23-host-plugin-arm64/artifact/
          if-no-files-found: error
          retention-days: 7

  native-llvm-obfuscator-macos-arm64:
    # Opt-in only: ~2GB official LLVM archive, plus extraction and CMake.
    # Keep it inside the SAME compiler workflow; no extra probe workflow or
    # consumer/installer project. PR body marker enables once; dispatch reruns.
    if: (github.event_name == 'workflow_dispatch' && inputs.plugin_host == 'macos-arm64') || contains(github.event.pull_request.body, '[host-plugin-macos-arm64]')
    name: Real pinned LLVM host plugin / macOS ARM64 IR and native parity
    needs: offline-contract
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache/llvm23-obf-plugin-macos-arm64
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install and pin build cache tools
        shell: bash
        run: |
          set -euo pipefail
          brew install ccache
          command -v cmake
          command -v ninja
          ccache --version
          cmake --version
          ninja --version
      - name: Restore compiler pass build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache/llvm23-obf-plugin-macos-arm64
          key: llvm23-obf-plugin-macos-arm64-v1-${{ github.sha }}
          restore-keys: |
            llvm23-obf-plugin-macos-arm64-v1-
      - id: llvm
        uses: ./.github/actions/setup-llvm-native
        with:
          version: llvmorg-23.1.4
          target: arm64
          build-type: toolchain-only
      - name: Compile actual source SHA plugin and check every pass on native LLVM 23.1.4
        shell: bash
        env:
          NATIVE_LLVM_ROOT: ${{ steps.llvm.outputs.root }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test -x "$NATIVE_LLVM_ROOT/bin/clang"
          python3 scripts/ci/build_llvm_obfuscator_candidate.py \
            --host macos-arm64 --target macos-arm64 \
            --llvm-root "$NATIVE_LLVM_ROOT" \
            --output "$RUNNER_TEMP/qigao-llvm23-host-plugin-arm64"
          test -s "$RUNNER_TEMP/qigao-llvm23-host-plugin-arm64/artifact/candidate.json"
          test -s "$RUNNER_TEMP/qigao-llvm23-host-plugin-arm64/artifact/preflight/obfuscation-preflight.json"
          ccache -s
      - name: Retain exact host plugin candidate and full IR/native receipt
        uses: actions/upload-artifact@v4
        with:
          name: llvm23-obfuscator-macos-arm64-source-candidate
          path: |
            ${{ runner.temp }}/qigao-llvm23-host-plugin-arm64/artifact/
          if-no-files-found: error
          retention-days: 7

  llvm-mingw:
    name: LLVM-MinGW / ${{ matrix.host }} -> Windows ${{ matrix.target }}
    needs: offline-contract
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {host: ubuntu-24.04, target: arm64, native: false}
          - {host: macos-15, target: x64, native: false}
          - {host: windows-2025, target: x64, native: true}
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: llvm
        uses: ./.github/actions/setup-llvm-mingw
        with:
          version: "20261020"
          target: ${{ matrix.target }}
          build-type: toolchain-only
          verify-smoke: "true"
      - name: Assert installed compiler and true smoke level
        shell: pwsh
        env:
          CC_PATH: ${{ steps.llvm.outputs.cc }}
          CXX_PATH: ${{ steps.llvm.outputs.cxx }}
          TOOLCHAIN_FILE: ${{ steps.llvm.outputs.toolchain-file }}
          COMPILER_ROOT: ${{ steps.llvm.outputs.root }}
          SMOKE: ${{ steps.llvm.outputs.smoke }}
          EXPECT_NATIVE: ${{ matrix.native }}
          RELEASE_QUALIFIED: ${{ steps.llvm.outputs.release-qualified }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @($env:CC_PATH,$env:CXX_PATH,$env:TOOLCHAIN_FILE)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing output file: $path" }
          }
          if ($env:RELEASE_QUALIFIED -ne 'false') { throw 'Compiler-only setup may not qualify Release' }
          if ($env:EXPECT_NATIVE -eq 'true' -and $env:SMOKE -ne 'native-execution') {
            throw 'Native Windows executable was not run'
          }
          if ($env:EXPECT_NATIVE -eq 'false' -and $env:SMOKE -ne 'cross-compile-pe-machine') {
            throw 'Cross-compiled Windows PE machine was not validated'
          }
          $toolchain = Get-Content -LiteralPath $env:TOOLCHAIN_FILE -Raw
          if (-not $toolchain.Contains($env:COMPILER_ROOT.Replace('\','/'))) {
            throw 'Generated CMake toolchain contains stale staging paths'
          }
          if ($toolchain.Contains('.qigao-compiler-')) {
            throw 'Staging location leaked into downstream CMake toolchain'
          }
      - name: Compile real downstream C and C++ CMake consumers
        shell: pwsh
        env:
          TOOLCHAIN_FILE: ${{ steps.llvm.outputs.toolchain-file }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'qigao-llvm-consumer-build'
          cmake -S tests/compiler-consumers/llvm -B $out -G Ninja `
            "-DCMAKE_TOOLCHAIN_FILE=$env:TOOLCHAIN_FILE" "-DCMAKE_BUILD_TYPE=Debug"
          if ($LASTEXITCODE -ne 0) { throw 'LLVM-MinGW C/C++ CMake configure failed' }
          cmake --build $out --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'LLVM-MinGW C/C++ CMake build failed' }

  tinycc-builder:
    name: TinyCC-builder / Windows x64 -> ${{ matrix.target }}
    needs: offline-contract
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [x86, x64, arm64]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: tcc
        uses: ./.github/actions/setup-tinycc-builder
        with:
          version: "2026-10-29"
          target: ${{ matrix.target }}
          build-type: toolchain-only
          verify-smoke: "true"
      - name: Verify source header digest, target-specific compiler and smoke result
        shell: pwsh
        env:
          TCC: ${{ steps.tcc.outputs.cc }}
          HEADER: ${{ steps.tcc.outputs.obfus-header }}
          INCLUDE_DIR: ${{ steps.tcc.outputs.obfus-include }}
          SMOKE: ${{ steps.tcc.outputs.smoke }}
          TARGET: ${{ matrix.target }}
          RELEASE_QUALIFIED: ${{ steps.tcc.outputs.release-qualified }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:TCC -PathType Leaf) -or
              -not (Test-Path -LiteralPath $env:HEADER -PathType Leaf)) {
            throw 'Pinned TinyCC or obfus.h is missing'
          }
          $hash = (Get-FileHash -LiteralPath $env:HEADER -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'fcb3a591f95413ea1fe41d11f0fe1ccf0927b492e42697680c3b058c09c199da') {
            throw 'Incorrect pinned obfus.h header'
          }
          if ($env:RELEASE_QUALIFIED -ne 'false') { throw 'Unqualified release was advertised' }
          if ($env:TARGET -eq 'arm64') {
            if ($env:SMOKE -ne 'cross-compile-pe-machine') { throw 'ARM64 is cross-only' }
          } elseif ($env:SMOKE -ne 'native-execution') {
            throw 'Native x86/x64 Windows runtime was not exercised'
          }
      - name: Test TinyCC C-only CMake consumer
        if: matrix.target != 'arm64'
        shell: pwsh
        env:
          TOOLCHAIN_FILE: ${{ steps.tcc.outputs.toolchain-file }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'qigao-tcc-consumer-build'
          cmake -S tests/compiler-consumers/tinycc -B $out -G Ninja `
            "-DCMAKE_TOOLCHAIN_FILE=$env:TOOLCHAIN_FILE"
          if ($LASTEXITCODE -ne 0) { throw 'TinyCC CMake C-only configure failed' }
          cmake --build $out
          if ($LASTEXITCODE -ne 0) { throw 'TinyCC CMake C-only build failed' }
      - name: Check actual pinned obfus.h two-seed semantic parity
        if: matrix.target != 'arm64'
        shell: pwsh
        env:
          TCC: ${{ steps.tcc.outputs.cc }}
          INCLUDE_DIR: ${{ steps.tcc.outputs.obfus-include }}
        run: |
          $ErrorActionPreference = 'Stop'
          $results = @()
          foreach ($seed in @('0u', '123456789u')) {
            $exe = Join-Path $env:RUNNER_TEMP "qigao-protected-$seed.exe"
            & $env:TCC "-I$env:INCLUDE_DIR" "-DOBFH_TEST_SEED=$seed" `
              tests/compiler-consumers/tinycc/protected.c -o $exe
            if ($LASTEXITCODE -ne 0) { throw "Protected TinyCC source compilation failed: $seed" }
            $result = & $exe
            if ($LASTEXITCODE -ne 0) { throw "Protected TinyCC executable failed: $seed" }
            $results += ($result | Out-String).Trim()
          }
          if ($results.Count -ne 2 -or $results[0] -ne $results[1]) {
            throw 'Two TinyCC protection seeds changed application behavior'
          }
          Write-Host ('Native obfus.h two-seed semantic parity: ' + $results[0])

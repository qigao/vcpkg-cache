name: Publish TurboWasm spec tools cache

on:
  push:
    branches: [master]
    paths:
      - "manifests/turbowasm-spec-tools/**"
      - ".github/actions/setup-vcpkg-cache/**"
      - ".github/workflows/turbowasm-spec-tools-cache.yml"
      - "vcpkg-tool-version.txt"
      - "vcpkg-scripts-revision.txt"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  warm:
    name: Warm WABT Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite

      - name: Prepare host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config

      - name: Build and publish WABT profile
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/turbowasm-spec-tools-warm"
          rm -rf "$install_root"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$VCPKG_CACHE_REPOSITORY_ROOT/manifests/turbowasm-spec-tools" \
            --x-install-root="$install_root" \
            --triplet x64-linux
          tool="$install_root/x64-linux/tools/wabt/wast2json"
          test -x "$tool"
          "$tool" --version

  cache-contract:
    name: Verify WABT clean cache restore
    needs: warm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Use empty L1 cache
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/empty-turbowasm-spec-tools-l1"
          rm -rf "$cache"
          mkdir -p "$cache"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read

      - name: Restore WABT from GitHub Packages only
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/turbowasm-spec-tools-cache.log"
          install_root="$RUNNER_TEMP/turbowasm-spec-tools-restored"
          rm -rf "$install_root"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$VCPKG_CACHE_REPOSITORY_ROOT/manifests/turbowasm-spec-tools" \
            --x-install-root="$install_root" \
            --triplet x64-linux \
            --only-binarycaching 2>&1 | tee "$log"
          ! grep -Eq '^Building [^:]+:x64-linux' "$log"
          grep -Eq 'Restored [1-9][0-9]* package\(s\) from NuGet' "$log"
          tool="$install_root/x64-linux/tools/wabt/wast2json"
          test -x "$tool"
          "$tool" --version

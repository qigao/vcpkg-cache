name: WTL 10 source-only overlay qualification

on:
  pull_request:
    paths:
      - "ports/wtl/**"
      - "tests/wtl-overlay-policy.py"
      - ".github/workflows/validate-wtl-overlay.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: wtl-overlay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pinned-header-port:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Static single-source and no-Microsoft-ATL policy
        run: python tests/wtl-overlay-policy.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap pinned vcpkg with curl-only files cache (no Mono/NuGet)
        shell: pwsh
        run: |
          python scripts/setup-vcpkg-curl-cache.py .
          if ($LASTEXITCODE -ne 0) { throw 'Pinned vcpkg bootstrap failed' }
      - name: Install WTL using only this overlay port
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "wtl10-overlay-installed"
          Set-Location $env:RUNNER_TEMP
          & "$env:VCPKG_ROOT/vcpkg.exe" install wtl:x64-windows-static `
            "--overlay-ports=$env:VCPKG_OVERLAY_PORTS" `
            "--x-install-root=$root"
          if ($LASTEXITCODE -ne 0) { throw 'WTL vcpkg install failed' }
          $headerArgs = @('install', 'wtl:qigao-wtl10-headers',
            "--overlay-ports=$env:VCPKG_OVERLAY_PORTS",
            "--overlay-triplets=$env:VCPKG_OVERLAY_TRIPLETS",
            "--x-install-root=$root")
          & "$env:VCPKG_ROOT/vcpkg.exe" @headerArgs
          if ($LASTEXITCODE -ne 0) { throw 'Header-only cross-triplet WTL install failed' }
          $headerPrefix = Join-Path $root "qigao-wtl10-headers/include"
          if (!(Test-Path (Join-Path $headerPrefix "atlapp.h"))) {
            throw 'Header-only cross-triplet WTL headers missing'
          }
          $include = Join-Path $root "x64-windows-static/include"
          $share = Join-Path $root "x64-windows-static/share/wtl"
          foreach ($name in @('atlapp.h','atlframe.h','atlctrls.h','atldlgs.h','atlmisc.h','atlribbon.h')) {
            if (!(Test-Path (Join-Path $include $name))) { throw "missing WTL header: $name" }
          }
          $ribbon = Get-Content (Join-Path $include 'atlribbon.h') -Raw
          if ($ribbon.Split('this->template UIAddElement<').Length -ne 3 -or
              $ribbon.Split('this->template UIRemoveElement<').Length -ne 3 -or
              !$ribbon.Contains('VarI4FromDec(pDecimal != NULL ? &copy : NULL, &val)')) {
            throw 'Original WTL Clang-compatible dependent template/const DECIMAL patch missing'
          }
          if ($ribbon.Contains('this->UIAddElement<') -or
              $ribbon.Contains('this->UIRemoveElement<')) {
            throw 'Unpatched dependent-template syntax remains in pinned WTL'
          }
          $ctrlw = Get-Content (Join-Path $include 'atlctrlw.h') -Raw
          if ($ctrlw.Split('szString[T::_nMaxMenuItemTextLength]').Length -ne 4 -or
              $ctrlw.Contains('szString[pT->_nMaxMenuItemTextLength]')) {
            throw 'WTL Clang constexpr command-bar input capacities were not patched'
          }
          $ctrlx = Get-Content (Join-Path $include 'atlctrlx.h') -Raw
          if (!$ctrlx.Contains('pszTemp[T::m_cchCmpTextMax]') -or
              $ctrlx.Contains('pszTemp[pT->m_cchCmpTextMax]')) {
            throw 'WTL Clang constexpr list-sort input capacity was not patched'
          }
          foreach($symbol in @('class CServerAppModule','class CPrintDialogEx','class CRegProperty')) {
            # Preserve source by verifying original WTL full public API in
            # the installed headers, never by pruning problematic classes.
            $file = if($symbol -like '*CServer*'){'atlapp.h'} elseif($symbol -like '*Print*'){'atldlgs.h'} else{'atlmisc.h'}
            if(!(Select-String -Path (Join-Path $include $file) -SimpleMatch -Pattern $symbol -Quiet)) {
              throw "WTL public API missing: $symbol"
            }
          }
          foreach ($name in @('copyright','openatl-wtl-source.txt',
                             'Samples/GuidGen/GuidGen.cpp',
                             'Samples/WTLExplorer/WTLExplorer.cpp',
                             'AppWizard/Setup.js')) {
            if (!(Test-Path (Join-Path $share $name))) { throw "missing source: $name" }
          }
          $provenance = Get-Content (Join-Path $share 'openatl-wtl-source.txt') -Raw
          if (!$provenance.Contains('sha512=086a6cf6a49a4318a8c519136ba6019ded7aa7f2c1d85f78c30b21183654537b3428a400a64fcdacba3a7a10a9ef05137b6f2119f59594da300d55f9ebfb1309')) { throw 'WTL provenance mismatch' }
          if (!$provenance.Contains('provider=vcpkg-cache/ports/wtl')) { throw 'WTL source provider mismatch' }
      - name: Prove cold WTL source digest and read-only warm ABI restoration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:VCPKG_ROOT 'downloads/wtl-10.0.10320-065ef559.zip'
          $expectedSha512 = '086a6cf6a49a4318a8c519136ba6019ded7aa7f2c1d85f78c30b21183654537b3428a400a64fcdacba3a7a10a9ef05137b6f2119f59594da300d55f9ebfb1309'
          if (!(Test-Path $archive)) { throw 'Cold WTL 10 source archive not cached' }
          if ((Get-FileHash -Algorithm SHA512 $archive).Hash.ToLowerInvariant() -ne $expectedSha512) {
            throw 'Cold WTL 10 original ZIP SHA512 mismatch'
          }
          $coldRoot = Join-Path $env:RUNNER_TEMP 'wtl10-overlay-installed'
          $warmRoot = Join-Path $env:RUNNER_TEMP 'wtl10-overlay-warm'
          $env:VCPKG_BINARY_SOURCES = "clear;files,$env:VCPKG_BINARY_CACHE,read"
          # Force classic mode as in the cold install. Workflow steps start in
          # the repository root, which has an unrelated generic vcpkg manifest.
          Set-Location $env:RUNNER_TEMP
          foreach ($triplet in @('x64-windows-static', 'qigao-wtl10-headers')) {
            $args_ = @('install', "wtl:$triplet", '--only-binarycaching',
              "--overlay-ports=$env:VCPKG_OVERLAY_PORTS",
              "--overlay-triplets=$env:VCPKG_OVERLAY_TRIPLETS",
              "--x-install-root=$warmRoot")
            & "$env:VCPKG_ROOT/vcpkg.exe" @args_
            if ($LASTEXITCODE -ne 0) {
              throw "WTL warm read-only cache miss for triplet $triplet"
            }
            foreach ($part in @(
                'include/atlapp.h', 'include/atldlgs.h', 'include/atlmisc.h',
                'share/wtl/copyright', 'share/wtl/openatl-wtl-source.txt',
                'share/wtl/Samples/GuidGen/GuidGen.cpp',
                'share/wtl/Samples/WTLExplorer/WTLExplorer.cpp',
                'share/wtl/AppWizard/Setup.js')) {
              $cold = Join-Path (Join-Path $coldRoot $triplet) $part
              $warm = Join-Path (Join-Path $warmRoot $triplet) $part
              if (!(Test-Path $cold) -or !(Test-Path $warm)) {
                throw "Missing cold/warm WTL input $triplet/$part"
              }
              $coldHash = (Get-FileHash -Algorithm SHA256 $cold).Hash.ToLowerInvariant()
              $warmHash = (Get-FileHash -Algorithm SHA256 $warm).Hash.ToLowerInvariant()
              if ($coldHash -ne $warmHash) {
                throw "WTL cold/warm content mismatch $triplet/$part"
              }
            }
          }
          "WTL_COLD_WARM_OK version=10.0.10320#7 triplets=2 source_sha512=$expectedSha512 binarycache=read-only microsoft-atl=absent" >> $env:GITHUB_STEP_SUMMARY

name: Validate TurboWasm MIR profile

on:
  pull_request:
    paths:
      - "ports/mir/**"
      - "manifests/turbowasm-mir/**"
      - "tests/mir-consumer/**"
      - ".github/actions/setup-vcpkg-cache/**"
      - ".github/workflows/validate-turbowasm-mir.yml"
      - "vcpkg-tool-version.txt"
      - "vcpkg-scripts-revision.txt"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  linux:
    name: Linux x64 MIR JIT
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Prepare build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config
      - name: Install MIR profile
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$VCPKG_CACHE_REPOSITORY_ROOT/manifests/turbowasm-mir" \
            --x-install-root="$RUNNER_TEMP/turbowasm-mir-installed" \
            --triplet x64-linux
      - name: Build and execute installed consumer
        run: |
          cmake -S tests/mir-consumer -B build/mir-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/turbowasm-mir-installed/x64-linux"
          cmake --build build/mir-consumer
          ./build/mir-consumer/mir_consumer

  macos:
    name: macOS MIR JIT
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Resolve host triplet
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) echo "MIR_TRIPLET=x64-osx" >> "$GITHUB_ENV" ;;
            ARM64) echo "MIR_TRIPLET=arm64-osx" >> "$GITHUB_ENV" ;;
            *) echo "unsupported macOS arch: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
      - name: Install MIR profile
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$VCPKG_CACHE_REPOSITORY_ROOT/manifests/turbowasm-mir" \
            --x-install-root="$RUNNER_TEMP/turbowasm-mir-installed" \
            --triplet "$MIR_TRIPLET"
      - name: Build and execute installed consumer
        shell: bash
        run: |
          cmake -S tests/mir-consumer -B build/mir-consumer \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/turbowasm-mir-installed/$MIR_TRIPLET"
          cmake --build build/mir-consumer
          ./build/mir-consumer/mir_consumer

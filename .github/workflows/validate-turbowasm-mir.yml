name: Validate TurboWasm MIR profile

on:
  pull_request:
    paths:
      - "ports/mir/**"
      - "manifests/turbowasm-mir/**"
      - ".github/actions/setup-vcpkg-cache/**"
      - ".github/workflows/validate-turbowasm-mir.yml"
      - ".github/workflows/warm-cache.yml"
      - "vcpkg-tool-version.txt"
      - "vcpkg-scripts-revision.txt"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  linux:
    name: Linux x64 profile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Prepare host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config
      - name: Resolve MIR profile
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$VCPKG_CACHE_REPOSITORY_ROOT/manifests/turbowasm-mir" \
            --x-install-root=build/validate-turbowasm-mir-linux \
            --triplet x64-linux

  windows:
    name: Windows x64 profile
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Prepare host build tools
        shell: pwsh
        run: choco install ninja -y --no-progress
      - name: Resolve MIR profile
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            "--x-manifest-root=$env:VCPKG_CACHE_REPOSITORY_ROOT\manifests\turbowasm-mir" `
            "--x-install-root=build\validate-turbowasm-mir-windows" `
            --triplet x64-windows

  macos:
    name: macOS host profile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Resolve triplet
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) echo "VCPKG_VALIDATE_TRIPLET=x64-osx" >> "$GITHUB_ENV" ;;
            ARM64) echo "VCPKG_VALIDATE_TRIPLET=arm64-osx" >> "$GITHUB_ENV" ;;
            *) echo "unsupported macOS arch: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
      - name: Resolve MIR profile
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$VCPKG_CACHE_REPOSITORY_ROOT/manifests/turbowasm-mir" \
            --x-install-root=build/validate-turbowasm-mir-macos \
            --triplet "$VCPKG_VALIDATE_TRIPLET"

name: Validate TurboWasm MIR profile

on:
  pull_request:
    paths:
      - "ports/mir/**"
      - "manifests/turbowasm-mir/**"
      - ".github/actions/setup-vcpkg-cache/**"
      - ".github/workflows/validate-turbowasm-mir.yml"
      - ".github/workflows/warm-cache.yml"
      - "vcpkg-tool-version.txt"
      - "vcpkg-scripts-revision.txt"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  linux:
    name: Linux x64 profile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Prepare host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config
      - name: Resolve MIR profile
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$VCPKG_CACHE_REPOSITORY_ROOT/manifests/turbowasm-mir" \
            --x-install-root=build/validate-turbowasm-mir-linux \
            --triplet x64-linux

      - name: Qualify MIR CMake consumer
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/mir-consumer"
          rm -rf "$src"
          mkdir -p "$src"
          cat > "$src/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(mir_consumer C)
          find_package(MIR CONFIG REQUIRED)
          add_executable(mir_consumer main.c)
          target_link_libraries(mir_consumer PRIVATE MIR::mir)
          EOF
          cat > "$src/main.c" <<'EOF'
          #include <mir-gen.h>
          #include <mir.h>
          int main(void) {
              MIR_context_t ctx = MIR_init();
              if (ctx == 0) return 1;
              MIR_gen_init(ctx);
              MIR_gen_finish(ctx);
              MIR_finish(ctx);
              return 0;
          }
          EOF
          cmake -S "$src" -B "$src/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build/validate-turbowasm-mir-linux/x64-linux"
          cmake --build "$src/build"
          "$src/build/mir_consumer"

  windows:
    name: Windows x64 profile
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Prepare host build tools
        shell: pwsh
        run: choco install ninja -y --no-progress
      - name: Resolve MIR profile
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            "--x-manifest-root=$env:VCPKG_CACHE_REPOSITORY_ROOT\manifests\turbowasm-mir" `
            "--x-install-root=build\validate-turbowasm-mir-windows" `
            --triplet x64-windows

      - name: Qualify MIR CMake consumer
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP "mir-consumer"
          if (Test-Path $src) { Remove-Item -Recurse -Force $src }
          New-Item -ItemType Directory -Path $src | Out-Null
          @'
          cmake_minimum_required(VERSION 3.20)
          project(mir_consumer C)
          find_package(MIR CONFIG REQUIRED)
          add_executable(mir_consumer main.c)
          target_link_libraries(mir_consumer PRIVATE MIR::mir)
          '@ | Set-Content (Join-Path $src "CMakeLists.txt")
          @'
          #include <mir-gen.h>
          #include <mir.h>
          int main(void) {
              MIR_context_t ctx = MIR_init();
              if (ctx == 0) return 1;
              MIR_gen_init(ctx);
              MIR_gen_finish(ctx);
              MIR_finish(ctx);
              return 0;
          }
          '@ | Set-Content (Join-Path $src "main.c")
          cmake -S $src -B (Join-Path $src "build") -G Ninja `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DCMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE\build\validate-turbowasm-mir-windows\x64-windows"
          cmake --build (Join-Path $src "build")
          & (Join-Path $src "build\mir_consumer.exe")

  macos:
    name: macOS host profile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Resolve triplet
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) echo "VCPKG_VALIDATE_TRIPLET=x64-osx" >> "$GITHUB_ENV" ;;
            ARM64) echo "VCPKG_VALIDATE_TRIPLET=arm64-osx" >> "$GITHUB_ENV" ;;
            *) echo "unsupported macOS arch: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
      - name: Resolve MIR profile
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$VCPKG_CACHE_REPOSITORY_ROOT/manifests/turbowasm-mir" \
            --x-install-root=build/validate-turbowasm-mir-macos \
            --triplet "$VCPKG_VALIDATE_TRIPLET"

      - name: Qualify MIR CMake consumer
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/mir-consumer"
          rm -rf "$src"
          mkdir -p "$src"
          cat > "$src/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(mir_consumer C)
          find_package(MIR CONFIG REQUIRED)
          add_executable(mir_consumer main.c)
          target_link_libraries(mir_consumer PRIVATE MIR::mir)
          EOF
          cat > "$src/main.c" <<'EOF'
          #include <mir-gen.h>
          #include <mir.h>
          int main(void) {
              MIR_context_t ctx = MIR_init();
              if (ctx == 0) return 1;
              MIR_gen_init(ctx);
              MIR_gen_finish(ctx);
              MIR_finish(ctx);
              return 0;
          }
          EOF
          cmake -S "$src" -B "$src/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build/validate-turbowasm-mir-macos/$VCPKG_VALIDATE_TRIPLET"
          cmake --build "$src/build"
          "$src/build/mir_consumer"

name: Warm TurboMedia current x64-linux cache

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/warm-turbomedia-current-x64-linux.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: warm-turbomedia-current-x64-linux
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact TurboMedia head
        uses: actions/checkout@v4
        with:
          repository: qigao/turbomedia
          ref: 5584e045a3a45dfca334137c7a8846fc7cd92d4b
          path: product
          persist-credentials: false

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: readwrite

      - name: Prepare native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm \
            autoconf automake libtool gettext yasm

      - name: Warm exact current TurboMedia manifest
        shell: bash
        working-directory: product
        run: |
          set -euxo pipefail
          rm -rf vcpkg_installed
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=. \
            --x-install-root="$GITHUB_WORKSPACE/product/vcpkg_installed" \
            --triplet x64-linux

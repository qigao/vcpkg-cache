name: Warm vcpkg binary cache

on:
  push:
    branches: [master]
    paths:
      - "ports/**"
      - "vcpkg.json"
      - "vcpkg-tool-version.txt"
      - "vcpkg-scripts-revision.txt"
      - "manifests/**"
      - ".github/actions/setup-vcpkg-cache/**"
      - ".github/workflows/warm-cache.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Prepare host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm libudev-dev
      - name: Warm x64-linux
        run: |
          "$VCPKG_ROOT/vcpkg" install --x-manifest-root=. --triplet x64-linux

      - name: Warm SaltsUtils x64-linux dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=manifests/salts-utils \
            --x-install-root=build/vcpkg-salts-utils-linux \
            --triplet x64-linux

      - name: Verify SaltsUtils Linux root packages are published
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          import base64, json, os, time, urllib.parse, urllib.request

          expected = {
              "pkgconf_x64-linux",
              "simde_x64-linux",
              "boringssl_x64-linux",
              "miniaudio_x64-linux",
              "zstd_x64-linux",
              "lua_x64-linux",
              "libyuv_x64-linux",
          }

          token = os.environ["GITHUB_TOKEN"]
          auth = base64.b64encode(f"qigao:{token}".encode()).decode()
          headers = {"Authorization": f"Basic {auth}", "Accept": "application/json"}

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          index = get_json("https://nuget.pkg.github.com/qigao/index.json")
          search = next(
              item["@id"] for item in index["resources"]
              if "SearchQueryService" in item.get("@type", "")
          )

          for attempt in range(18):
              visible = set()
              for query in ("pkgconf", "simde", "boringssl", "miniaudio",
                            "zstd", "lua", "libyuv"):
                  url = search + "?" + urllib.parse.urlencode(
                      {"q": query, "prerelease": "true", "take": "100"}
                  )
                  visible.update(
                      item.get("id") for item in get_json(url).get("data", [])
                  )
              missing = sorted(expected - visible)
              if not missing:
                  print("all SaltsUtils Linux root packages are visible")
                  break
              if attempt == 17:
                  raise SystemExit(
                      "missing Linux GitHub Packages: " + ", ".join(missing)
                  )
              time.sleep(10)

      - name: Warm FlowMQ x64-linux dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=manifests/flowmq \
            --x-install-root=build/vcpkg-flowmq-linux \
            --triplet x64-linux

      - name: Warm TurboRaft Linux-only dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=manifests/turboraft-linux \
            --x-install-root=build/vcpkg-turboraft-linux \
            --triplet x64-linux

  linux-cache-contract:
    name: Linux x64 cache contract
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Use empty L1 cache
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/empty-vcpkg-l1"
          rm -rf "$cache"
          mkdir -p "$cache"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Prepare host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm
      - name: Verify SaltsUtils clean restore from GitHub Packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$VCPKG_BINARY_CACHE"
          mkdir -p "$VCPKG_BINARY_CACHE"
          log="$RUNNER_TEMP/linux-salts-utils-cache-contract.log"
          install_root="$RUNNER_TEMP/linux-salts-utils-installed"
          rm -rf "$install_root"

          set +e
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=manifests/salts-utils \
            --x-install-root="$install_root" \
            --triplet x64-linux \
            --only-binarycaching 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            echo "SaltsUtils Linux cache-only restore failed" >&2
            exit "$status"
          fi

          if grep -Eq '^Building [^:]+:x64-linux' "$log"; then
            echo "SaltsUtils Linux shared cache miss detected:" >&2
            grep -E '^Building [^:]+:x64-linux' "$log" >&2
            exit 1
          fi

          if ! grep -Eq 'Restored [1-9][0-9]* package\(s\) from NuGet' "$log"; then
            echo "SaltsUtils Linux shared cache did not restore packages from NuGet" >&2
            exit 1
          fi

  plugin-databind-windows:
    name: Plugin DataBind Windows consumer cache
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - name: Prepare consumer toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkgRoot = $env:VCPKG_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            throw "VCPKG_ROOT is unavailable"
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio x64 C++ toolchain not found"
          }
          "QIGAO_VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
      - name: Warm focused Plugin DataBind closure
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          if errorlevel 1 exit /b 1
          "%QIGAO_VCPKG_ROOT%\vcpkg.exe" install --x-manifest-root="%GITHUB_WORKSPACE%\manifests\plugin-databind" --x-install-root="%GITHUB_WORKSPACE%\build\vcpkg-plugin-databind-windows" --triplet=x64-windows
          if errorlevel 1 exit /b 1

  plugin-databind-windows-cache-contract:
    name: Plugin DataBind Windows cache contract
    needs: plugin-databind-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Use empty L1 cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "empty-plugin-databind-l1"
          if (Test-Path -LiteralPath $cache) {
            Remove-Item -LiteralPath $cache -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Prepare consumer toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkgRoot = $env:VCPKG_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            throw "VCPKG_ROOT is unavailable"
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio x64 C++ toolchain not found"
          }
          "QIGAO_VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
      - name: Verify focused closure from shared cache only
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          if errorlevel 1 exit /b 1
          "%QIGAO_VCPKG_ROOT%\vcpkg.exe" install --x-manifest-root="%GITHUB_WORKSPACE%\manifests\plugin-databind" --x-install-root="%RUNNER_TEMP%\plugin-databind-contract-installed" --triplet=x64-windows --only-binarycaching > "%RUNNER_TEMP%\plugin-databind-contract.log" 2>&1
          set "VCPKG_STATUS=%ERRORLEVEL%"
          type "%RUNNER_TEMP%\plugin-databind-contract.log"
          if not "%VCPKG_STATUS%"=="0" exit /b %VCPKG_STATUS%
          findstr /R /C:"^Building .*:x64-windows" "%RUNNER_TEMP%\plugin-databind-contract.log" >nul
          if not errorlevel 1 (
            echo focused Plugin/DataBind shared cache miss detected
            exit /b 1
          )
          findstr /C:"from NuGet" "%RUNNER_TEMP%\plugin-databind-contract.log" >nul
          if errorlevel 1 (
            echo focused Plugin/DataBind restore did not use NuGet
            exit /b 1
          )

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Prepare host dependencies
        shell: pwsh
        run: choco install nasm ninja -y --no-progress
      - name: Warm x64-windows
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --x-manifest-root=. --triplet x64-windows

      - name: Warm SaltsUtils x64-windows dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --x-manifest-root=manifests/salts-utils `
            --x-install-root=build/vcpkg-salts-utils-windows-2022 `
            --triplet x64-windows

      - name: Warm FlowMQ x64-windows dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --x-manifest-root=manifests/flowmq `
            --x-install-root=build/vcpkg-flowmq-windows-2022 `
            --triplet x64-windows

      - name: Verify Windows 2022 root packages are published
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          import base64, json, os, time, urllib.parse, urllib.request

          expected = {
              "aklomp-base64_x64-windows",
              "boringssl_x64-windows",
              "c-ares_x64-windows",
              "catch2_x64-windows",
              "cxxopts_x64-windows",
              "kcp_x64-windows",
              "libusb_x64-windows",
              "libuv_x64-windows",
              "libyuv_x64-windows",
              "llhttp_x64-windows",
              "lua_x64-windows",
              "miniaudio_x64-windows",
              "simde_x64-windows",
              "sqlite3_x64-windows",
              "tree-sitter_x64-windows",
              "tree-sitter-c_x64-windows",
              "xxhash_x64-windows",
              "zstd_x64-windows",
              "zeromq_x64-windows",
          }

          token = os.environ["GITHUB_TOKEN"]
          auth = base64.b64encode(f"qigao:{token}".encode()).decode()
          headers = {"Authorization": f"Basic {auth}", "Accept": "application/json"}

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          index = get_json("https://nuget.pkg.github.com/qigao/index.json")
          search = next(
              item["@id"] for item in index["resources"]
              if "SearchQueryService" in item.get("@type", "")
          )

          visible = set()
          for attempt in range(18):
              visible.clear()
              for query in ("aklomp", "boringssl", "c-ares", "catch2", "cxxopts",
                            "kcp", "libusb", "libuv", "libyuv", "llhttp", "lua",
                            "miniaudio", "simde", "sqlite3", "tree-sitter", "xxhash", "zstd",
                            "zeromq"):
                  url = search + "?" + urllib.parse.urlencode(
                      {"q": query, "prerelease": "true", "take": "100"}
                  )
                  visible.update(item.get("id") for item in get_json(url).get("data", []))
              missing = sorted(expected - visible)
              if not missing:
                  print("all Windows 2022 root packages are visible")
                  break
              if attempt == 17:
                  raise SystemExit("missing GitHub Packages: " + ", ".join(missing))
              time.sleep(10)

  windows-2022-cache-contract:
    name: Windows 2022 cache contract
    needs: windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Use empty L1 cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "empty-vcpkg-l1"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Prepare host dependencies
        shell: pwsh
        run: choco install nasm ninja -y --no-progress
      - name: Verify clean restore from GitHub Packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:RUNNER_TEMP "windows-2022-cache-contract.log"
          $installRoot = Join-Path $env:RUNNER_TEMP "windows-2022-cache-contract-installed"
          if (Test-Path -LiteralPath $installRoot) {
            Remove-Item -LiteralPath $installRoot -Recurse -Force
          }
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            "--x-manifest-root=$env:GITHUB_WORKSPACE" `
            "--x-install-root=$installRoot" `
            "--triplet=x64-windows" `
            --only-binarycaching 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "vcpkg cache-only restore failed" }
          $text = Get-Content -LiteralPath $log -Raw
          $misses = [regex]::Matches($text, "(?m)^Building ([^:]+):x64-windows") |
            ForEach-Object { $_.Groups[1].Value } |
            Sort-Object -Unique
          if ($misses.Count -gt 0) {
            Write-Host "Windows 2022 cache misses: $($misses -join ', ')"
            throw "Windows 2022 shared cache miss detected."
          }
          if ($text -notmatch "Restored [1-9][0-9]* package\(s\) from NuGet") {
            throw "Windows 2022 shared cache did not restore packages from NuGet."
          }

      - name: Verify SaltsUtils clean restore from GitHub Packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cache = $env:VCPKG_BINARY_CACHE
          if (Test-Path -LiteralPath $cache) {
            Remove-Item -LiteralPath $cache -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $log = Join-Path $env:RUNNER_TEMP "windows-2022-salts-utils-cache-contract.log"
          $installRoot = Join-Path $env:RUNNER_TEMP "windows-2022-salts-utils-installed"
          if (Test-Path -LiteralPath $installRoot) {
            Remove-Item -LiteralPath $installRoot -Recurse -Force
          }
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            "--x-manifest-root=$env:GITHUB_WORKSPACE\manifests\salts-utils" `
            "--x-install-root=$installRoot" `
            "--triplet=x64-windows" `
            --only-binarycaching 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "SaltsUtils cache-only restore failed" }
          $text = Get-Content -LiteralPath $log -Raw
          $misses = [regex]::Matches($text, "(?m)^Building ([^:]+):x64-windows") |
            ForEach-Object { $_.Groups[1].Value } |
            Sort-Object -Unique
          if ($misses.Count -gt 0) {
            throw "SaltsUtils Windows shared cache miss: $($misses -join ', ')"
          }
          if ($text -notmatch "Restored [1-9][0-9]* package\(s\) from NuGet") {
            throw "SaltsUtils Windows shared cache did not restore packages from NuGet."
          }

  windows-latest:
    name: Windows latest x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Prepare host dependencies
        shell: pwsh
        run: choco install nasm ninja -y --no-progress
      - name: Warm x64-windows
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --x-manifest-root=. --triplet x64-windows

      - name: Warm SaltsUtils x64-windows dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --x-manifest-root=manifests/salts-utils `
            --x-install-root=build/vcpkg-salts-utils-windows-latest `
            --triplet x64-windows

      - name: Warm FlowMQ x64-windows dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --x-manifest-root=manifests/flowmq `
            --x-install-root=build/vcpkg-flowmq-windows-latest `
            --triplet x64-windows

  macos:
    name: macOS host
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Prepare host dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ninja nasm autoconf automake autoconf-archive libtool
          case "$RUNNER_ARCH" in
            X64) echo "VCPKG_WARM_TRIPLET=x64-osx" >> "$GITHUB_ENV" ;;
            ARM64) echo "VCPKG_WARM_TRIPLET=arm64-osx" >> "$GITHUB_ENV" ;;
            *) echo "unsupported macOS arch: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
      - name: Warm macOS
        run: |
          "$VCPKG_ROOT/vcpkg" install --x-manifest-root=. --triplet "$VCPKG_WARM_TRIPLET"

      - name: Warm SaltsUtils macOS dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=manifests/salts-utils \
            --x-install-root=build/vcpkg-salts-utils-macos \
            --triplet "$VCPKG_WARM_TRIPLET"

      - name: Warm FlowMQ macOS dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=manifests/flowmq \
            --x-install-root=build/vcpkg-flowmq-macos \
            --triplet "$VCPKG_WARM_TRIPLET"

  android:
    name: Android arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Prepare host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm
          test -n "${ANDROID_NDK_HOME:-}"
      - name: Warm arm64-android
        run: |
          "$VCPKG_ROOT/vcpkg" install --x-manifest-root=. --triplet arm64-android

      - name: Warm SaltsUtils Android dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=manifests/salts-utils \
            --x-install-root=build/vcpkg-salts-utils-android-arm64 \
            --triplet arm64-android

      - name: Warm FlowMQ Android dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=manifests/flowmq \
            --x-install-root=build/vcpkg-flowmq-android-arm64 \
            --triplet arm64-android

  stun-linux:
    name: STUN Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Prepare STUN host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm libudev-dev \
            xorg-dev libwayland-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev
      - name: Warm STUN Linux dependencies
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=manifests/stun-linux \
            --x-install-root=build/vcpkg-stun-linux \
            --triplet x64-linux

  turbodb-postgresql-linux:
    name: TurboDB PostgreSQL Linux x64
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Prepare PostgreSQL host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm autoconf automake libtool
      - name: Warm TurboDB PostgreSQL dependencies
        shell: bash
        run: |
          unset VCPKG_OVERLAY_PORTS
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=manifests/turbodb-postgresql \
            --x-install-root=build/vcpkg-turbodb-postgresql-linux \
            --triplet x64-linux

      - name: Verify libpq_x64-linux publication
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          import base64, json, os, time, urllib.parse, urllib.request
          auth = base64.b64encode(f"qigao:{os.environ['GITHUB_TOKEN']}".encode()).decode()
          headers = {"Authorization": f"Basic {auth}", "Accept": "application/json"}

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          index = get_json("https://nuget.pkg.github.com/qigao/index.json")
          search = next(
              item["@id"] for item in index["resources"]
              if "SearchQueryService" in item.get("@type", "")
          )
          expected = "libpq_x64-linux"
          for attempt in range(18):
              url = search + "?" + urllib.parse.urlencode(
                  {"q": "libpq", "prerelease": "true", "take": "100"}
              )
              rows = get_json(url).get("data", [])
              ids = {item.get("id") for item in rows}
              if expected in ids:
                  print(f"published: {expected}")
                  break
              if attempt == 17:
                  raise SystemExit(f"GitHub Packages does not expose {expected}: {sorted(ids)}")
              time.sleep(10)

  turbodb-postgresql-windows:
    name: TurboDB PostgreSQL Windows 2022 x64
    needs: windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Prepare PostgreSQL host dependencies
        shell: pwsh
        run: choco install nasm ninja -y --no-progress
      - name: Warm TurboDB PostgreSQL dependencies
        shell: pwsh
        run: |
          Remove-Item Env:VCPKG_OVERLAY_PORTS -ErrorAction SilentlyContinue
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --x-manifest-root=manifests/turbodb-postgresql `
            --x-install-root=build/vcpkg-turbodb-postgresql-windows `
            --triplet x64-windows

      - name: Verify libpq_x64-windows publication
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          import base64, json, os, time, urllib.parse, urllib.request
          auth = base64.b64encode(f"qigao:{os.environ['GITHUB_TOKEN']}".encode()).decode()
          headers = {"Authorization": f"Basic {auth}", "Accept": "application/json"}

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          index = get_json("https://nuget.pkg.github.com/qigao/index.json")
          search = next(
              item["@id"] for item in index["resources"]
              if "SearchQueryService" in item.get("@type", "")
          )
          expected = "libpq_x64-windows"
          for attempt in range(18):
              url = search + "?" + urllib.parse.urlencode(
                  {"q": "libpq", "prerelease": "true", "take": "100"}
              )
              rows = get_json(url).get("data", [])
              ids = {item.get("id") for item in rows}
              if expected in ids:
                  print(f"published: {expected}")
                  break
              if attempt == 17:
                  raise SystemExit(f"GitHub Packages does not expose {expected}: {sorted(ids)}")
              time.sleep(10)


  gcanvas-shader-tools-linux:
    name: gCanvas shader tools Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - name: Prepare host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config
      - name: Warm gCanvas shader tools
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$VCPKG_CACHE_REPOSITORY_ROOT/manifests/gcanvas-shader-tools" \
            --x-install-root=build/vcpkg-gcanvas-shader-tools-linux \
            --triplet x64-linux

  gcanvas-shader-tools-linux-cache-contract:
    name: gCanvas shader tools Linux cache contract
    needs: gcanvas-shader-tools-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Use empty L1 cache
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/empty-gcanvas-shader-tools-l1"
          rm -rf "$cache"
          mkdir -p "$cache"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Restore gCanvas shader tools from shared cache only
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/gcanvas-shader-tools-linux-cache.log"
          install_root="$RUNNER_TEMP/gcanvas-shader-tools-linux-installed"
          rm -rf "$install_root"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$VCPKG_CACHE_REPOSITORY_ROOT/manifests/gcanvas-shader-tools" \
            --x-install-root="$install_root" \
            --triplet x64-linux \
            --only-binarycaching 2>&1 | tee "$log"
          ! grep -Eq '^Building [^:]+:x64-linux' "$log"
          grep -Eq 'Restored [1-9][0-9]* package\(s\) from NuGet' "$log"

  gcanvas-shader-tools-windows:
    name: gCanvas shader tools Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - name: Prepare host build tools
        shell: pwsh
        run: choco install ninja -y --no-progress
      - name: Warm gCanvas shader tools
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            "--x-manifest-root=$env:VCPKG_CACHE_REPOSITORY_ROOT\manifests\gcanvas-shader-tools" `
            "--x-install-root=build\vcpkg-gcanvas-shader-tools-windows" `
            --triplet x64-windows

  gcanvas-shader-tools-windows-cache-contract:
    name: gCanvas shader tools Windows cache contract
    needs: gcanvas-shader-tools-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Use empty L1 cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "empty-gcanvas-shader-tools-l1"
          if (Test-Path -LiteralPath $cache) { Remove-Item -LiteralPath $cache -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Restore gCanvas shader tools from shared cache only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:RUNNER_TEMP "gcanvas-shader-tools-windows-cache.log"
          $installRoot = Join-Path $env:RUNNER_TEMP "gcanvas-shader-tools-windows-installed"
          if (Test-Path -LiteralPath $installRoot) { Remove-Item -LiteralPath $installRoot -Recurse -Force }
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            "--x-manifest-root=$env:VCPKG_CACHE_REPOSITORY_ROOT\manifests\gcanvas-shader-tools" `
            "--x-install-root=$installRoot" `
            "--triplet=x64-windows" `
            --only-binarycaching 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "gCanvas shader tools cache-only restore failed" }
          $text = Get-Content -LiteralPath $log -Raw
          if ($text -match "(?m)^Building [^:]+:x64-windows") {
            throw "gCanvas shader tools Windows shared cache miss detected"
          }
          if ($text -notmatch "Restored [1-9][0-9]* package\(s\) from NuGet") {
            throw "gCanvas shader tools Windows restore did not use NuGet L2"
          }

  gcanvas-shader-tools-macos:
    name: gCanvas shader tools macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - name: Resolve host triplet
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) echo "GCANVAS_SHADER_TOOLS_TRIPLET=x64-osx" >> "$GITHUB_ENV" ;;
            ARM64) echo "GCANVAS_SHADER_TOOLS_TRIPLET=arm64-osx" >> "$GITHUB_ENV" ;;
            *) echo "unsupported macOS arch: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
      - name: Warm gCanvas shader tools
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$VCPKG_CACHE_REPOSITORY_ROOT/manifests/gcanvas-shader-tools" \
            --x-install-root=build/vcpkg-gcanvas-shader-tools-macos \
            --triplet "$GCANVAS_SHADER_TOOLS_TRIPLET"

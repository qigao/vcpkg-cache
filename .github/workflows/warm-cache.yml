name: Warm vcpkg binary cache

on:
  push:
    branches: [master]
    paths:
      - "ports/**"
      - "vcpkg.json"
      - ".github/actions/setup-vcpkg-cache/**"
      - ".github/workflows/warm-cache.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  VCPKG_BASELINE: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Prepare vcpkg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg fetch --depth 1 origin "$VCPKG_BASELINE"
          git -C vcpkg checkout "$VCPKG_BASELINE"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Warm x64-linux
        run: ./vcpkg/vcpkg install --x-manifest-root=. --triplet x64-linux

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Prepare vcpkg
        shell: pwsh
        run: |
          choco install nasm ninja -y --no-progress
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg fetch --depth 1 origin $env:VCPKG_BASELINE
          git -C vcpkg checkout $env:VCPKG_BASELINE
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Warm x64-windows
        shell: pwsh
        run: .\vcpkg\vcpkg.exe install --x-manifest-root=. --triplet x64-windows

  macos:
    name: macOS host
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Prepare vcpkg
        shell: bash
        run: |
          set -euo pipefail
          brew install ninja nasm
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg fetch --depth 1 origin "$VCPKG_BASELINE"
          git -C vcpkg checkout "$VCPKG_BASELINE"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          case "$RUNNER_ARCH" in
            X64) echo "VCPKG_WARM_TRIPLET=x64-osx" >> "$GITHUB_ENV" ;;
            ARM64) echo "VCPKG_WARM_TRIPLET=arm64-osx" >> "$GITHUB_ENV" ;;
            *) echo "unsupported macOS arch: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
      - name: Warm macOS
        run: ./vcpkg/vcpkg install --x-manifest-root=. --triplet "$VCPKG_WARM_TRIPLET"

  android:
    name: Android arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Prepare vcpkg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm
          test -n "${ANDROID_NDK_HOME:-}"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg fetch --depth 1 origin "$VCPKG_BASELINE"
          git -C vcpkg checkout "$VCPKG_BASELINE"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Warm arm64-android
        run: ./vcpkg/vcpkg install --x-manifest-root=. --triplet arm64-android

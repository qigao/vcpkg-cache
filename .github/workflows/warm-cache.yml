name: Warm vcpkg binary cache

on:
  push:
    branches: [master]
    paths:
      - ".gitattributes"
      - "ports/**"
      - "triplets/**"
      - "versions/**"
      - "cache-contract-version.txt"
      - "scripts/cache-contract-revision.py"
      - "scripts/vcpkg-required-commits.py"
      - "vcpkg.json"
      - "cache-contracts/**"
      - "vcpkg-tool-version.txt"
      - "vcpkg-scripts-revision.txt"
      - ".github/actions/setup-vcpkg-cache/**"
      - ".github/workflows/warm-cache.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - name: Prepare host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm libudev-dev autoconf automake libtool
      - name: Warm isolated Linux BoringSSL cache
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/boringssl-warm-manifest"
          install_root="$RUNNER_TEMP/boringssl-warm-install"
          rm -rf "$manifest" "$install_root"
          mkdir -p "$manifest"
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["builtin-baseline"])')"
          cat > "$manifest/vcpkg.json" <<EOF
          {
            "name": "qigao-boringssl-cache-warm",
            "version-string": "1",
            "dependencies": ["boringssl"],
            "builtin-baseline": "$baseline"
          }
          EOF
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$manifest" \
            --x-install-root="$install_root" \
            --triplet x64-linux

      - name: Warm generic x64-linux cache
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install --x-manifest-root=. --triplet x64-linux

      - name: Warm shared MIR/WABT tooling cache
        shell: bash
        run: |
          set -euo pipefail

          mir_manifest="$RUNNER_TEMP/mir-jit-unversioned"
          mir_root="$RUNNER_TEMP/mir-jit-unversioned-install"
          rm -rf "$mir_manifest" "$mir_root"
          mkdir -p "$mir_manifest"
          cat > "$mir_manifest/vcpkg.json" <<'EOF'
          {
            "name": "qigao-mir-jit-unversioned-cache",
            "version-string": "1",
            "dependencies": ["mir-jit"]
          }
          EOF
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$mir_manifest" \
            --x-install-root="$mir_root" \
            --triplet x64-linux

          wabt_manifest="$RUNNER_TEMP/wabt-tools-unversioned"
          wabt_root="$RUNNER_TEMP/wabt-tools-unversioned-install"
          rm -rf "$wabt_manifest" "$wabt_root"
          mkdir -p "$wabt_manifest"
          cat > "$wabt_manifest/vcpkg.json" <<'EOF'
          {
            "name": "qigao-wabt-tools-unversioned-cache",
            "version-string": "1",
            "dependencies": [
              {
                "name": "wabt",
                "features": ["tools"]
              }
            ]
          }
          EOF
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$wabt_manifest" \
            --x-install-root="$wabt_root" \
            --triplet x64-linux

  linux-cache-contract:
    name: Linux x64 cache-only restore
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Use empty L1 cache
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/empty-vcpkg-l1"
          rm -rf "$cache"
          mkdir -p "$cache"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Prepare host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm libudev-dev autoconf automake libtool
      - name: Verify generic cache-only restore
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/vcpkg-root-linux"
          log="$RUNNER_TEMP/vcpkg-root-linux.log"
          rm -rf "$install_root" "$VCPKG_BINARY_CACHE"
          mkdir -p "$VCPKG_BINARY_CACHE"
          set +e
          "$VCPKG_ROOT/vcpkg" install             --x-manifest-root=.             --x-install-root="$install_root"             --triplet x64-linux             --only-binarycaching 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -Eq '^Building [^:]+:x64-linux' "$log"; then
            echo "generic Linux shared-cache miss detected" >&2
            exit 1
          fi
          grep -Eq 'Restored [1-9][0-9]* package\(s\) from NuGet' "$log"

      - name: Verify isolated BoringSSL cache-only restore
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/boringssl-contract-manifest"
          install_root="$RUNNER_TEMP/boringssl-contract-install"
          log="$RUNNER_TEMP/boringssl-contract.log"
          rm -rf "$manifest" "$install_root"
          mkdir -p "$manifest"
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["builtin-baseline"])')"
          cat > "$manifest/vcpkg.json" <<EOF
          {
            "name": "qigao-boringssl-cache-contract",
            "version-string": "1",
            "dependencies": ["boringssl"],
            "builtin-baseline": "$baseline"
          }
          EOF
          set +e
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$manifest" \
            --x-install-root="$install_root" \
            --triplet x64-linux \
            --only-binarycaching 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -Eq '^Building boringssl:x64-linux' "$log"; then
            echo "BoringSSL Linux shared-cache miss detected" >&2
            exit 1
          fi
          grep -Fq 'boringssl:x64-linux' "$log"
          grep -Eq 'Restored [1-9][0-9]* package\(s\) from NuGet' "$log"

  linux-arm64-sdk-deps:
    name: Linux arm64 SDK deps
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - name: Prepare host dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          sudo apt-get update
          # Tool discovery participates in vcpkg package ABIs; match Salts exactly.
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm libudev-dev
      - name: Create focused Linux arm64 SDK dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/linux-arm64-sdk-deps"
          rm -rf "$manifest"
          mkdir -p "$manifest"
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["builtin-baseline"])')"
          cat > "$manifest/vcpkg.json" <<EOF
          {
            "name": "qigao-linux-arm64-sdk-deps",
            "version-string": "1",
            "dependencies": [
              {"name":"pkgconf","host":true},
              "simde",
              "zstd",
              "aklomp-base64",
              "c-ares",
              "libuv",
              "kcp",
              "gmssl",
              "miniaudio",
              {"name":"zeromq","default-features":false}
            ],
            "builtin-baseline": "$baseline"
          }
          EOF
          echo "LINUX_ARM64_SDK_MANIFEST=$manifest" >> "$GITHUB_ENV"
      - name: Warm isolated arm64-linux header-only cache
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=cache-contracts/header-only \
            --x-install-root="$RUNNER_TEMP/header-only-arm64-warm" \
            --triplet arm64-linux \
            --host-triplet arm64-linux
      - name: Warm focused arm64-linux SDK dependency cache
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/linux-arm64-sdk-deps-install"
          rm -rf "$install_root"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$LINUX_ARM64_SDK_MANIFEST" \
            --x-install-root="$install_root" \
            --triplet arm64-linux \
            --host-triplet arm64-linux
          test -f "$install_root/arm64-linux/include/zmq.h"
          test -f "$install_root/arm64-linux/include/gmssl/tls.h"
          test -f "$install_root/arm64-linux/include/simde/x86/sse2.h"

  linux-arm64-sdk-deps-cache-contract:
    name: Linux arm64 SDK deps clean L2
    needs: linux-arm64-sdk-deps
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Use empty L1 cache
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/empty-linux-arm64-sdk-l1"
          rm -rf "$cache"
          mkdir -p "$cache"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Prepare host dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          sudo apt-get update
          # Qualify with the same ABI-relevant host tools as the producer.
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm libudev-dev
      - name: Create focused Linux arm64 SDK dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/linux-arm64-sdk-deps-contract"
          rm -rf "$manifest"
          mkdir -p "$manifest"
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["builtin-baseline"])')"
          cat > "$manifest/vcpkg.json" <<EOF
          {
            "name": "qigao-linux-arm64-sdk-deps-contract",
            "version-string": "1",
            "dependencies": [
              {"name":"pkgconf","host":true},
              "simde",
              "zstd",
              "aklomp-base64",
              "c-ares",
              "libuv",
              "kcp",
              "gmssl",
              "miniaudio",
              {"name":"zeromq","default-features":false}
            ],
            "builtin-baseline": "$baseline"
          }
          EOF
          echo "LINUX_ARM64_SDK_MANIFEST=$manifest" >> "$GITHUB_ENV"
      - name: Verify isolated arm64-linux header-only clean-L2 restore
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=cache-contracts/header-only \
            --x-install-root="$RUNNER_TEMP/header-only-arm64-clean" \
            --triplet arm64-linux \
            --host-triplet arm64-linux \
            --only-binarycaching
          test -f "$RUNNER_TEMP/header-only-arm64-clean/arm64-linux/include/simde/x86/sse2.h"
      - name: Verify focused arm64-linux clean-L2 restore
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/linux-arm64-sdk-deps-clean"
          log="$RUNNER_TEMP/linux-arm64-sdk-deps.log"
          rm -rf "$install_root" "$VCPKG_BINARY_CACHE"
          mkdir -p "$VCPKG_BINARY_CACHE"
          set +e
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$LINUX_ARM64_SDK_MANIFEST" \
            --x-install-root="$install_root" \
            --triplet arm64-linux \
            --host-triplet arm64-linux \
            --only-binarycaching 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -Eq '^Building ' "$log"; then
            echo "source build detected during Linux arm64 SDK clean-L2 qualification" >&2
            exit 1
          fi
          grep -Eq 'Restored [1-9][0-9]* package\(s\) from NuGet' "$log"
          test -f "$install_root/arm64-linux/include/zmq.h"
          test -f "$install_root/arm64-linux/include/gmssl/tls.h"
          test -f "$install_root/arm64-linux/include/simde/x86/sse2.h"
          echo "Linux arm64 SDK dependency clean-L2 restore passed." >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows x64 / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            triplet: x64-windows
          - runner: windows-2025
            triplet: qigao-x64-windows-v145
    runs-on: ${{ matrix.runner }}
    env:
      VCPKG_WARM_TRIPLET: ${{ matrix.triplet }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - name: Prepare host dependencies
        shell: pwsh
        run: choco install nasm ninja strawberryperl -y --no-progress
      - name: Warm generic x64-windows cache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:VCPKG_ROOT\vcpkg.exe" install --x-manifest-root=. --triplet $env:VCPKG_WARM_TRIPLET --host-triplet $env:VCPKG_WARM_TRIPLET
          if ($LASTEXITCODE -ne 0) { throw "vcpkg warm failed" }

  windows-cache-contract:
    name: Windows x64 cache-only restore / ${{ matrix.runner }}
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            triplet: x64-windows
          - runner: windows-2025
            triplet: qigao-x64-windows-v145
    runs-on: ${{ matrix.runner }}
    env:
      VCPKG_WARM_TRIPLET: ${{ matrix.triplet }}
    steps:
      - uses: actions/checkout@v4
      - name: Use empty L1 cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "empty-vcpkg-l1"
          if (Test-Path -LiteralPath $cache) { Remove-Item -LiteralPath $cache -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Prepare host dependencies
        shell: pwsh
        run: choco install nasm ninja strawberryperl -y --no-progress
      - name: Verify generic cache-only restore
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installRoot = Join-Path $env:RUNNER_TEMP "vcpkg-root-windows"
          $log = Join-Path $env:RUNNER_TEMP "vcpkg-root-windows.log"
          if (Test-Path -LiteralPath $installRoot) { Remove-Item -LiteralPath $installRoot -Recurse -Force }
          & "$env:VCPKG_ROOT\vcpkg.exe" install             "--x-manifest-root=$env:GITHUB_WORKSPACE"             "--x-install-root=$installRoot"             "--triplet=$env:VCPKG_WARM_TRIPLET"             "--host-triplet=$env:VCPKG_WARM_TRIPLET"             --only-binarycaching 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "vcpkg cache-only restore failed" }
          $text = Get-Content -LiteralPath $log -Raw
          if ($text -match ("(?m)^Building [^:]+:" + [regex]::Escape($env:VCPKG_WARM_TRIPLET))) {
            throw "generic Windows shared-cache miss detected"
          }
          if ($text -notmatch "Restored [1-9][0-9]* package\(s\) from NuGet") {
            throw "generic Windows restore did not use NuGet"
          }

  macos:
    name: macOS host
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - name: Prepare host dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ninja nasm autoconf automake autoconf-archive libtool
          case "$RUNNER_ARCH" in
            X64) echo "VCPKG_WARM_TRIPLET=x64-osx" >> "$GITHUB_ENV" ;;
            ARM64) echo "VCPKG_WARM_TRIPLET=arm64-osx" >> "$GITHUB_ENV" ;;
            *) echo "unsupported macOS arch: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
      - name: Warm generic macOS cache
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install --x-manifest-root=. --triplet "$VCPKG_WARM_TRIPLET"



  ios-sdk-deps:
    name: iOS SDK deps / ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: device arm64, triplet: arm64-ios}
          - {name: simulator arm64, triplet: arm64-ios-simulator}
    env:
      X_VCPKG_NUGET_ID_PREFIX: vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - name: Prepare iOS build tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          brew install ninja nasm autoconf automake autoconf-archive libtool
      - name: Create focused native SDK dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/ios-sdk-deps-manifest"
          rm -rf "$manifest"
          mkdir -p "$manifest"
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["builtin-baseline"])')"
          cat > "$manifest/vcpkg.json" <<EOF
          {
            "name": "qigao-ios-sdk-deps",
            "version-string": "1",
            "dependencies": [
              {"name":"pkgconf","host":true},
              "simde",
              "zstd",
              "aklomp-base64",
              "c-ares",
              "libuv",
              "kcp",
              "boringssl",
              "gmssl",
              "miniaudio",
              "libyuv",
              "llhttp",
              "tree-sitter",
              "tree-sitter-c"
            ],
            "builtin-baseline": "$baseline"
          }
          EOF
          echo "IOS_SDK_MANIFEST=$manifest" >> "$GITHUB_ENV"
      - name: Produce iOS SDK dependency cache
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/ios-sdk-deps-${{ matrix.triplet }}"
          rm -rf "$install_root"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$IOS_SDK_MANIFEST" \
            --x-install-root="$install_root" \
            --triplet "${{ matrix.triplet }}"

  ios-sdk-deps-cache-contract:
    name: iOS SDK deps clean L2 / ${{ matrix.name }}
    needs: ios-sdk-deps
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: device arm64, triplet: arm64-ios}
          - {name: simulator arm64, triplet: arm64-ios-simulator}
    env:
      X_VCPKG_NUGET_ID_PREFIX: vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Use empty L1 cache
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/empty-ios-sdk-l1"
          rm -rf "$cache"
          mkdir -p "$cache"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Prepare iOS build tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          brew install ninja nasm autoconf automake autoconf-archive libtool
      - name: Create focused native SDK dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/ios-sdk-deps-contract-manifest"
          rm -rf "$manifest"
          mkdir -p "$manifest"
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["builtin-baseline"])')"
          cat > "$manifest/vcpkg.json" <<EOF
          {
            "name": "qigao-ios-sdk-deps-contract",
            "version-string": "1",
            "dependencies": [
              {"name":"pkgconf","host":true},
              "simde",
              "zstd",
              "aklomp-base64",
              "c-ares",
              "libuv",
              "kcp",
              "boringssl",
              "gmssl",
              "miniaudio",
              "libyuv",
              "llhttp",
              "tree-sitter",
              "tree-sitter-c"
            ],
            "builtin-baseline": "$baseline"
          }
          EOF
          echo "IOS_SDK_MANIFEST=$manifest" >> "$GITHUB_ENV"
      - name: Verify clean iOS SDK dependency restore
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/ios-sdk-deps-clean-${{ matrix.triplet }}"
          log="$RUNNER_TEMP/ios-sdk-deps-${{ matrix.triplet }}.log"
          rm -rf "$install_root" "$VCPKG_BINARY_CACHE"
          mkdir -p "$VCPKG_BINARY_CACHE"
          set +e
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$IOS_SDK_MANIFEST" \
            --x-install-root="$install_root" \
            --triplet "${{ matrix.triplet }}" \
            --only-binarycaching 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -Eq '^Building [^:]+' "$log"; then
            echo "source build detected during iOS SDK clean-L2 qualification" >&2
            exit 1
          fi
          grep -Eq 'Restored [1-9][0-9]* package\(s\) from NuGet' "$log"
          echo "iOS SDK clean-L2 restore passed: ${{ matrix.triplet }}" >> "$GITHUB_STEP_SUMMARY"

  mir-jit-macos-warm:
    name: macOS MIR JIT warm
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - name: Prepare host tools
        shell: bash
        run: |
          set -euo pipefail
          brew install ninja
          test "$(uname -m)" = "arm64"
      - name: Warm unversioned MIR JIT cache
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/mir-jit-unversioned"
          install_root="$RUNNER_TEMP/mir-jit-unversioned-install"
          rm -rf "$manifest" "$install_root"
          mkdir -p "$manifest"
          cat > "$manifest/vcpkg.json" <<'EOF'
          {
            "name": "qigao-mir-jit-unversioned-cache",
            "version-string": "1",
            "dependencies": ["mir-jit"]
          }
          EOF
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$manifest" \
            --x-install-root="$install_root" \
            --triplet arm64-osx
          test -f "$install_root/arm64-osx/share/MIR/MIRConfig.cmake"

  mir-jit-cache-contract:
    name: MIR JIT clean L2 / ${{ matrix.triplet }}
    needs: [linux, mir-jit-macos-warm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, triplet: x64-linux}
          - {runner: macos-15, triplet: arm64-osx}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Use empty L1 cache
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/empty-mir-jit-l1"
          rm -rf "$cache"
          mkdir -p "$cache"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Create focused MIR JIT manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/mir-jit-manifest"
          rm -rf "$manifest"
          mkdir -p "$manifest"
          cat > "$manifest/vcpkg.json" <<'EOF'
          {
            "name": "qigao-mir-jit-cache-contract",
            "version-string": "1",
            "dependencies": ["mir-jit"]
          }
          EOF
          echo "MIR_JIT_MANIFEST_ROOT=$manifest" >> "$GITHUB_ENV"
      - name: Verify MIR JIT cache-only restore
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.triplet }}" == "arm64-osx" ]]; then
            test "$(uname -m)" = "arm64"
          fi
          install_root="$RUNNER_TEMP/mir-jit-install-${{ matrix.triplet }}"
          log="$RUNNER_TEMP/mir-jit-${{ matrix.triplet }}.log"
          rm -rf "$install_root" "$VCPKG_BINARY_CACHE"
          mkdir -p "$VCPKG_BINARY_CACHE"
          set +e
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$MIR_JIT_MANIFEST_ROOT" \
            --x-install-root="$install_root" \
            --triplet "${{ matrix.triplet }}" \
            --only-binarycaching 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "mir-jit shared-cache restore failed for ${{ matrix.triplet }}" >&2
            exit "$status"
          fi
          if grep -Eq '^Building mir-jit:' "$log"; then
            echo "mir-jit source build detected during cache-only qualification" >&2
            exit 1
          fi
          grep -Fq 'mir-jit' "$log"
          grep -Eq 'Restored [1-9][0-9]* package\(s\) from NuGet' "$log"
          printf 'mir-jit clean-L2 restore passed: %s\n' "${{ matrix.triplet }}" >> "$GITHUB_STEP_SUMMARY"

  wabt-tools-cache-contract:
    name: WABT tools clean L2 / x64-linux
    needs: [linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Use empty L1 cache
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/empty-wabt-tools-l1"
          rm -rf "$cache"
          mkdir -p "$cache"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read
      - name: Create focused WABT tools manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/wabt-tools-manifest"
          rm -rf "$manifest"
          mkdir -p "$manifest"
          cat > "$manifest/vcpkg.json" <<'EOF'
          {
            "name": "qigao-wabt-tools-cache-contract",
            "version-string": "1",
            "dependencies": [
              {
                "name": "wabt",
                "features": ["tools"]
              }
            ]
          }
          EOF
          echo "WABT_TOOLS_MANIFEST_ROOT=$manifest" >> "$GITHUB_ENV"
      - name: Verify WABT tools cache-only restore
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/wabt-tools-install"
          log="$RUNNER_TEMP/wabt-tools.log"
          rm -rf "$install_root" "$VCPKG_BINARY_CACHE"
          mkdir -p "$VCPKG_BINARY_CACHE"
          set +e
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$WABT_TOOLS_MANIFEST_ROOT" \
            --x-install-root="$install_root" \
            --triplet x64-linux \
            --only-binarycaching 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "wabt tools shared-cache restore failed" >&2
            exit "$status"
          fi
          if grep -Eq '^Building wabt(?:\[[^]]+\])?:' "$log"; then
            echo "wabt source build detected during cache-only qualification" >&2
            exit 1
          fi
          grep -Fq 'wabt' "$log"
          grep -Eq 'Restored [1-9][0-9]* package\(s\) from NuGet' "$log"
          test -x "$install_root/x64-linux/tools/wabt/wast2json"
          echo "WABT tools clean-L2 restore passed." >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - name: Prepare host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm autoconf automake libtool
          test -n "${ANDROID_NDK_HOME:-}"
      - name: Warm target pkgconf for Android
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/android-pkgconf-manifest"
          install_root="$RUNNER_TEMP/android-pkgconf-install"
          rm -rf "$manifest" "$install_root"
          mkdir -p "$manifest"
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["builtin-baseline"])')"
          cat > "$manifest/vcpkg.json" <<EOF
          {
            "name": "qigao-android-pkgconf-cache-warm",
            "version-string": "1",
            "dependencies": ["pkgconf"],
            "builtin-baseline": "$baseline"
          }
          EOF
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$manifest" \
            --x-install-root="$install_root" \
            --triplet arm64-android

      - name: Warm generic arm64-android cache
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install --x-manifest-root=. --triplet arm64-android

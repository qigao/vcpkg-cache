name: Diagnose Windows v145 ABI inputs

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-windows-v145-abi.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  windows-v145-abi:
    name: Windows v145 ABI inputs
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read

      - name: Prepare Windows build tools
        shell: pwsh
        run: choco install nasm ninja strawberryperl -y --no-progress

      - name: Restore canonical TurboAgent closure and dump ABI inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $triplet = $env:QIGAO_VCPKG_WINDOWS_TRIPLET
          $hostTriplet = $env:QIGAO_VCPKG_WINDOWS_HOST_TRIPLET
          $manifestRoot = Join-Path $env:RUNNER_TEMP "turboagent-abi-diagnostic-manifest"
          $installed = Join-Path $env:RUNNER_TEMP "turboagent-abi-diagnostic-install"

          Remove-Item -LiteralPath $manifestRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $installed -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $manifestRoot | Out-Null

          $baseline = (Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "vcpkg.json") -Raw | ConvertFrom-Json).'builtin-baseline'
          @"
          {
            "name": "qigao-turboagent-windows-abi-diagnostic",
            "version-string": "1",
            "dependencies": [
              "boringssl",
              {
                "name": "sqlite3",
                "features": ["fts5"]
              }
            ],
            "builtin-baseline": "$baseline"
          }
          "@ | Set-Content -LiteralPath (Join-Path $manifestRoot "vcpkg.json")

          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            "--x-manifest-root=$manifestRoot" `
            "--x-install-root=$installed" `
            "--triplet=$triplet" `
            "--host-triplet=$hostTriplet" `
            --only-binarycaching
          if ($LASTEXITCODE -ne 0) { throw "canonical cache restore failed" }

          foreach ($port in @("vcpkg-cmake-config", "vcpkg-cmake", "boringssl", "sqlite3")) {
            $abi = Join-Path $installed "$triplet\share\$port\vcpkg_abi_info.txt"
            if (-not (Test-Path -LiteralPath $abi -PathType Leaf)) {
              throw "missing ABI input file: $abi"
            }
            Write-Host "::group::ABI input $port"
            Get-Content -LiteralPath $abi
            Write-Host "::endgroup::"
          }

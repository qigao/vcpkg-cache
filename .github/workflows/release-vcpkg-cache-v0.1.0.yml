name: Publish versioned vcpkg-cache source v0.1.0

# One-time source/Action release admission on the merge that introduces
# this workflow. This does not write or relabel any native NuGet ABI package.
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/release-vcpkg-cache-v0.1.0.yml"

permissions:
  contents: read

concurrency:
  group: vcpkg-cache-source-release-v0.1.0
  cancel-in-progress: false

jobs:
  release:
    name: Publish exact master tag and GitHub Release
    if: >-
      github.repository == 'qigao/vcpkg-cache' &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify authoritative master, pinned source, and release invariants
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = qigao/vcpkg-cache
          test "$GITHUB_REF" = refs/heads/master
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote_master="$(git ls-remote --exit-code \
            https://github.com/qigao/vcpkg-cache.git refs/heads/master | cut -f1)"
          test "$remote_master" = "$GITHUB_SHA"
          if git ls-remote --exit-code \
            https://github.com/qigao/vcpkg-cache.git refs/tags/v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 tag already exists: immutable release cannot be recreated" >&2
            exit 1
          fi
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.1.0 Release already exists: refusing overwrite" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert Path('cache-contract-version.txt').read_text().strip() == '8'
          port = json.loads(Path('ports/gmssl/vcpkg.json').read_text())
          assert port.get('port-version') == 17
          baseline = json.loads(Path('versions/baseline.json').read_text())['default']['gmssl']
          assert baseline['port-version'] == 17
          assert Path('docs/releases/v0.1.0.md').is_file()
          PY

      - name: Test existing native cache transport and protected publisher contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_curl_cache_*.py' -v

      - name: Create one immutable-name release tag on exact approved commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "vcpkg-cache v0.1.0" \
            --notes-file docs/releases/v0.1.0.md
          ref_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0" \
            --jq '.object.sha')"
          test "$ref_sha" = "$GITHUB_SHA"
          gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url

name: Validate libpq external TLS boundary

on:
  pull_request:
    paths:
      - "ports/libpq/**"
      - "tests/libpq-channel-binding.c"
      - "vcpkg.json"
      - ".github/workflows/validate-libpq-no-ssl.yml"

permissions:
  contents: read
  packages: read

jobs:
  linux:
    name: libpq no-SSL / ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm-native
        with:
          obfuscator: "false"
      - name: Bootstrap canonical vcpkg without Mono/NuGet (source-only Linux)
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          manifest-root: cache-contracts/optional-feature
          triplet: x64-linux
          host-triplet: x64-linux
      - name: Build no-SSL profile
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/libpq-no-ssl-manifest"
          install="$RUNNER_TEMP/libpq-no-ssl-install"
          mkdir -p "$manifest"
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["builtin-baseline"])')"
          cat > "$manifest/vcpkg.json" <<EOF
          {
            "name": "libpq-no-ssl-contract",
            "version-string": "1",
            "dependencies": [
              {
                "name": "libpq",
                "default-features": true,
                "features": ["zstd"]
              }
            ],
            "builtin-baseline": "$baseline"
          }
          EOF
          # This profile qualifies an actual libpq source build; no cache
          # binary (including a different TLS provider) may substitute for it.
          VCPKG_BINARY_SOURCES=clear "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$manifest" --x-install-root="$install" \
            --triplet x64-linux --host-triplet x64-linux
          status="$install/vcpkg/status"
          if grep -Eq '^Package: (openssl|boringssl)$' "$status"; then
            echo "TLS provider leaked into no-SSL libpq closure" >&2
            cat "$status" >&2
            exit 1
          fi
          test -f "$install/x64-linux/lib/libpq.a"

      - name: Run native external channel-binding contract
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/libpq-no-ssl-install/x64-linux"
          export PKG_CONFIG_PATH="$root/lib/pkgconfig"
          pkg_libs="$(pkg-config --libs --static libpq)"
          if grep -Eq '(^|[[:space:]])-l(ssl|crypto)([[:space:]]|$)' <<<"$pkg_libs"; then
            echo "pkg-config no-SSL closure still exposes TLS libraries: $pkg_libs" >&2
            exit 1
          fi
          "$LLVM_NATIVE_CC" tests/libpq-channel-binding.c $(pkg-config --cflags --libs --static libpq) -o "$RUNNER_TEMP/libpq-no-ssl"
          "$RUNNER_TEMP/libpq-no-ssl"


  windows:
    name: libpq no-SSL / windows-2025 llvm-mingw
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm-mingw
        with:
          target: x64
          obfuscator: "false"
      - name: Bootstrap canonical vcpkg without Mono/NuGet (source-only Windows)
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          manifest-root: cache-contracts/optional-feature
          triplet: qigao-x64-windows-llvm-mingw
          host-triplet: qigao-x64-windows-llvm-mingw
      - name: Build no-SSL profile
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $triplet = "qigao-x64-windows-llvm-mingw"
          $manifest = Join-Path $env:RUNNER_TEMP "libpq-no-ssl-manifest"
          $install = Join-Path $env:RUNNER_TEMP "libpq-no-ssl-install"
          New-Item -ItemType Directory -Force -Path $manifest | Out-Null
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          @"
          {
            "name": "libpq-no-ssl-contract",
            "version-string": "1",
            "dependencies": [
              {
                "name": "libpq",
                "default-features": true,
                "features": ["zstd"]
              }
            ],
            "builtin-baseline": "$baseline"
          }
          "@ | Set-Content -LiteralPath (Join-Path $manifest "vcpkg.json") -Encoding utf8
          # A real llvm-mingw libpq build must use the pinned source graph only.
          # No restored binary ABI or legacy Mono/NuGet provider is acceptable.
          $env:VCPKG_BINARY_SOURCES = 'clear'
          & "$env:VCPKG_ROOT\vcpkg.exe" install "--x-manifest-root=$manifest" "--x-install-root=$install" "--triplet=$triplet" "--host-triplet=$triplet"
          if ($LASTEXITCODE -ne 0) { throw "libpq no-SSL vcpkg install failed" }
          $status = Get-Content -LiteralPath (Join-Path $install "vcpkg\status") -Raw
          if ($status -match '(?m)^Package: (openssl|boringssl)$') { throw "TLS provider leaked into no-SSL libpq closure" }
          $root = Join-Path $install $triplet
          if (-not (Test-Path (Join-Path $root "lib\libpq.dll.a"))) { throw "libpq import archive missing" }

      - name: Run native external channel-binding contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "libpq-no-ssl-install/qigao-x64-windows-llvm-mingw"
          $exe = Join-Path $env:RUNNER_TEMP "libpq-channel-binding.exe"
          & $env:LLVM_MINGW_CC tests/libpq-channel-binding.c "-I$root/include" "-L$root/lib" -lpq -o $exe
          if ($LASTEXITCODE -ne 0) { throw "channel-binding contract compilation failed" }
          $env:PATH = "$root/bin;$env:PATH"
          & $exe
          if ($LASTEXITCODE -ne 0) { throw "channel-binding contract failed" }

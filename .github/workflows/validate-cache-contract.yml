name: Validate vcpkg cache contract

on:
  pull_request:
    paths:
      - ".gitattributes"
      - "ports/**"
      - "triplets/**"
      - "versions/**"
      - "cache-contract-version.txt"
      - "cmake/**"
      - "scripts/cache-contract-revision.py"
      - "scripts/vcpkg-required-commits.py"
      - "scripts/github-packages.py"
      - "scripts/setup-vcpkg-curl-cache.py"
      - "scripts/restore-manifest-cache.py"
      - "cache-contracts/optional-feature/**"
      - ".github/actions/setup-vcpkg-curl-cache/**"
      - "scripts/tests/test_curl_cache_legacy_debt.py"
      - "vcpkg.json"
      - "vcpkg-tool-version.txt"
      - "vcpkg-scripts-revision.txt"
      - ".github/actions/setup-vcpkg-cache/**"
      - ".github/workflows/**"
      - "packaging/**"
      - "manifests/**"
      - "producers/**"

permissions:
  contents: read
  packages: read

jobs:
  linux:
    name: Contract / ubuntu-24.04
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.cache.outputs.cache_revision }}
      contract: ${{ steps.cache.outputs.contract_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject new Mono/NuGet native cache callers before legacy bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p test_curl_cache_legacy_debt.py -v
      - id: cache
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          manifest-root: cache-contracts/optional-feature
          triplet: x64-linux
          host-triplet: x64-linux
      - name: Enforce infrastructure-only ownership boundary
        shell: bash
        run: |
          set -euo pipefail

          if [[ -e manifests ]]; then
            echo "vcpkg-cache must not own a product manifests/ tree" >&2
            exit 1
          fi

          if [[ -d packaging ]]; then
            while IFS= read -r entry; do
              [[ "$entry" == "re2c" ]] && continue
              echo "product packaging is forbidden in vcpkg-cache: packaging/$entry" >&2
              exit 1
            done < <(find packaging -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          fi

          for workflow in .github/workflows/*.yml; do
            case "$(basename "$workflow")" in
              re2c-tools-package.yml|validate-cache-contract.yml) continue ;;
            esac
            if grep -qE 'dotnet[[:space:]]+nuget[[:space:]]+push|PackageId>.*\.Native<' "$workflow"; then
              echo "product package publication is forbidden in vcpkg-cache: $workflow" >&2
              exit 1
            fi
          done

          if grep -Eiq 'TurboAgent|TurboMedia|TurboDB|MongoDB|mongo-c-driver|qigao-mongodb' .github/workflows/warm-cache.yml; then
            echo "product-specific cache production is forbidden in warm-cache.yml" >&2
            exit 1
          fi

          if [[ -e producers/turbomedia.ref ]]; then
            ref="$(tr -d '\r\n' < producers/turbomedia.ref)"
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "producers/turbomedia.ref must contain one exact 40-hex source commit" >&2
              exit 1
            fi
            test -f .github/workflows/turbomedia-media-cache.yml
            grep -Fq 'repository: qigao/turbomedia' .github/workflows/turbomedia-media-cache.yml
            grep -Fq 'X_VCPKG_NUGET_ID_PREFIX: vcpkg-cache' .github/workflows/turbomedia-media-cache.yml
            grep -Fq 'mode: readwrite' .github/workflows/turbomedia-media-cache.yml
            grep -Fq -- '--only-binarycaching' .github/workflows/turbomedia-media-cache.yml
            if find producers -mindepth 1 -type f ! -name '*.ref' -print -quit | grep -q .; then
              echo "producer state must be source refs only; product manifests/overlays stay in product repositories" >&2
              exit 1
            fi
          fi

      - name: Verify canonical contract identity
        shell: bash
        env:
          OUTPUT_CONTRACT: ${{ steps.cache.outputs.contract_version }}
          OUTPUT_REVISION: ${{ steps.cache.outputs.cache_revision }}
          OUTPUT_TOOL: ${{ steps.cache.outputs.tool_revision }}
          OUTPUT_SCRIPTS: ${{ steps.cache.outputs.scripts_revision }}
        run: |
          set -euo pipefail
          # Native package restoration uses only local ABI files; no NuGet/
          # Mono provider may be silently added to contract validation.
          case "$VCPKG_BINARY_SOURCES" in
            clear\;files,*) ;;
            *) echo 'A NuGet provider was configured for curl-only validation' >&2; exit 1 ;;
          esac
          if [[ "$VCPKG_BINARY_SOURCES" == *';nuget'* ]]; then
            echo 'Legacy NuGet native cache source is forbidden' >&2; exit 1
          fi
          expected_revision="$(python3 scripts/cache-contract-revision.py "$GITHUB_WORKSPACE")"
          expected_contract="$(tr -d '\r\n' < cache-contract-version.txt)"
          expected_tool="$(tr -d '\r\n' < vcpkg-tool-version.txt)"
          expected_scripts="$(tr -d '\r\n' < vcpkg-scripts-revision.txt)"
          test "$OUTPUT_CONTRACT" = "$expected_contract"
          test "$OUTPUT_REVISION" = "$expected_revision"
          test "$OUTPUT_TOOL" = "$expected_tool"
          test "$OUTPUT_SCRIPTS" = "$expected_scripts"
          test "$VCPKG_CACHE_CONTRACT_VERSION" = "$expected_contract"
          test "$VCPKG_CACHE_REVISION" = "$expected_revision"
          expected_root="$RUNNER_TEMP/qigao-vcpkg-contract-v$expected_contract-$expected_revision"
          test "$VCPKG_CACHE_REPOSITORY_ROOT" = "$expected_root"
          test "$VCPKG_OVERLAY_PORTS" = "$expected_root/ports"
          test "$VCPKG_OVERLAY_TRIPLETS" = "$expected_root/triplets"
          test -d "$expected_root/ports"
          test -d "$expected_root/triplets"
          test -f "$expected_root/cmake/QigaoVcpkgToolchain.cmake"

      - name: Verify historical versioned-port objects are local
        shell: bash
        run: |
          set -euo pipefail
          tree="$(
            python3 - "$VCPKG_ROOT/versions/s-/sqlite3.json" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          for entry in data["versions"]:
              version = entry.get("version-string") or entry.get("version-semver") or entry.get("version")
              if version == "3.49.0":
                  print(entry["git-tree"])
                  break
          else:
              raise SystemExit("sqlite3 3.49.0 is missing from the pinned vcpkg version database")
          PY
          )"
          test -n "$tree"
          git -C "$VCPKG_ROOT" cat-file -e "$tree^{tree}"
          git -C "$VCPKG_ROOT" archive "$tree" >/dev/null


  linux_arm64:
    name: Contract / ubuntu-24.04-arm
    runs-on: ubuntu-24.04-arm
    outputs:
      revision: ${{ steps.cache.outputs.cache_revision }}
      contract: ${{ steps.cache.outputs.contract_version }}
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          manifest-root: cache-contracts/optional-feature
          triplet: arm64-linux
          host-triplet: arm64-linux
      - name: Verify canonical contract identity
        shell: bash
        env:
          OUTPUT_CONTRACT: ${{ steps.cache.outputs.contract_version }}
          OUTPUT_REVISION: ${{ steps.cache.outputs.cache_revision }}
          OUTPUT_TOOL: ${{ steps.cache.outputs.tool_revision }}
        run: |
          set -euo pipefail
          # Native package restoration uses only local ABI files; no NuGet/
          # Mono provider may be silently added to contract validation.
          case "$VCPKG_BINARY_SOURCES" in
            clear\;files,*) ;;
            *) echo 'A NuGet provider was configured for curl-only validation' >&2; exit 1 ;;
          esac
          if [[ "$VCPKG_BINARY_SOURCES" == *';nuget'* ]]; then
            echo 'Legacy NuGet native cache source is forbidden' >&2; exit 1
          fi
          expected_revision="$(python3 scripts/cache-contract-revision.py "$GITHUB_WORKSPACE")"
          expected_contract="$(tr -d '\r\n' < cache-contract-version.txt)"
          expected_tool="$(tr -d '\r\n' < vcpkg-tool-version.txt)"
          test "$OUTPUT_CONTRACT" = "$expected_contract"
          test "$OUTPUT_REVISION" = "$expected_revision"
          test "$OUTPUT_TOOL" = "$expected_tool"
          expected_root="$RUNNER_TEMP/qigao-vcpkg-contract-v$expected_contract-$expected_revision"
          test "$VCPKG_CACHE_REPOSITORY_ROOT" = "$expected_root"
          test "$VCPKG_OVERLAY_PORTS" = "$expected_root/ports"
          test "$VCPKG_OVERLAY_TRIPLETS" = "$expected_root/triplets"
          test -f "$expected_root/cmake/QigaoVcpkgToolchain.cmake"

      - name: Prepare Linux arm64 SDK build dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config autoconf automake libtool

      - name: Qualify focused arm64-linux SDK dependency closure
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/linux-arm64-sdk-deps"
          install_root="$RUNNER_TEMP/linux-arm64-sdk-deps-install"
          rm -rf "$manifest" "$install_root"
          mkdir -p "$manifest"
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["builtin-baseline"])')"
          cat > "$manifest/vcpkg.json" <<EOF
          {
            "name": "qigao-linux-arm64-sdk-deps",
            "version-string": "1",
            "dependencies": [
              {"name":"pkgconf","host":true},
              "simde",
              "zstd",
              "aklomp-base64",
              "c-ares",
              "libuv",
              "kcp",
              "gmssl",
              "miniaudio",
              {"name":"zeromq","default-features":false}
            ],
            "builtin-baseline": "$baseline"
          }
          EOF
          # Resolve the exact source-owned arm64 manifest and its host
          # closure over curl NuGet V3; no NuGet/Mono provider is consulted.
          GH_TOKEN="${{ github.token }}" python3 scripts/restore-manifest-cache.py \
            --manifest-root "$manifest" \
            --triplet arm64-linux --host-triplet arm64-linux
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$manifest" \
            --x-install-root="$install_root" \
            --triplet arm64-linux \
            --host-triplet arm64-linux
          test -f "$install_root/arm64-linux/include/zmq.h"
          test -f "$install_root/arm64-linux/include/gmssl/tls.h"
          test -f "$install_root/arm64-linux/include/simde/x86/sse2.h"

  macos:
    name: Contract / macos-15
    runs-on: macos-15
    outputs:
      revision: ${{ steps.cache.outputs.cache_revision }}
      contract: ${{ steps.cache.outputs.contract_version }}
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          manifest-root: cache-contracts/optional-feature
          triplet: arm64-osx
          host-triplet: arm64-osx
      - name: Verify canonical contract identity
        shell: bash
        env:
          OUTPUT_CONTRACT: ${{ steps.cache.outputs.contract_version }}
          OUTPUT_REVISION: ${{ steps.cache.outputs.cache_revision }}
        run: |
          set -euo pipefail
          # Native package restoration uses only local ABI files; no NuGet/
          # Mono provider may be silently added to contract validation.
          case "$VCPKG_BINARY_SOURCES" in
            clear\;files,*) ;;
            *) echo 'A NuGet provider was configured for curl-only validation' >&2; exit 1 ;;
          esac
          if [[ "$VCPKG_BINARY_SOURCES" == *';nuget'* ]]; then
            echo 'Legacy NuGet native cache source is forbidden' >&2; exit 1
          fi
          expected_revision="$(python3 scripts/cache-contract-revision.py "$GITHUB_WORKSPACE")"
          expected_contract="$(tr -d '\r\n' < cache-contract-version.txt)"
          test "$OUTPUT_CONTRACT" = "$expected_contract"
          test "$OUTPUT_REVISION" = "$expected_revision"
          expected_root="$RUNNER_TEMP/qigao-vcpkg-contract-v$expected_contract-$expected_revision"
          test "$VCPKG_CACHE_REPOSITORY_ROOT" = "$expected_root"
          test "$VCPKG_OVERLAY_PORTS" = "$expected_root/ports"
          test "$VCPKG_OVERLAY_TRIPLETS" = "$expected_root/triplets"
          test -d "$expected_root/ports"
          test -d "$expected_root/triplets"
          test -f "$expected_root/cmake/QigaoVcpkgToolchain.cmake"

  windows:
    name: Contract / windows-2025
    runs-on: windows-2025
    outputs:
      revision: ${{ steps.cache.outputs.cache_revision }}
      contract: ${{ steps.cache.outputs.contract_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Select real LLVM-MinGW UCRT compiler and dependency chainload
        id: llvm
        uses: ./.github/actions/setup-llvm-mingw
        with:
          target: x64
          build-type: toolchain-only
      - id: cache
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          manifest-root: cache-contracts/optional-feature
          triplet: qigao-x64-windows-llvm-mingw
          host-triplet: qigao-x64-windows-llvm-mingw
      - name: Verify canonical contract identity
        shell: pwsh
        env:
          OUTPUT_CONTRACT: ${{ steps.cache.outputs.contract_version }}
          OUTPUT_REVISION: ${{ steps.cache.outputs.cache_revision }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:VCPKG_BINARY_SOURCES.StartsWith('clear;files,') -or
              $env:VCPKG_BINARY_SOURCES -match '(?i)(^|;)nuget') {
            throw 'Legacy NuGet provider configured in canonical curl-only contract'
          }
          $expectedRevision = (& python scripts/cache-contract-revision.py $env:GITHUB_WORKSPACE).Trim()
          if ($LASTEXITCODE -ne 0) { throw "revision calculation failed" }
          $expectedContract = (Get-Content cache-contract-version.txt -Raw).Trim()
          if ($env:OUTPUT_CONTRACT -ne $expectedContract) { throw "contract output mismatch" }
          if ($env:OUTPUT_REVISION -ne $expectedRevision) { throw "revision output mismatch" }
          $expectedRoot = Join-Path $env:RUNNER_TEMP "qigao-vcpkg-contract-v$expectedContract-$expectedRevision"
          # Canonical curl transport emits Windows paths with forward slashes.
          # Compare resolved filesystem identities, not separator spelling.
          function Assert-SamePath([string]$actual, [string]$expected, [string]$label) {
            if ([string]::IsNullOrWhiteSpace($actual)) { throw "$label path missing" }
            $resolvedActual = [System.IO.Path]::GetFullPath($actual).TrimEnd('\', '/')
            $resolvedExpected = [System.IO.Path]::GetFullPath($expected).TrimEnd('\', '/')
            if (-not [string]::Equals($resolvedActual, $resolvedExpected, [StringComparison]::OrdinalIgnoreCase)) {
              throw "$label path mismatch: actual=$resolvedActual expected=$resolvedExpected"
            }
          }
          Assert-SamePath $env:VCPKG_CACHE_REPOSITORY_ROOT $expectedRoot "cache root"
          Assert-SamePath $env:VCPKG_OVERLAY_PORTS (Join-Path $expectedRoot "ports") "overlay ports"
          Assert-SamePath $env:VCPKG_OVERLAY_TRIPLETS (Join-Path $expectedRoot "triplets") "overlay triplets"
          if (-not (Test-Path -LiteralPath (Join-Path $expectedRoot "cmake\QigaoVcpkgToolchain.cmake") -PathType Leaf)) {
            throw "canonical toolchain copy is missing"
          }
          if ($env:QIGAO_VCPKG_WINDOWS_TRIPLET -ne "qigao-x64-windows-llvm-mingw") {
            throw "canonical Windows triplet env mismatch"
          }
          $triplet = Join-Path $env:VCPKG_CACHE_REPOSITORY_ROOT "triplets\qigao-x64-windows-llvm-mingw.cmake"
          if (-not (Test-Path -LiteralPath $triplet -PathType Leaf)) {
            throw "canonical Windows triplet is missing"
          }
          $tripletBytes = [System.IO.File]::ReadAllBytes($triplet)
          for ($i = 0; $i -lt ($tripletBytes.Length - 1); $i++) {
            if ($tripletBytes[$i] -eq 13 -and $tripletBytes[$i + 1] -eq 10) {
              throw "canonical Windows triplet must use LF line endings"
            }
          }
          $toolchain = Join-Path $env:VCPKG_CACHE_REPOSITORY_ROOT "cmake\QigaoVcpkgToolchain.cmake"
          $toolchainBytes = [System.IO.File]::ReadAllBytes($toolchain)
          for ($i = 0; $i -lt ($toolchainBytes.Length - 1); $i++) {
            if ($toolchainBytes[$i] -eq 13 -and $toolchainBytes[$i + 1] -eq 10) {
              throw "canonical vcpkg toolchain must use LF line endings"
            }
          }
          $tripletText = Get-Content -LiteralPath $triplet -Raw
          foreach ($required in @(
            'set(VCPKG_TARGET_ARCHITECTURE x64)',
            'set(VCPKG_CMAKE_SYSTEM_NAME MinGW)',
            'set(VCPKG_CHAINLOAD_TOOLCHAIN_FILE "$ENV{LLVM_MINGW_HOST_DEPENDENCY_TOOLCHAIN_FILE}")'
          )) {
            if (-not $tripletText.Contains($required)) { throw "MinGW host triplet declaration missing: $required" }
          }
          # A Windows x64 runner may build ARM64 libraries. The independent
          # x64 host compiler must be available for all native build tools.
          foreach ($file in @($env:LLVM_MINGW_HOST_DEPENDENCY_TOOLCHAIN_FILE,
                              $env:LLVM_MINGW_DEPENDENCY_TOOLCHAIN_FILE)) {
            if ([string]::IsNullOrWhiteSpace($file) -or
                -not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw 'LLVM-MinGW host/target dependency toolchain is missing'
            }
          }
          $armTriplet = Join-Path $env:VCPKG_CACHE_REPOSITORY_ROOT "triplets\qigao-arm64-windows-llvm-mingw.cmake"
          if (-not (Test-Path -LiteralPath $armTriplet -PathType Leaf)) {
            throw 'Canonical Windows ARM64 MinGW triplet is missing'
          }
          $armText = Get-Content -LiteralPath $armTriplet -Raw
          foreach ($required in @(
            'set(VCPKG_TARGET_ARCHITECTURE arm64)',
            'set(VCPKG_CMAKE_SYSTEM_NAME MinGW)',
            'set(VCPKG_CHAINLOAD_TOOLCHAIN_FILE "$ENV{LLVM_MINGW_DEPENDENCY_TOOLCHAIN_FILE}")'
          )) {
            if (-not $armText.Contains($required)) { throw "MinGW target triplet declaration missing: $required" }
          }
          if (Test-Path (Join-Path $env:VCPKG_CACHE_REPOSITORY_ROOT "triplets\qigao-x64-windows-v145.cmake")) {
            throw 'retired v145 triplet must not be copied'
          }

  consistent:
    name: Contract identity is cross-platform stable
    needs: [linux, linux_arm64, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Compare host identities
        shell: bash
        env:
          LINUX_CONTRACT: ${{ needs.linux.outputs.contract }}
          LINUX_ARM64_CONTRACT: ${{ needs.linux_arm64.outputs.contract }}
          MACOS_CONTRACT: ${{ needs.macos.outputs.contract }}
          WINDOWS_CONTRACT: ${{ needs.windows.outputs.contract }}
          LINUX_REVISION: ${{ needs.linux.outputs.revision }}
          LINUX_ARM64_REVISION: ${{ needs.linux_arm64.outputs.revision }}
          MACOS_REVISION: ${{ needs.macos.outputs.revision }}
          WINDOWS_REVISION: ${{ needs.windows.outputs.revision }}
        run: |
          set -euo pipefail
          test "$LINUX_CONTRACT" = "$LINUX_ARM64_CONTRACT"
          test "$LINUX_CONTRACT" = "$MACOS_CONTRACT"
          test "$LINUX_CONTRACT" = "$WINDOWS_CONTRACT"
          test "$LINUX_REVISION" = "$LINUX_ARM64_REVISION"
          test "$LINUX_REVISION" = "$MACOS_REVISION"
          test "$LINUX_REVISION" = "$WINDOWS_REVISION"
          printf 'contract=%s\nrevision=%s\n' "$LINUX_CONTRACT" "$LINUX_REVISION"


name: Warm consumer vcpkg cache

on:
  pull_request:
    paths:
      - ".github/workflows/warm-consumer-cache.yml"
      - ".github/actions/setup-vcpkg-cache/**"
      - "ports/**"
      - "scripts/vcpkg-required-commits.py"
  workflow_dispatch:
    inputs:
      repository:
        description: Consumer repository in owner/name form
        required: true
        default: qigao/TurboAgent
        type: string
      ref:
        description: Consumer git ref containing vcpkg.json
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: warm-consumer-vcpkg-${{ inputs.repository || 'qigao/TurboAgent' }}-${{ inputs.ref || 'main' }}
  cancel-in-progress: false

jobs:
  windows:
    name: Warm consumer Windows x64
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Materialize consumer manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CONSUMER_REPOSITORY: ${{ inputs.repository || 'qigao/TurboAgent' }}
          CONSUMER_REF: ${{ inputs.ref || 'main' }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:CONSUMER_REPOSITORY -notmatch '^qigao/[A-Za-z0-9._-]+$') {
            throw "consumer repository must belong to qigao"
          }
          if ($env:CONSUMER_REF -notmatch '^[A-Za-z0-9._/-]+$') {
            throw "invalid consumer ref"
          }
          $manifestRoot = Join-Path $env:GITHUB_WORKSPACE ".consumer-manifest"
          New-Item -ItemType Directory -Force -Path $manifestRoot | Out-Null
          $manifestPath = Join-Path $manifestRoot "vcpkg.json"
          $apiPath = "repos/$env:CONSUMER_REPOSITORY/contents/vcpkg.json?ref=$env:CONSUMER_REF"
          gh api -H "Accept: application/vnd.github.raw+json" $apiPath | Set-Content -LiteralPath $manifestPath -Encoding utf8
          Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json | Out-Null

      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite

      - name: Prepare Windows build tools
        shell: pwsh
        run: choco install ninja nasm strawberryperl -y --no-progress

      - name: Warm consumer Windows ABI closure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installed = Join-Path $env:RUNNER_TEMP "consumer-vcpkg-windows"
          if (Test-Path -LiteralPath $installed) {
            Remove-Item -LiteralPath $installed -Recurse -Force
          }
          $args = @(
            "install",
            "--x-manifest-root=$env:GITHUB_WORKSPACE\.consumer-manifest",
            "--x-install-root=$installed",
            "--triplet=$env:QIGAO_VCPKG_WINDOWS_TRIPLET"
          )
          & "$env:VCPKG_ROOT\vcpkg.exe" @args
          if ($LASTEXITCODE -ne 0) {
            throw "consumer Windows cache warm failed"
          }

  windows-cache-contract:
    name: Consumer Windows clean L2 restore
    needs: windows
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Materialize consumer manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CONSUMER_REPOSITORY: ${{ inputs.repository || 'qigao/TurboAgent' }}
          CONSUMER_REF: ${{ inputs.ref || 'main' }}
        run: |
          $ErrorActionPreference = "Stop"
          $manifestRoot = Join-Path $env:GITHUB_WORKSPACE ".consumer-manifest"
          New-Item -ItemType Directory -Force -Path $manifestRoot | Out-Null
          $manifestPath = Join-Path $manifestRoot "vcpkg.json"
          $apiPath = "repos/$env:CONSUMER_REPOSITORY/contents/vcpkg.json?ref=$env:CONSUMER_REF"
          gh api -H "Accept: application/vnd.github.raw+json" $apiPath | Set-Content -LiteralPath $manifestPath -Encoding utf8
          Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json | Out-Null

      - name: Use empty L1 cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "empty-consumer-vcpkg-l1"
          if (Test-Path -LiteralPath $cache) {
            Remove-Item -LiteralPath $cache -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_BINARY_CACHE=$cache" >> $env:GITHUB_ENV

      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read

      - name: Prepare Windows build tools
        shell: pwsh
        run: choco install ninja nasm strawberryperl -y --no-progress

      - name: Verify consumer Windows ABI closure from shared cache only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installed = Join-Path $env:RUNNER_TEMP "consumer-vcpkg-windows-verify"
          if (Test-Path -LiteralPath $installed) {
            Remove-Item -LiteralPath $installed -Recurse -Force
          }
          if (Test-Path -LiteralPath $env:VCPKG_BINARY_CACHE) {
            Remove-Item -LiteralPath $env:VCPKG_BINARY_CACHE -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $env:VCPKG_BINARY_CACHE | Out-Null
          $args = @(
            "install",
            "--x-manifest-root=$env:GITHUB_WORKSPACE\.consumer-manifest",
            "--x-install-root=$installed",
            "--triplet=$env:QIGAO_VCPKG_WINDOWS_TRIPLET",
            "--only-binarycaching"
          )
          & "$env:VCPKG_ROOT\vcpkg.exe" @args
          if ($LASTEXITCODE -ne 0) {
            throw "consumer Windows clean-L2 restore failed"
          }

  android:
    name: Warm consumer Android arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Materialize consumer manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONSUMER_REPOSITORY: ${{ inputs.repository || 'qigao/TurboAgent' }}
          CONSUMER_REF: ${{ inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          [[ "$CONSUMER_REPOSITORY" =~ ^qigao/[A-Za-z0-9._-]+$ ]]
          [[ "$CONSUMER_REF" =~ ^[A-Za-z0-9._/-]+$ ]]
          mkdir -p .consumer-manifest
          gh api -H "Accept: application/vnd.github.raw+json"             "repos/$CONSUMER_REPOSITORY/contents/vcpkg.json?ref=$CONSUMER_REF"             > .consumer-manifest/vcpkg.json
          python3 -m json.tool .consumer-manifest/vcpkg.json >/dev/null

      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite

      - name: Prepare Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             ninja-build pkg-config nasm autoconf automake libtool
          test -n "${ANDROID_NDK_HOME:-}"
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"

      - name: Warm consumer Android ABI closure
        shell: bash
        run: |
          set -euo pipefail
          installed="$RUNNER_TEMP/consumer-vcpkg-android"
          rm -rf "$installed"
          "$VCPKG_ROOT/vcpkg" install             --x-manifest-root="$GITHUB_WORKSPACE/.consumer-manifest"             --x-install-root="$installed"             --triplet arm64-android

  android-cache-contract:
    name: Consumer Android clean L2 restore
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Materialize consumer manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONSUMER_REPOSITORY: ${{ inputs.repository || 'qigao/TurboAgent' }}
          CONSUMER_REF: ${{ inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          mkdir -p .consumer-manifest
          gh api -H "Accept: application/vnd.github.raw+json"             "repos/$CONSUMER_REPOSITORY/contents/vcpkg.json?ref=$CONSUMER_REF"             > .consumer-manifest/vcpkg.json
          python3 -m json.tool .consumer-manifest/vcpkg.json >/dev/null

      - name: Use empty L1 cache
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/empty-consumer-vcpkg-l1"
          rm -rf "$cache"
          mkdir -p "$cache"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read

      - name: Prepare Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             ninja-build pkg-config nasm autoconf automake libtool
          test -n "${ANDROID_NDK_HOME:-}"
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"

      - name: Verify consumer Android ABI closure from shared cache only
        shell: bash
        run: |
          set -euo pipefail
          installed="$RUNNER_TEMP/consumer-vcpkg-android-verify"
          rm -rf "$installed" "$VCPKG_BINARY_CACHE"
          mkdir -p "$VCPKG_BINARY_CACHE"
          "$VCPKG_ROOT/vcpkg" install             --x-manifest-root="$GITHUB_WORKSPACE/.consumer-manifest"             --x-install-root="$installed"             --triplet arm64-android             --only-binarycaching

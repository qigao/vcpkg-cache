name: Explicit native GitHub Packages cache producer (curl-only)

on:
  pull_request:
    paths:
      - ".github/workflows/curl-only-vcpkg-producer.yml"
  workflow_dispatch:
    inputs:
      package_set:
        description: Bounded, audited native vcpkg package set to compile and publish
        required: true
        type: choice
        options: [simde, wabt, tre]
      publish:
        description: Actually upload new immutable NuGet V3 versions (false = dry-run)
        required: true
        type: boolean
        default: false
      expected_master_sha:
        description: Exact 40-hex master commit; wrong HEAD fails closed
        required: true
        type: string
      expected_native_id:
        description: Exact selected target package ID (e.g. wabt_x64-linux); required to publish
        required: false
        type: string
        default: ""
      expected_native_version:
        description: Exact 64-hex native ABI version, including vcpkg prefix; required to publish
        required: false
        type: string
        default: ""
      require_new_upload:
        description: Qualify a real new NuGet V3 PUT, not just reuse an existing package
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

concurrency:
  group: curl-vcpkg-producer-${{ inputs.package_set }}
  cancel-in-progress: false

jobs:
  native-producer:
    name: Native Linux x64 ABI source build and read-only admission
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      github.repository == 'qigao/vcpkg-cache'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/build/curl-native-producer/cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require exact approved source checkout
        shell: bash
        env:
          EXPECTED_MASTER_SHA: ${{ inputs.expected_master_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MASTER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REPOSITORY" = qigao/vcpkg-cache
          test "$GITHUB_REF" = refs/heads/master
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$EXPECTED_MASTER_SHA" = "$GITHUB_SHA"
          test "$EXPECTED_MASTER_SHA" = "$(git rev-parse HEAD)"
      - name: Prepare native compiler and source build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm \
            autoconf automake libtool curl
          command -v cc
          command -v c++
          command -v ninja
          command -v curl
      - name: Bootstrap canonical vcpkg without Mono or NuGet
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/build/curl-native-producer"
          mkdir -p "$VCPKG_BINARY_CACHE"
          python scripts/setup-vcpkg-curl-cache.py "$GITHUB_WORKSPACE"
      - name: Select one explicit vcpkg manifest
        shell: bash
        env:
          PACKAGE_SET: ${{ inputs.package_set }}
        run: |
          set -euo pipefail
          case "$PACKAGE_SET" in
            simde) manifest="$GITHUB_WORKSPACE/cache-contracts/header-only" ;;
            wabt) manifest="$GITHUB_WORKSPACE/cache-contracts/wabt-producer" ;;
            tre) manifest="$GITHUB_WORKSPACE/cache-contracts/tre-producer" ;;
            *) echo "Unqualified producer package set" >&2; exit 1 ;;
          esac
          test -f "$manifest/vcpkg.json"
          echo "ABI_MANIFEST=$manifest" >> "$GITHUB_ENV"
          echo "Producer manifest: $manifest"
      - name: Build native artifacts from the pinned source graph into local L1
        shell: bash
        run: |
          set -euo pipefail
          test -x "$VCPKG_ROOT/vcpkg"
          test -n "$VCPKG_BINARY_CACHE"
          mkdir -p "$VCPKG_BINARY_CACHE"
          # Write-only files source forces a real source build. It cannot read
          # an older ABI from NuGet, Mono or any remote provider.
          export VCPKG_BINARY_SOURCES="clear;files,$VCPKG_BINARY_CACHE,write"
          "$VCPKG_ROOT/vcpkg" install \
            "--x-manifest-root=$ABI_MANIFEST" \
            "--x-install-root=$RUNNER_TEMP/native-producer-install" \
            --triplet=x64-linux --host-triplet=x64-linux
          test "$(find "$VCPKG_BINARY_CACHE" -type f -name '*.zip' | wc -l)" -gt 0
          echo "Local native ABI build completed"
      - name: Derive exact ABI and check existing remote versions (read only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_SET: ${{ inputs.package_set }}
          EXPECTED_NATIVE_ID: ${{ inputs.expected_native_id }}
          EXPECTED_NATIVE_VERSION: ${{ inputs.expected_native_version }}
          DO_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          export VCPKG_BINARY_SOURCES="clear;files,$VCPKG_BINARY_CACHE,write"
          stage="$GITHUB_WORKSPACE/build/curl-native-producer"
          plan="$stage/packages.config"
          # Plan admission must use a fresh install root: the source-build
          # installation above is intentionally populated and can hide ABIs
          # from a dry-run computed against that same installed state.
          probe="$RUNNER_TEMP/native-producer-abi-probe"
          test ! -e "$probe"
          "$VCPKG_ROOT/vcpkg" install \
            "--x-manifest-root=$ABI_MANIFEST" \
            "--x-install-root=$probe" \
            --triplet=x64-linux --host-triplet=x64-linux \
            --dry-run "--x-write-nuget-packages-config=$plan"
          test -s "$plan"
          test "$VCPKG_BINARY_SOURCES" = "clear;files,$VCPKG_BINARY_CACHE,write"
          # Source-build producer is read-only, but must verify the intended
          # immutable target before any future authorized write stage.
          if [[ "$DO_PUBLISH" == "true" || -n "$EXPECTED_NATIVE_ID" || -n "$EXPECTED_NATIVE_VERSION" ]]; then
            python3 scripts/ci/verify-native-publish-target.py \
              --plan "$plan" --package-set "$PACKAGE_SET" \
              --expected-id "$EXPECTED_NATIVE_ID" --expected-version "$EXPECTED_NATIVE_VERSION"
          fi
          python3 scripts/publish-vcpkg-curl-cache.py \
            --packages-config "$plan" --cache "$VCPKG_BINARY_CACHE" \
            | tee "$stage/curl-publish-proof.txt"
          grep -E 'publish_summary total=[1-9][0-9]*' "$stage/curl-publish-proof.txt"
          if grep -Eq 'uploaded=[1-9][0-9]*' "$stage/curl-publish-proof.txt"; then
            echo 'Read-only native ABI producer unexpectedly reported remote upload' >&2
            exit 1
          fi
          printf 'source_sha=%s\npackage_set=%s\nexpected_id=%s\nexpected_version=%s\n' \
            "$GITHUB_SHA" "$PACKAGE_SET" "$EXPECTED_NATIVE_ID" "$EXPECTED_NATIVE_VERSION" \
            > "$stage/source-proof.txt"
          (
            cd "$stage"
            find cache -type f -name '*.zip' -print0 \
              | sort -z | xargs -0 -r sha256sum > SHA256SUMS
            sha256sum packages.config source-proof.txt >> SHA256SUMS
            test -s SHA256SUMS
            sha256sum --check --status SHA256SUMS
          )
      - name: Preserve native ABI ZIPs for a separately approved write job
        uses: actions/upload-artifact@v4
        with:
          name: curl-native-abi-${{ inputs.package_set }}-${{ github.run_id }}
          path: build/curl-native-producer/
          if-no-files-found: error
          retention-days: 14

  native-publish:
    name: Protected immutable NuGet V3 curl upload (opt-in only)
    if: >-
      inputs.publish == true &&
      github.repository == 'qigao/vcpkg-cache' &&
      github.ref == 'refs/heads/master'
    needs: native-producer
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: native-cache-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Required reviewers and an environment-scoped secret must be configured
      # by the repository administrator. Merely naming the Environment can
      # auto-create an unprotected environment on GitHub.
      - name: Require separately armed, protected native publish environment
        shell: bash
        env:
          NATIVE_CACHE_PUBLISH_ARM: ${{ secrets.NATIVE_CACHE_PUBLISH_ARM }}
        run: |
          set -euo pipefail
          if [[ "${NATIVE_CACHE_PUBLISH_ARM:-}" != "native-cache-publish-v1" ]]; then
            echo 'Protected native-cache-publish environment is not explicitly armed' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: curl-native-abi-${{ inputs.package_set }}-${{ github.run_id }}
          path: build/curl-native-producer
      - name: Validate immutable source and transferred ABI files
        shell: bash
        env:
          EXPECTED_MASTER_SHA: ${{ inputs.expected_master_sha }}
          PACKAGE_SET: ${{ inputs.package_set }}
          EXPECTED_NATIVE_ID: ${{ inputs.expected_native_id }}
          EXPECTED_NATIVE_VERSION: ${{ inputs.expected_native_version }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MASTER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_MASTER_SHA" = "$GITHUB_SHA"
          test "$EXPECTED_MASTER_SHA" = "$(git rev-parse HEAD)"
          # A master update during approval must not turn an old artifact
          # into a new immutable cache publication.
          remote_master="$(git ls-remote --exit-code \
            https://github.com/qigao/vcpkg-cache.git refs/heads/master | cut -f1)"
          [[ "$remote_master" =~ ^[0-9a-f]{40}$ ]]
          test "$remote_master" = "$EXPECTED_MASTER_SHA"
          test "$GITHUB_REPOSITORY" = qigao/vcpkg-cache
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/master
          cd build/curl-native-producer
          grep -Fx "source_sha=$EXPECTED_MASTER_SHA" source-proof.txt
          grep -Fx 'package_set=${{ inputs.package_set }}' source-proof.txt
          grep -Fx "expected_id=$EXPECTED_NATIVE_ID" source-proof.txt
          grep -Fx "expected_version=$EXPECTED_NATIVE_VERSION" source-proof.txt
          sha256sum --check --status SHA256SUMS
          test -s packages.config
          # Revalidate the exact operator intent AFTER environment approval,
          # from the downloaded, SHA-attested source ABI plan.
          python3 "$GITHUB_WORKSPACE/scripts/ci/verify-native-publish-target.py" \
            --plan packages.config --package-set "$PACKAGE_SET" \
            --expected-id "$EXPECTED_NATIVE_ID" --expected-version "$EXPECTED_NATIVE_VERSION"
      - name: Upload exact immutable ABI through canonical native curl producer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_NEW_UPLOAD: ${{ inputs.require_new_upload }}
          EXPECTED_NATIVE_ID: ${{ inputs.expected_native_id }}
          EXPECTED_NATIVE_VERSION: ${{ inputs.expected_native_version }}
        run: |
          set -euo pipefail
          stage="$GITHUB_WORKSPACE/build/curl-native-producer"
          python3 scripts/publish-vcpkg-curl-cache.py \
            --packages-config "$stage/packages.config" \
            --cache "$stage/cache" --publish \
            --approved-id "$EXPECTED_NATIVE_ID" \
            --approved-version "$EXPECTED_NATIVE_VERSION" \
            | tee "$RUNNER_TEMP/approved-native-publish-proof.txt"
          grep -E 'publish_summary total=[1-9][0-9]*' \
            "$RUNNER_TEMP/approved-native-publish-proof.txt"
          if [[ "$REQUIRE_NEW_UPLOAD" == "true" ]]; then
            if ! grep -Eq 'uploaded=[1-9][0-9]*' \
              "$RUNNER_TEMP/approved-native-publish-proof.txt"; then
              echo 'No real newly published package: existing-only verification cannot qualify curl upload' >&2
              exit 1
            fi
          fi
      - name: Retain approved exact upload attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curl-native-upload-${{ inputs.package_set }}-${{ github.run_id }}
          path: ${{ runner.temp }}/approved-native-publish-proof.txt
          if-no-files-found: warn
          retention-days: 30

  read-back:
    name: "Fresh runner: exact binary-only GitHub Packages read-back"
    if: ${{ inputs.publish }}
    needs: native-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Install native compiler tools required for ABI detection
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config curl
      - name: Read exact immutable ABI from NuGet V3 with curl
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          triplet: x64-linux
          host-triplet: x64-linux
          manifest-root: cache-contracts/${{ inputs.package_set == 'simde' && 'header-only' || inputs.package_set == 'wabt' && 'wabt-producer' || 'tre-producer' }}
      - name: Require exact approved native ABI from the curl restoration plan
        shell: bash
        env:
          PACKAGE_SET: ${{ inputs.package_set }}
          EXPECTED_NATIVE_ID: ${{ inputs.expected_native_id }}
          EXPECTED_NATIVE_VERSION: ${{ inputs.expected_native_version }}
        run: |
          set -euo pipefail
          # setup-vcpkg-curl-cache produced the actual vcpkg dry-run plan and
          # fetched those exact ZIPs. Do not rerun a second resolver or
          # infer an ABI from the package name / successful restore count.
          plan="$RUNNER_TEMP/qigao-curl-vcpkg-abi/packages.config"
          test -s "$plan"
          python3 scripts/ci/verify-native-publish-target.py \
            --plan "$plan" --package-set "$PACKAGE_SET" \
            --expected-id "$EXPECTED_NATIVE_ID" \
            --expected-version "$EXPECTED_NATIVE_VERSION"

      - name: Require binary-only native install from fresh L1 without Mono
        shell: bash
        env:
          PACKAGE_SET: ${{ inputs.package_set }}
        run: |
          set -euo pipefail
          test "$VCPKG_BINARY_SOURCES" = "clear;files,$VCPKG_BINARY_CACHE,readwrite"
          case "$PACKAGE_SET" in
            simde) manifest="$GITHUB_WORKSPACE/cache-contracts/header-only" ;;
            wabt) manifest="$GITHUB_WORKSPACE/cache-contracts/wabt-producer" ;;
            tre) manifest="$GITHUB_WORKSPACE/cache-contracts/tre-producer" ;;
            *) echo "Unqualified native read-back package set" >&2; exit 1 ;;
          esac
          "$VCPKG_ROOT/vcpkg" install \
            "--x-manifest-root=$manifest" \
            "--x-install-root=$RUNNER_TEMP/verified-native-abi" \
            --triplet=x64-linux --host-triplet=x64-linux --only-binarycaching \
            2>&1 | tee "$RUNNER_TEMP/fresh-binary-verify.log"
          grep -Eq 'Restored [1-9][0-9]* package\(s\)' "$RUNNER_TEMP/fresh-binary-verify.log"
          case "$PACKAGE_SET" in
            simde)
              test -f "$RUNNER_TEMP/verified-native-abi/x64-linux/include/simde/x86/sse.h"
              ;;
            wabt)
              test -x "$RUNNER_TEMP/verified-native-abi/x64-linux/tools/wabt/wast2json"
              ;;
            tre)
              grep -Fq 'tre:x64-linux@0.9.0#1' "$RUNNER_TEMP/fresh-binary-verify.log"
              test -f "$RUNNER_TEMP/verified-native-abi/x64-linux/include/tre/tre.h"
              test -f "$RUNNER_TEMP/verified-native-abi/x64-linux/lib/libtre.a"
              test -f "$RUNNER_TEMP/verified-native-abi/x64-linux/share/unofficial-tre/unofficial-tre-config.cmake"
              ;;
            *) echo "Unqualified native read-back package set" >&2; exit 1 ;;
          esac

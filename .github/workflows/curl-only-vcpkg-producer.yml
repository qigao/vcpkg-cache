name: Build and publish shared vcpkg cache (curl-only)
run-name: Shared vcpkg cache / ${{ inputs.platform }} / ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Dependency platform, or all profiles in one workflow run
        required: true
        type: choice
        default: all
        options:
          - all
          - linux-x64
          - linux-arm64
          - macos-x64
          - macos-arm64
          - windows-x64
          - windows-arm64
          - windows-msvc-x64
          - android-arm64
          - android-x64
      publish:
        description: Upload exact ABI packages to GitHub Packages after building
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  platforms:
    name: Prepare shared downloads and platform matrix
    if: github.repository == 'qigao/vcpkg-cache' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select the complete matrix or one platform
        id: select
        shell: pwsh
        env:
          SELECTED_PLATFORM: ${{ inputs.platform }}
        run: |
          $ErrorActionPreference = 'Stop'
          $platforms = @(
            @{platform='linux-x64'; runner='ubuntu-24.04'; triplet='x64-linux'; host_triplet='x64-linux'}
            @{platform='linux-arm64'; runner='ubuntu-24.04-arm'; triplet='arm64-linux'; host_triplet='arm64-linux'}
            @{platform='macos-x64'; runner='macos-15-intel'; triplet='x64-osx'; host_triplet='x64-osx'}
            @{platform='macos-arm64'; runner='macos-15'; triplet='arm64-osx'; host_triplet='arm64-osx'}
            @{platform='windows-x64'; runner='windows-2025'; triplet='qigao-x64-windows-llvm-mingw'; host_triplet='qigao-x64-windows-llvm-mingw'}
            @{platform='windows-arm64'; runner='windows-11-arm'; triplet='qigao-arm64-windows-llvm-mingw'; host_triplet='qigao-arm64-windows-llvm-mingw'}
            @{platform='windows-msvc-x64'; runner='windows-2025'; triplet='x64-windows'; host_triplet='x64-windows'}
            @{platform='android-arm64'; runner='ubuntu-24.04'; triplet='arm64-android'; host_triplet='x64-linux'}
            @{platform='android-x64'; runner='ubuntu-24.04'; triplet='x64-android'; host_triplet='x64-linux'}
          )
          $selected = @($platforms | Where-Object { $env:SELECTED_PLATFORM -eq 'all' -or $_.platform -eq $env:SELECTED_PLATFORM })
          if ($selected.Count -eq 0) { throw 'Unknown dependency platform.' }
          $matrix = @{include=$selected} | ConvertTo-Json -Depth 4 -Compress
          "matrix=$matrix" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        id: shared-downloads
        with:
          path: |
            build/producer-inputs/blobs
            build/producer-inputs/port-downloads
          key: vcpkg-shared-inputs-v1-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-shared-inputs-v1-${{ inputs.platform }}-
      - name: Install source-download prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool ninja-build pkg-config nasm bison flex libudev-dev curl zip unzip
      - name: Download and verify shared inputs once
        id: download
        shell: pwsh
        env:
          PRODUCER_MATRIX: ${{ steps.select.outputs.matrix }}
        run: |
          python scripts/prepare-producer-inputs.py build/producer-inputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: producer-inputs-${{ github.run_id }}
          path: build/producer-inputs/artifact/
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save verified downloads for preparation retries
        if: always() && steps.shared-downloads.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            build/producer-inputs/blobs
            build/producer-inputs/port-downloads
          key: ${{ steps.shared-downloads.outputs.cache-primary-key }}

  build:
    name: Build shared dependencies / ${{ matrix.platform }}
    needs: platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    concurrency:
      group: shared-vcpkg-producer-${{ matrix.platform }}
      cancel-in-progress: false
    if: github.repository == 'qigao/vcpkg-cache' && github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/build/vcpkg-producer/cache
      VCPKG_DOWNLOADS: ${{ github.workspace }}/build/vcpkg-producer/downloads
      ABI_TRIPLET: ${{ matrix.triplet }}
      ABI_HOST_TRIPLET: ${{ matrix.host_triplet }}
      QIGAO_PREPARED_INPUTS: ${{ github.workspace }}/build/producer-inputs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        id: producer-cache
        with:
          path: |
            ${{ env.VCPKG_BINARY_CACHE }}
            ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-producer-v2-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-producer-v2-${{ matrix.platform }}-
      - uses: actions/download-artifact@v4
        with:
          name: producer-inputs-${{ github.run_id }}
          path: build/producer-inputs
      - name: Install Linux source-build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool ninja-build pkg-config nasm bison flex \
            libudev-dev curl zip unzip
      - uses: ./.github/actions/setup-llvm-native
        if: runner.os != 'Windows'
      - uses: ./.github/actions/setup-llvm-mingw
        if: runner.os == 'Windows' && matrix.platform != 'windows-msvc-x64'
        with:
          target: ${{ matrix.platform == 'windows-arm64' && 'arm64' || 'x64' }}
          build-type: toolchain-only
      - name: Bootstrap canonical vcpkg and isolated files cache
        id: vcpkg-bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/setup-vcpkg-curl-cache.py $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Canonical vcpkg bootstrap failed' }
      - name: Resolve exact ABIs and build dependencies from source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows) {
            $env:CC = $env:LLVM_NATIVE_CC
            $env:CXX = $env:LLVM_NATIVE_CXX
          }
          $env:VCPKG_BINARY_SOURCES = "clear;files,$env:VCPKG_BINARY_CACHE,readwrite"
          $exe = if ($IsWindows) { 'vcpkg.exe' } else { 'vcpkg' }
          $vcpkg = Join-Path $env:VCPKG_ROOT $exe
          $stage = Join-Path $env:GITHUB_WORKSPACE 'build/vcpkg-producer'
          $plan = Join-Path $stage 'packages.config'
          $install = Join-Path $env:RUNNER_TEMP 'shared-vcpkg-installed'
          $arguments = @('install', "--x-manifest-root=$env:GITHUB_WORKSPACE",
            "--triplet=$env:ABI_TRIPLET",
            "--host-triplet=$env:ABI_HOST_TRIPLET")
          # Emit the plan from the same invocation that builds these ABIs.
          & $vcpkg @arguments "--x-install-root=$install" "--x-write-nuget-packages-config=$plan"
          if ($LASTEXITCODE -ne 0) { throw 'Shared dependency source build failed' }
          @{
            source_sha = $env:GITHUB_SHA
            triplet = $env:ABI_TRIPLET
            host_triplet = $env:ABI_HOST_TRIPLET
            cache_revision = $env:VCPKG_CACHE_REVISION
            scripts_revision = $env:VCPKG_SCRIPTS_REVISION
            tool_revision = $env:VCPKG_TOOL_REVISION
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $stage 'source.json') -Encoding utf8
      - name: Package exact ABI archives without uploading
        if: inputs.publish == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'build/vcpkg-producer'
          python scripts/publish-vcpkg-curl-cache.py --packages-config "$stage/packages.config" --cache $env:VCPKG_BINARY_CACHE
          if ($LASTEXITCODE -ne 0) { throw 'Native cache package preparation failed' }
          $checksums = Get-ChildItem -LiteralPath $stage -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($stage, $_.FullName).Replace('\', '/')
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $relative"
          }
          [IO.File]::WriteAllText((Join-Path $stage 'SHA256SUMS'),
            (($checksums -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: vcpkg-cache-${{ matrix.platform }}-${{ github.run_id }}
          overwrite: true
          path: build/vcpkg-producer/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Stage native ABI binaries for the infrastructure release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'build/vcpkg-producer'
          $install = Join-Path $env:RUNNER_TEMP 'shared-vcpkg-installed'
          python scripts/publish-vcpkg-curl-cache.py --packages-config "$stage/packages.config" --cache $env:VCPKG_BINARY_CACHE --release-output "$stage/release" --installed-root $install
          if ($LASTEXITCODE -ne 0) { throw 'Release ABI staging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: vcpkg-release-${{ matrix.platform }}-${{ github.run_id }}
          overwrite: true
          path: build/vcpkg-producer/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save completed dependency ABIs and downloads
        if: always() && steps.vcpkg-bootstrap.outcome == 'success' && steps.producer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.VCPKG_BINARY_CACHE }}
            ${{ env.VCPKG_DOWNLOADS }}
          key: ${{ steps.producer-cache.outputs.cache-primary-key }}

  publish:
    name: Publish immutable ABI packages / ${{ matrix.platform }}
    needs: [platforms, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    if: inputs.publish == true && github.repository == 'qigao/vcpkg-cache' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: native-cache-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require the existing native publication setting
        shell: bash
        env:
          NATIVE_CACHE_PUBLISH_ARM: ${{ secrets.NATIVE_CACHE_PUBLISH_ARM }}
        run: |
          set -euo pipefail
          if [[ "${NATIVE_CACHE_PUBLISH_ARM:-}" != native-cache-publish-v1 ]]; then
            echo 'Configure NATIVE_CACHE_PUBLISH_ARM in the native-cache-publish environment' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: vcpkg-cache-${{ matrix.platform }}-${{ github.run_id }}
          path: build/vcpkg-producer
      - name: Publish the same source-built ABI archives through curl
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd build/vcpkg-producer
          sha256sum --check SHA256SUMS
          python "$GITHUB_WORKSPACE/scripts/publish-vcpkg-curl-cache.py" \
            --packages-config packages.config --cache cache --publish

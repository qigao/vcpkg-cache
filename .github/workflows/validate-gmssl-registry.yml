name: Validate GmSSL registry contract

on:
  pull_request:
    paths:
      - "ports/gmssl/**"
      - "versions/baseline.json"
      - "versions/g-/gmssl.json"
      - ".github/workflows/validate-gmssl-registry.yml"

permissions:
  contents: read

jobs:
  registry:
    name: GmSSL custom registry metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify baseline, version entry and port tree agree
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open("ports/gmssl/vcpkg.json", encoding="utf-8") as f:
              port = json.load(f)
          with open("versions/baseline.json", encoding="utf-8") as f:
              baseline = json.load(f)["default"]
          with open("versions/g-/gmssl.json", encoding="utf-8") as f:
              versions = json.load(f)["versions"]

          # Deliberately retain no historical GmSSL versions. An old port
          # record, even if not selected by baseline, must fail this gate.
          if len(versions) != 1:
              raise SystemExit(
                  f"gmssl registry must contain exactly one current entry, "
                  f"found {len(versions)}"
              )

          version_keys = ("version", "version-semver", "version-string", "version-date")
          port_key = next((key for key in version_keys if key in port), None)
          if port_key is None:
              raise SystemExit("gmssl port has no supported version field")

          port_version = port[port_key]
          port_revision = int(port.get("port-version", 0))
          baseline_entry = baseline.get("gmssl")
          if baseline_entry is None:
              raise SystemExit("gmssl is missing from versions/baseline.json")
          if baseline_entry.get("baseline") != port_version:
              raise SystemExit(
                  f"gmssl baseline version mismatch: {baseline_entry.get('baseline')} != {port_version}"
              )
          if int(baseline_entry.get("port-version", 0)) != port_revision:
              raise SystemExit(
                  f"gmssl baseline port-version mismatch: "
                  f"{baseline_entry.get('port-version', 0)} != {port_revision}"
              )

          match = None
          for entry in versions:
              entry_version = next((entry[k] for k in version_keys if k in entry), None)
              if entry_version == port_version and int(entry.get("port-version", 0)) == port_revision:
                  match = entry
                  break
          if match is None:
              raise SystemExit(
                  f"gmssl {port_version}#{port_revision} is missing from versions/g-/gmssl.json"
              )

          tree = match.get("git-tree")
          if not tree:
              raise SystemExit("gmssl version entry has no git-tree")
          print(f"tree={tree}")
          print(f"version={port_version}")
          print(f"port_version={port_revision}")
          PY

      - name: Verify version tree is exactly the current gmssl port
        shell: bash
        env:
          VERSION_TREE: ${{ steps.metadata.outputs.tree }}
        run: |
          set -euo pipefail
          current_tree="$(git rev-parse HEAD:ports/gmssl)"
          test "$VERSION_TREE" = "$current_tree"
          git cat-file -e "$VERSION_TREE^{tree}"
          listing="$RUNNER_TEMP/gmssl-registry-tree.txt"
          git archive "$VERSION_TREE" | tar -tf - > "$listing"
          # The port must contain no added C implementations or headers.
          # Its tests remain independent C11 reference contract programs.
          unexpected="$(grep -E '[.][ch]$' "$listing" | grep -Ev '^tests/' || true)"
          if [ -n "$unexpected" ]; then
            echo "GmSSL port illegally contains C/H source:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          for required in portfile.cmake GmSSLConfig.cmake \
              overlays-01.cmake overlays-02.cmake \
              overlays-03.cmake overlays-04.cmake \
              p256-ecdsa-der-signature-parsing.patch; do
            grep -qx "$required" "$listing"
          done
          # This registry has no BoringSSL port, historical version entry,
          # or dedicated test workflow. Product-specific overlays live with
          # the products that use them.
          test ! -e ports/boringssl
          test ! -e versions/b-/boringssl.json
          test ! -e .github/workflows/validate-boringssl-no-go.yml
          grep -Fq 'REF d88d90dfd81df2320e6d47a92ad58c1eac9e0a17' \
            ports/gmssl/portfile.cmake
          printf 'gmssl registry tree=%s\n' "$VERSION_TREE"

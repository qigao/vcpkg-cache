name: Warm TurboMedia x64-linux cache

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/warm-turbomedia-x64-linux.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: warm-turbomedia-x64-linux
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout TurboMedia manifest owner
        uses: actions/checkout@v4
        with:
          repository: qigao/turbomedia
          ref: ad7caacfdb2443321a37ee4e8ee3ddef01527a98
          path: product
          persist-credentials: false

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: readwrite

      - name: Prepare native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm \
            autoconf automake libtool gettext yasm

      - name: Warm exact TurboMedia manifest
        shell: bash
        working-directory: product
        run: |
          set -euxo pipefail
          rm -rf vcpkg_installed
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=. \
            --x-install-root="$GITHUB_WORKSPACE/product/vcpkg_installed" \
            --triplet x64-linux

      - name: Verify key TurboMedia ABI entries
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          for pkg in ffmpeg opus libvpx openh264 x265 libde265 libsrtp libyuv llhttp roaring usrsctp zlib; do
            grep -Eq "^$pkg:" "$GITHUB_WORKSPACE/product/vcpkg_installed/vcpkg/status"
          done

name: Publish versioned vcpkg-cache source v0.1.002

# One-time source/Action release admission for the approved PR #272 merge.
# The exact PR HEAD must pass both existing qualification workflows.
# This does not write or relabel any native NuGet ABI package.
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/release-vcpkg-cache-v0.1.002.yml"

permissions:
  contents: read

concurrency:
  group: vcpkg-cache-source-release-v0.1.002
  cancel-in-progress: false

jobs:
  release:
    name: Publish exact master tag and GitHub Release
    if: >-
      github.repository == 'qigao/vcpkg-cache' &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify authoritative master, pinned source, and release invariants
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = qigao/vcpkg-cache
          test "$GITHUB_REF" = refs/heads/master
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote_master="$(git ls-remote --exit-code \
            https://github.com/qigao/vcpkg-cache.git refs/heads/master | cut -f1)"
          test "$remote_master" = "$GITHUB_SHA"
          if git ls-remote --exit-code \
            https://github.com/qigao/vcpkg-cache.git refs/tags/v0.1.002 >/dev/null 2>&1; then
            echo "v0.1.002 tag already exists: immutable release cannot be recreated" >&2
            exit 1
          fi
          if gh release view v0.1.002 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.1.002 Release already exists: refusing overwrite" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          repo, commit = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}'], text=True))
          pull = api('pulls/272')
          assert pull['merged'] and pull['base']['ref'] == 'master'
          assert pull['merge_commit_sha'] == commit, 'release must be the exact PR #272 merge'
          approved = pull['head']['sha']
          approved_tree = api(f'git/commits/{approved}')['tree']['sha']
          current_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          assert current_tree == approved_tree, 'merged source differs from approved PR tree'
          runs = api(f'actions/runs?head_sha={approved}&event=pull_request&per_page=100')['workflow_runs']
          for name in ('Validate vcpkg cache contract', 'Curl-only GitHub Packages transport qualification'):
              matching = [r for r in runs if r['name'] == name and r['head_sha'] == approved]
              assert matching, f'missing exact-HEAD CI: {name}'
              latest = max(matching, key=lambda r: (r['id'], r.get('run_attempt', 1)))
              assert latest['status'] == 'completed' and latest['conclusion'] == 'success', name
          assert Path('cache-contract-version.txt').read_text().strip() == '8'
          for path in ('docs/releases/v0.1.002.md', 'scripts/restore-native-dependency.py',
                       'cmake/QigaoNativeDependency.cmake',
                       '.github/actions/setup-native-dependency/action.yml'):
              assert Path(path).is_file(), path
          original = subprocess.check_output(['git', 'rev-parse', 'v0.1.0^{commit}'], text=True).strip()
          assert original == '05a10d73a5b1d01598e59d8cf34074513bd49df4', 'v0.1.0 must remain immutable'
          print(f'Admitted exact PR #272 source {approved} for source release {commit}')
          PY

      - name: Test existing native cache transport and protected publisher contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_curl_cache_*.py' -v

      - name: Create one immutable-name release tag on exact approved commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.1.002 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "vcpkg-cache v0.1.002" \
            --latest \
            --notes-file docs/releases/v0.1.002.md
          ref_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.002" \
            --jq '.object.sha')"
          test "$ref_sha" = "$GITHUB_SHA"
          gh release view v0.1.002 --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url

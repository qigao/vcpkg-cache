name: Source-built exact WABT NuGet candidate (NO PUBLISH)

on:
  pull_request:
    paths:
      - ".github/workflows/curl-wabt-source-package-qualification.yml"
      - "scripts/ci/qualify-wabt-source-package.py"
      - "scripts/tests/test_curl_cache_wabt_source_package.py"
      - "cache-contracts/wabt-producer/vcpkg.json"
  workflow_dispatch:

# A source candidate must never acquire GitHub Packages write access.
permissions:
  contents: read
  packages: read

jobs:
  offline-policy:
    name: Exact WABT ABI fail-closed publisher offline policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject missing/wrong source ABI, duplicates and bad package files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/qualify-wabt-source-package.py
          python3 -m unittest discover -s scripts/tests \
            -p test_curl_cache_wabt_source_package.py -v

  source-wabt:
    name: Build WABT 1.0.42 source and require missing exact ABI
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: offline-policy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare native compiler and WABT source-build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm autoconf automake libtool curl
          command -v cc
          command -v c++
          command -v ninja
      - name: Declare a clean producer-owned files L1
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/qualified-wabt-source-only-L1"
          rm -rf "$cache"
          mkdir -p "$cache"
          test -z "$(find "$cache" -type f -name '*.zip' -print -quit)"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"
      - name: Bootstrap pinned vcpkg without fetching any WABT binary
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          triplet: x64-linux
          host-triplet: x64-linux
          manifest-root: cache-contracts/optional-feature
      - name: Build real WABT tools and prerequisites from exact pinned sources
        shell: bash
        run: |
          set -euo pipefail
          manifest="$GITHUB_WORKSPACE/cache-contracts/wabt-producer"
          installed="$RUNNER_TEMP/installed-source-wabt"
          cache="$VCPKG_BINARY_CACHE"
          rm -rf "$installed"
          test -f "$manifest/vcpkg.json"
          test -z "$(find "$cache" -type f -name '*.zip' -print -quit)"
          export VCPKG_BINARY_SOURCES="clear;files,$cache,write"
          "$VCPKG_ROOT/vcpkg" install \
            "--x-manifest-root=$manifest" "--x-install-root=$installed" \
            --triplet=x64-linux --host-triplet=x64-linux
          test -x "$installed/x64-linux/tools/wabt/wast2json"
          test -n "$(find "$cache" -type f -name '*.zip' -print -quit)"
      - name: Derive exact ABI against fresh install root and reject other WABT hash
        shell: bash
        run: |
          set -euo pipefail
          manifest="$GITHUB_WORKSPACE/cache-contracts/wabt-producer"
          probe="$RUNNER_TEMP/source-wabt-abi-probe"
          plan="$RUNNER_TEMP/source-wabt-packages.config"
          rm -rf "$probe" "$plan"
          test ! -e "$probe"
          export VCPKG_BINARY_SOURCES="clear;files,$VCPKG_BINARY_CACHE,write"
          "$VCPKG_ROOT/vcpkg" install \
            "--x-manifest-root=$manifest" "--x-install-root=$probe" \
            --triplet=x64-linux --host-triplet=x64-linux \
            --dry-run "--x-write-nuget-packages-config=$plan"
          test -s "$plan"
          python3 scripts/ci/qualify-wabt-source-package.py \
            --packages-config "$plan" --cache "$VCPKG_BINARY_CACHE" \
            --output "$RUNNER_TEMP/qualified-wabt-packages" \
            --installed-tool "$RUNNER_TEMP/installed-source-wabt/x64-linux/tools/wabt/wast2json" \
            --expected-wabt-abi cbc2c2ae595865ddfbb317e7822e4f81633cb5dae4103085140643d7fb77f946 \
            | tee "$RUNNER_TEMP/wabt-exact-abi-evidence.txt"
          grep -Fq \
            'exact_source_producer=wabt_x64-linux/1.0.42-vcpkgcbc2c2ae595865ddfbb317e7822e4f81633cb5dae4103085140643d7fb77f946' \
            "$RUNNER_TEMP/wabt-exact-abi-evidence.txt"
          grep -Fxq 'remote_publish_attempted=false' \
            "$RUNNER_TEMP/wabt-exact-abi-evidence.txt"
          echo 'Exact missing published WABT ABI reproduced from pinned sources; NOT uploaded' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve non-published exact source WABT candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wabt-source-abi-candidate-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/source-wabt-packages.config
            ${{ runner.temp }}/wabt-exact-abi-evidence.txt
            ${{ runner.temp }}/qualified-wabt-packages/*.nupkg

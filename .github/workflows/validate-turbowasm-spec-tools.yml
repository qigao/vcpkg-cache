name: Validate TurboWasm spec tools profile

on:
  pull_request:
    paths:
      - "ports/wabt/**"
      - "manifests/turbowasm-spec-tools/**"
      - ".github/actions/setup-vcpkg-cache/**"
      - ".github/workflows/validate-turbowasm-spec-tools.yml"
      - "vcpkg-tool-version.txt"
      - "vcpkg-scripts-revision.txt"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  linux:
    name: Linux x64 WABT profile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read

      - name: Prepare host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config

      - name: Install WABT profile
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install             --x-manifest-root="$VCPKG_CACHE_REPOSITORY_ROOT/manifests/turbowasm-spec-tools"             --x-install-root=build/turbowasm-spec-tools             --triplet x64-linux

      - name: Qualify wast2json
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD/build/turbowasm-spec-tools/x64-linux"
          tool="$root/tools/wabt/wast2json"
          test -x "$tool"
          test "$("$tool" --version)" = "1.0.42"
          cat > "$RUNNER_TEMP/smoke.wast" <<'EOF'
          (module
            (func (export "answer") (result i32)
              i32.const 42))
          (assert_return (invoke "answer") (i32.const 42))
          EOF
          mkdir -p "$RUNNER_TEMP/wast2json-out"
          "$tool" "$RUNNER_TEMP/smoke.wast"             -o "$RUNNER_TEMP/wast2json-out/smoke.json"
          test -s "$RUNNER_TEMP/wast2json-out/smoke.json"
          test -s "$RUNNER_TEMP/wast2json-out/smoke.0.wasm"

          cat > "$RUNNER_TEMP/typed-ref.wast" <<'EOF'
          (module
            (type $t (func))
            (func (export "typed") (result (ref null $t))
              ref.null $t))
          EOF
          "$tool" --enable-function-references "$RUNNER_TEMP/typed-ref.wast"             -o "$RUNNER_TEMP/wast2json-out/typed-ref.json"
          test -s "$RUNNER_TEMP/wast2json-out/typed-ref.json"
          test -s "$RUNNER_TEMP/wast2json-out/typed-ref.0.wasm"

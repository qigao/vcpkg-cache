name: Praktor native SDK package

on:
  pull_request:
    paths: ["packaging/praktor/**", ".github/workflows/praktor-sdk-package.yml"]
  push:
    branches: [master]
    paths: ["packaging/praktor/**", ".github/workflows/praktor-sdk-package.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: praktor-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout Praktor master
        uses: actions/checkout@v4
        with:
          repository: qigao/praktor
          ref: master
          path: upstream/praktor
          persist-credentials: false
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
      - name: Restore native SDK dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/praktor-nuget.config"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          packages="$RUNNER_TEMP/praktor-dependencies"
          dotnet restore packaging/praktor/Praktor.Native.csproj \
            --configfile "$config" --packages "$packages"
          echo "NUGET_CONFIG=$config" >> "$GITHUB_ENV"
          echo "SALTS_ROOT=$packages/salts.native/1.2.0/sdk/linux-x64" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_ROOT=$packages/saltsutils.native/2.0.2/sdk/linux-x64" >> "$GITHUB_ENV"
          echo "CHTTP_ROOT=$packages/chttp.native/1.0.0/sdk/linux-x64" >> "$GITHUB_ENV"
      - name: Configure Release core-only SDK
        shell: bash
        run: |
          set -euo pipefail
          cmake -S upstream/praktor -B build/praktor -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/packaging/praktor" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/package/sdk/linux-x64" \
            -DENABLE_SCRIPT_ENGINE=OFF -DENABLE_TESTS=ON
      - name: Read product version and record provenance
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/praktor/CMakeCache.txt)"
          [[ "$source_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$source_version-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p package/sdk/linux-x64
          cat > package/sdk/linux-x64/praktor-sdk-manifest.txt <<EOF
          version=$version
          source_version=$source_version
          repository=https://github.com/qigao/praktor
          source_ref=master
          commit=$(git -C upstream/praktor rev-parse HEAD)
          salts=1.2.0
          salts_utils=2.0.2
          chttp=1.0.0
          rid=linux-x64
          build_type=Release
          script_engine=OFF
          EOF
      - name: Build, test and install
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$CHTTP_ROOT/lib:$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib"
          cmake --build build/praktor --parallel 2
          ctest --test-dir build/praktor --no-tests=error --output-on-failure
          cmake --install build/praktor
          # NuGet is a ZIP transport: dereference library symlinks before packing.
          cp -aL package package-dereferenced
          mv package package-original
          mv package-dereferenced package
      - name: Pack Praktor.Native
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack packaging/praktor/Praktor.Native.csproj --no-restore \
            --configuration Release --output dist \
            -p:PackageVersion="$PACKAGE_VERSION" -p:PackageRoot="$GITHUB_WORKSPACE/package"
          unzip -Z1 "dist/Praktor.Native.$PACKAGE_VERSION.nupkg" > "$RUNNER_TEMP/praktor-files.txt"
          for file in include/praktor.h include/praktor_export.h lib/libPraktor.so lib/cmake/Praktor/PraktorConfig.cmake praktor-sdk-manifest.txt; do
            grep -Fx "sdk/linux-x64/$file" "$RUNNER_TEMP/praktor-files.txt"
          done
      - name: Restore packed SDK and verify external consumer
        shell: bash
        run: |
          set -euo pipefail
          restored="$RUNNER_TEMP/praktor-package-restore"
          project="$RUNNER_TEMP/praktor-restore.csproj"
          cat > "$project" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup><PackageReference Include="Praktor.Native" Version="[$PACKAGE_VERSION]" /></ItemGroup>
          </Project>
          EOF
          dotnet nuget add source "$GITHUB_WORKSPACE/dist" --name local --configfile "$NUGET_CONFIG"
          dotnet restore "$project" --configfile "$NUGET_CONFIG" --packages "$restored"
          export SALTS_ROOT="$restored/salts.native/1.2.0/sdk/linux-x64"
          export SALTS_UTILS_ROOT="$restored/saltsutils.native/2.0.2/sdk/linux-x64"
          export CHTTP_ROOT="$restored/chttp.native/1.0.0/sdk/linux-x64"
          prefix="$restored/praktor.native/$PACKAGE_VERSION/sdk/linux-x64"
          mv package package-hidden
          export LD_LIBRARY_PATH="$prefix/lib:$CHTTP_ROOT/lib:$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib"
          cmake -S packaging/praktor/smoke -B build/package-smoke -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$prefix;$CHTTP_ROOT;$SALTS_UTILS_ROOT;$SALTS_ROOT" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"
          cmake --build build/package-smoke --parallel 2
          ctest --test-dir build/package-smoke --no-tests=error --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: praktor-native-nuget
          path: dist/*.nupkg
          if-no-files-found: error

  publish:
    needs: package
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: praktor-native-nuget
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish qualified package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text
          dotnet nuget push "dist/Praktor.Native.$PACKAGE_VERSION.nupkg" \
            --api-key "$GITHUB_TOKEN" --source github

name: Temporary MongoDB Linux cache warm

on:
  push:
    branches: [infra/warm-mongodb-linux]

permissions:
  contents: read
  packages: write

concurrency:
  group: warm-mongodb-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite
      - name: Prepare host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm libudev-dev
      - name: Warm isolated MongoDB Linux dependency graph
        shell: bash
        run: |
          set -euxo pipefail
          manifest="$RUNNER_TEMP/mongodb-warm-manifest"
          install_root="$RUNNER_TEMP/mongodb-warm-install"
          rm -rf "$manifest" "$install_root"
          mkdir -p "$manifest"
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["builtin-baseline"])')"
          cat > "$manifest/vcpkg.json" <<EOF
          {
            "name": "qigao-mongodb-cache-warm",
            "version-string": "1",
            "dependencies": ["mongo-c-driver"],
            "builtin-baseline": "$baseline",
            "overrides": [
              {"name":"mongo-c-driver","version":"2.3.1","port-version":2},
              {"name":"libbson","version":"2.3.1","port-version":0},
              {"name":"utf8proc","version":"2.11.3","port-version":0}
            ]
          }
          EOF
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$manifest" \
            --x-install-root="$install_root" \
            --triplet x64-linux

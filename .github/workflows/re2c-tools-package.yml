name: re2c binary package

on:
  pull_request:
    paths:
      - "packaging/re2c/**"
      - ".github/workflows/re2c-tools-package.yml"
  push:
    branches: [master]
    paths:
      - "packaging/re2c/**"
      - ".github/workflows/re2c-tools-package.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Explicitly opt in to publishing a new immutable package version
        type: boolean
        default: false
        required: false

permissions:
  contents: read

env:
  # Upstream re2c 4.6. Never let a moved tag silently change a host package.
  RE2C_UPSTREAM_COMMIT: "e485c5d572ab8a9f895b2a3c98e5239bf59254c8"
  RE2C_PACKAGE_VERSION: "4.6.5"

jobs:
  linux:
    name: Linux x64 (Ubuntu 22.04 / runner Clang)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact re2c 4.6 source
        uses: actions/checkout@v4
        with:
          repository: skvadrik/re2c
          ref: ${{ env.RE2C_UPSTREAM_COMMIT }}
          path: upstream/re2c
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S upstream/re2c -B build/re2c -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DRE2C_BUILD_RE2D=OFF -DRE2C_BUILD_RE2GO=OFF -DRE2C_BUILD_RE2HS=OFF
          -DRE2C_BUILD_RE2JAVA=OFF -DRE2C_BUILD_RE2JS=OFF -DRE2C_BUILD_RE2OCAML=OFF
          -DRE2C_BUILD_RE2PY=OFF -DRE2C_BUILD_RE2RUST=OFF -DRE2C_BUILD_RE2SWIFT=OFF
          -DRE2C_BUILD_RE2V=OFF -DRE2C_BUILD_RE2ZIG=OFF -DRE2C_BUILD_LIBS=OFF
      - name: Build and stage
        run: |
          cmake --build build/re2c --parallel 2
          build/re2c/re2c --version
          mkdir -p stage/package-tools/linux-x64/bin stage/package-tools/linux-x64/share/re2c/stdlib
          cp build/re2c/re2c stage/package-tools/linux-x64/bin/re2c
          cp -a upstream/re2c/include/. stage/package-tools/linux-x64/share/re2c/stdlib/
      - uses: actions/upload-artifact@v4
        with:
          name: re2c-binary-host-linux-x64
          path: stage/package-tools
          if-no-files-found: error

  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact re2c 4.6 source
        uses: actions/checkout@v4
        with:
          repository: skvadrik/re2c
          ref: ${{ env.RE2C_UPSTREAM_COMMIT }}
          path: upstream/re2c
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S upstream/re2c -B build/re2c -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DRE2C_BUILD_RE2D=OFF -DRE2C_BUILD_RE2GO=OFF -DRE2C_BUILD_RE2HS=OFF
          -DRE2C_BUILD_RE2JAVA=OFF -DRE2C_BUILD_RE2JS=OFF -DRE2C_BUILD_RE2OCAML=OFF
          -DRE2C_BUILD_RE2PY=OFF -DRE2C_BUILD_RE2RUST=OFF -DRE2C_BUILD_RE2SWIFT=OFF
          -DRE2C_BUILD_RE2V=OFF -DRE2C_BUILD_RE2ZIG=OFF -DRE2C_BUILD_LIBS=OFF
      - name: Build and stage
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          cmake --build build/re2c --parallel 2
          build/re2c/re2c --version
          mkdir -p stage/package-tools/linux-arm64/bin stage/package-tools/linux-arm64/share/re2c/stdlib
          cp build/re2c/re2c stage/package-tools/linux-arm64/bin/re2c
          cp -a upstream/re2c/include/. stage/package-tools/linux-arm64/share/re2c/stdlib/
      - uses: actions/upload-artifact@v4
        with:
          name: re2c-binary-host-linux-arm64
          path: stage/package-tools
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact re2c 4.6 source
        uses: actions/checkout@v4
        with:
          repository: skvadrik/re2c
          ref: ${{ env.RE2C_UPSTREAM_COMMIT }}
          path: upstream/re2c
          persist-credentials: false
      - name: Select runner Homebrew LLVM/Clang
        shell: bash
        run: |
          llvm="$(brew --prefix llvm@18)"
          echo "CC=$llvm/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$llvm/bin/clang++" >> "$GITHUB_ENV"
      - name: Configure
        run: >-
          cmake -S upstream/re2c -B build/re2c -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRE2C_BUILD_RE2D=OFF -DRE2C_BUILD_RE2GO=OFF -DRE2C_BUILD_RE2HS=OFF
          -DRE2C_BUILD_RE2JAVA=OFF -DRE2C_BUILD_RE2JS=OFF -DRE2C_BUILD_RE2OCAML=OFF
          -DRE2C_BUILD_RE2PY=OFF -DRE2C_BUILD_RE2RUST=OFF -DRE2C_BUILD_RE2SWIFT=OFF
          -DRE2C_BUILD_RE2V=OFF -DRE2C_BUILD_RE2ZIG=OFF -DRE2C_BUILD_LIBS=OFF
      - name: Build and stage
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/re2c --parallel 2
          build/re2c/re2c --version
          case "$RUNNER_ARCH" in
            X64) rid=macos-x64 ;;
            ARM64) rid=macos-arm64 ;;
            *) echo "unsupported RUNNER_ARCH=$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          mkdir -p "stage/package-tools/$rid/bin" "stage/package-tools/$rid/share/re2c/stdlib"
          cp build/re2c/re2c "stage/package-tools/$rid/bin/re2c"
          cp -a upstream/re2c/include/. "stage/package-tools/$rid/share/re2c/stdlib/"
      - uses: actions/upload-artifact@v4
        with:
          name: re2c-binary-host-macos
          path: stage/package-tools
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact re2c 4.6 source
        uses: actions/checkout@v4
        with:
          repository: skvadrik/re2c
          ref: ${{ env.RE2C_UPSTREAM_COMMIT }}
          path: upstream/re2c
          persist-credentials: false
      - uses: ./.github/actions/setup-llvm-mingw
        with:
          version: "20261020"
          target: x64
          build-type: toolchain-only
      - name: Install Ninja for the llvm-mingw native build
        shell: pwsh
        run: choco install ninja -y --no-progress
      - name: Configure
        shell: pwsh
        run: |
          cmake -S upstream/re2c -B build/re2c -G Ninja `
            '-DCMAKE_BUILD_TYPE=Release' "-DCMAKE_TOOLCHAIN_FILE=$env:LLVM_MINGW_TOOLCHAIN_FILE" `
            -DRE2C_BUILD_RE2D=OFF -DRE2C_BUILD_RE2GO=OFF -DRE2C_BUILD_RE2HS=OFF `
            -DRE2C_BUILD_RE2JAVA=OFF -DRE2C_BUILD_RE2JS=OFF -DRE2C_BUILD_RE2OCAML=OFF `
            -DRE2C_BUILD_RE2PY=OFF -DRE2C_BUILD_RE2RUST=OFF -DRE2C_BUILD_RE2SWIFT=OFF `
            -DRE2C_BUILD_RE2V=OFF -DRE2C_BUILD_RE2ZIG=OFF -DRE2C_BUILD_LIBS=OFF
      - name: Build and stage
        shell: pwsh
        run: |
          cmake --build build/re2c --config Release --parallel 2
          & ".\build\re2c\re2c.exe" --version
          New-Item -ItemType Directory -Force -Path stage\package-tools\windows-x64\bin | Out-Null
          New-Item -ItemType Directory -Force -Path stage\package-tools\windows-x64\share\re2c\stdlib | Out-Null
          Copy-Item ".\build\re2c\re2c.exe" ".\stage\package-tools\windows-x64\bin\re2c.exe"
          Copy-Item ".\upstream\re2c\include\*" ".\stage\package-tools\windows-x64\share\re2c\stdlib" -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: re2c-binary-host-windows-x64
          path: stage/package-tools
          if-no-files-found: error

  pack:
    name: Pack NuGet
    needs: [linux, linux-arm64, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: re2c-binary-host-*
          path: package/tools
          merge-multiple: true
      - name: Verify payload
        shell: bash
        run: |
          set -euo pipefail
          for rid in linux-x64 linux-arm64 macos-arm64 windows-x64; do
            exe=re2c
            if [ "$rid" = windows-x64 ]; then exe=re2c.exe; fi
            test -f "package/tools/$rid/bin/$exe"
            for data in unicode_categories.re unicode_properties.re syntax/c; do
              test -f "package/tools/$rid/share/re2c/stdlib/$data"
            done
          done
      - name: Test package ABI and layout guards
        run: python3 -B -m unittest discover -s packaging/re2c -p 'test_*.py' -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pack
        run: >-
          dotnet pack packaging/re2c/Qigao.Re2c.Binary.csproj
          --configuration Release --output dist
          -p:PackageVersion="$RE2C_PACKAGE_VERSION"
          -p:PackageRoot="$GITHUB_WORKSPACE/package"
      - name: Verify packed NuGet contents
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=packaging/re2c python3 -B - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          from verify_linux_package import package_layout
          package = Path('dist') / f"Qigao.Re2c.Binary.{os.environ['RE2C_PACKAGE_VERSION']}.nupkg"
          with ZipFile(package) as archive:
              print('host_rids=' + ','.join(package_layout(archive)))
          PY
          sha256sum "dist/Qigao.Re2c.Binary.$RE2C_PACKAGE_VERSION.nupkg" | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: re2c-binary-nuget
          path: |
            dist/*.nupkg
            dist/SHA256SUMS
          if-no-files-found: error

  linux-compatibility:
    name: Packed Linux x64 / ${{ matrix.os }}
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: re2c-binary-nuget
          path: dist
      - name: Execute the packed host tool and generated Unicode C11 lexer
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check dist/SHA256SUMS
          python3 -B packaging/re2c/verify_linux_package.py \
            --package "dist/Qigao.Re2c.Binary.$RE2C_PACKAGE_VERSION.nupkg" \
            --version "$RE2C_PACKAGE_VERSION" \
            --expected-host "${{ matrix.os }}" \
            --work "$RUNNER_TEMP/re2c-package-compatibility" \
            --report "evidence/${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: re2c-linux-x64-compatibility-${{ matrix.os }}
          path: evidence/*.json
          if-no-files-found: error

  publish:
    name: Publish verified NuGet
    needs: [pack, linux-compatibility]
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: re2c-binary-nuget
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Publish the exact package tested by both hosts, with no rebuild and
          # no success-on-duplicate path for an older package with other bytes.
          sha256sum --check dist/SHA256SUMS
          dotnet nuget add source --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text --name github https://nuget.pkg.github.com/qigao/index.json
          dotnet nuget push "dist/Qigao.Re2c.Binary.$RE2C_PACKAGE_VERSION.nupkg" --api-key "$GITHUB_TOKEN" --source github

name: Curl-only vcpkg NuGet publisher offline qualification

on:
  pull_request:
    paths:
      - scripts/publish-vcpkg-curl.py
      - scripts/tests/test_curl_publisher.py
      - .github/workflows/curl-vcpkg-nuget-publisher.yml
  workflow_dispatch:
    inputs:
      approve_exact_native_publish:
        description: "Explicitly authorize one trusted, source-built native ABI publish qualification"
        required: true
        type: boolean
        default: false
      expected_master_sha:
        description: "Exact 40-hex master commit SHA to qualify; mismatch fails closed"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  publisher-policy:
    name: Offline publisher package identity and HTTP push safety / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse source and execute ALL offline native publish policy tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile scripts/publish-vcpkg-curl.py scripts/github-packages.py
          if ($LASTEXITCODE -ne 0) { throw 'Native producer syntax error' }
          python -m unittest discover -s scripts/tests -p test_curl_publisher.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native curl NuGet publisher contract failure' }

  real-packages:
    name: Exact real native binary-cache zip to NuGet round-trip (never publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact canonical vcpkg package via authenticated curl
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          triplet: x64-linux
          host-triplet: x64-linux
          manifest-root: cache-contracts/header-only
      - name: Reproduce exact source-derived ABI and prepare upload-shaped archive
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/canonical-producer.packages.config"
          "$VCPKG_ROOT/vcpkg" install \
            "--x-manifest-root=$GITHUB_WORKSPACE/cache-contracts/header-only" \
            --triplet=x64-linux --host-triplet=x64-linux --dry-run \
            "--x-write-nuget-packages-config=$config"
          test -s "$config"
          python3 scripts/publish-vcpkg-curl.py \
            --packages-config "$config" --cache "$VCPKG_BINARY_CACHE" \
            --output "$RUNNER_TEMP/qualified-native-nupkg"
          count="$(find "$RUNNER_TEMP/qualified-native-nupkg" -maxdepth 1 -name '*.nupkg' -type f | wc -l)"
          test "$count" -ge 1
          echo "native_nuget_archive_count=$count" >> "$GITHUB_STEP_SUMMARY"

  source-built-producer:
    name: Fresh native simde source build to exact ABI NuGet (offline, no publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Prepare native tools before package ABI calculation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm curl
      - name: Bootstrap immutable vcpkg and curl NuGet V3 transport
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          triplet: x64-linux
          host-triplet: x64-linux
          manifest-root: cache-contracts/header-only
      - name: Recompute exact ABI and build native files cache from source
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/source-built-empty-L1"
          install_root="$RUNNER_TEMP/source-built-native-installed"
          config="$RUNNER_TEMP/source-built-exact-abi.packages.config"
          rm -rf "$cache" "$install_root" "$config"
          mkdir -p "$cache"
          # Clear the curl-restored L1 deliberately: a producer must prove it
          # can create a new native zip, not merely repackage an L2 download.
          export VCPKG_BINARY_CACHE="$cache"
          export VCPKG_BINARY_SOURCES="clear;files,$cache,readwrite"
          manifest="$GITHUB_WORKSPACE/cache-contracts/header-only"
          "$VCPKG_ROOT/vcpkg" install \
            "--x-manifest-root=$manifest" \
            "--x-install-root=$RUNNER_TEMP/source-build-abi-probe" \
            --triplet=x64-linux --host-triplet=x64-linux --dry-run \
            "--x-write-nuget-packages-config=$config"
          test -s "$config"
          "$VCPKG_ROOT/vcpkg" install \
            "--x-manifest-root=$manifest" "--x-install-root=$install_root" \
            --triplet=x64-linux --host-triplet=x64-linux
          test -n "$(find "$cache" -type f -name '*.zip' -print -quit)"
          python3 scripts/publish-vcpkg-curl.py \
            --packages-config "$config" --cache "$cache" \
            --output "$RUNNER_TEMP/source-built-qualified-nupkg"
          count="$(find "$RUNNER_TEMP/source-built-qualified-nupkg" -maxdepth 1 -type f -name '*.nupkg' | wc -l)"
          test "$count" -ge 1
          echo "source_built_native_nuget_archive_count=$count" >> "$GITHUB_STEP_SUMMARY"
          echo "Native packages were generated from a fresh empty files cache; no NuGet CLI/Mono/provider or remote publish was used." >> "$GITHUB_STEP_SUMMARY"

  trusted-upload-smoke:
    name: Trusted manual master-only source-to-registry native ABI qualification
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      inputs.approve_exact_native_publish == true
    runs-on: ubuntu-24.04
    environment: native-cache-publish
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact trusted master HEAD and explicit write authorization
        shell: bash
        env:
          EXPECTED_MASTER_SHA: ${{ inputs.expected_master_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MASTER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_MASTER_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_REPOSITORY" = qigao/vcpkg-cache
          test "$GITHUB_REF" = refs/heads/master
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
      - name: Install native tools before exact ABI calculation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm curl
      - name: Bootstrap verified curl-only toolchain
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          triplet: x64-linux
          host-triplet: x64-linux
          manifest-root: cache-contracts/header-only
      - name: Source-build exact native ABI with isolated, files-only local cache
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/approved-native-empty-L1"
          manifest="$GITHUB_WORKSPACE/cache-contracts/header-only"
          rm -rf "$cache" "$RUNNER_TEMP/approved-native-installed"
          mkdir -p "$cache"
          export VCPKG_BINARY_CACHE="$cache"
          export VCPKG_BINARY_SOURCES="clear;files,$cache,readwrite"
          config="$RUNNER_TEMP/approved-exact-abi.packages.config"
          "$VCPKG_ROOT/vcpkg" install \
            "--x-manifest-root=$manifest" \
            "--x-install-root=$RUNNER_TEMP/approved-native-probe" \
            --triplet=x64-linux --host-triplet=x64-linux --dry-run \
            "--x-write-nuget-packages-config=$config"
          test -s "$config"
          "$VCPKG_ROOT/vcpkg" install \
            "--x-manifest-root=$manifest" \
            "--x-install-root=$RUNNER_TEMP/approved-native-installed" \
            --triplet=x64-linux --host-triplet=x64-linux
          test -n "$(find "$cache" -type f -name '*.zip' -print -quit)"
          echo "APPROVED_NATIVE_CACHE=$cache" >> "$GITHUB_ENV"
          echo "APPROVED_NATIVE_CONFIG=$config" >> "$GITHUB_ENV"
      - name: Upload exact native ABI over GitHub PackagePublish and SHA256 attest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/publish-vcpkg-curl.py \
            --packages-config "$APPROVED_NATIVE_CONFIG" \
            --cache "$APPROVED_NATIVE_CACHE" \
            --output "$RUNNER_TEMP/approved-native-upload" --publish
      - name: Clean local L1, curl restore official L2 and require binary-only install
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/approved-verified-empty-L1"
          rm -rf "$cache" "$RUNNER_TEMP/approved-clean-installed"
          mkdir -p "$cache"
          export VCPKG_BINARY_CACHE="$cache"
          export VCPKG_BINARY_SOURCES="clear;files,$cache,read"
          python3 scripts/restore-manifest-cache.py \
            --manifest-root "$GITHUB_WORKSPACE/cache-contracts/header-only" \
            --triplet x64-linux --host-triplet x64-linux
          "$VCPKG_ROOT/vcpkg" install \
            "--x-manifest-root=$GITHUB_WORKSPACE/cache-contracts/header-only" \
            "--x-install-root=$RUNNER_TEMP/approved-clean-installed" \
            --triplet=x64-linux --host-triplet=x64-linux --only-binarycaching
          echo "Trusted native package SHA256 and clean-L2 consumer acceptance passed" >> "$GITHUB_STEP_SUMMARY"

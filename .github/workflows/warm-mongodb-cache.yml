name: Warm MongoDB vcpkg cache

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/warm-mongodb-cache.yml"
      - "vcpkg-tool-version.txt"
      - "vcpkg-scripts-revision.txt"
      - "cache-contract-version.txt"
      - ".github/actions/setup-vcpkg-cache/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  warm-linux:
    name: MongoDB x64-linux producer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: readwrite

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config

      - name: Create isolated MongoDB manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/mongodb-warm-manifest"
          rm -rf "$manifest"
          mkdir -p "$manifest"
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["builtin-baseline"])')"
          cat > "$manifest/vcpkg.json" <<EOF
          {
            "name": "qigao-mongodb-cache-warm",
            "version-string": "1",
            "dependencies": ["mongo-c-driver"],
            "builtin-baseline": "$baseline",
            "overrides": [
              {
                "name": "mongo-c-driver",
                "version": "2.3.1",
                "port-version": 2
              },
              {
                "name": "libbson",
                "version": "2.3.1",
                "port-version": 0
              },
              {
                "name": "utf8proc",
                "version": "2.11.3",
                "port-version": 0
              }
            ]
          }
          EOF
          echo "MONGODB_WARM_MANIFEST=$manifest" >> "$GITHUB_ENV"

      - name: Warm MongoDB dependency closure
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/mongodb-warm-install"
          rm -rf "$install_root"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$MONGODB_WARM_MANIFEST" \
            --x-install-root="$install_root" \
            --triplet x64-linux

  verify-linux:
    name: MongoDB x64-linux clean-L2 restore
    needs: warm-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Use empty L1 cache
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/empty-mongodb-l1"
          rm -rf "$cache"
          mkdir -p "$cache"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read

      - name: Install Ninja
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Create isolated MongoDB manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/mongodb-verify-manifest"
          rm -rf "$manifest"
          mkdir -p "$manifest"
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["builtin-baseline"])')"
          cat > "$manifest/vcpkg.json" <<EOF
          {
            "name": "qigao-mongodb-cache-verify",
            "version-string": "1",
            "dependencies": ["mongo-c-driver"],
            "builtin-baseline": "$baseline",
            "overrides": [
              {
                "name": "mongo-c-driver",
                "version": "2.3.1",
                "port-version": 2
              },
              {
                "name": "libbson",
                "version": "2.3.1",
                "port-version": 0
              },
              {
                "name": "utf8proc",
                "version": "2.11.3",
                "port-version": 0
              }
            ]
          }
          EOF
          echo "MONGODB_VERIFY_MANIFEST=$manifest" >> "$GITHUB_ENV"

      - name: Verify clean-L2 MongoDB restore
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/mongodb-verify-install"
          log="$RUNNER_TEMP/mongodb-verify.log"
          rm -rf "$install_root" "$VCPKG_BINARY_CACHE"
          mkdir -p "$VCPKG_BINARY_CACHE"
          set +e
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$MONGODB_VERIFY_MANIFEST" \
            --x-install-root="$install_root" \
            --triplet x64-linux \
            --only-binarycaching 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -Eq '^Building (openssl|utf8proc|libbson|mongo-c-driver):x64-linux' "$log"; then
            echo "MongoDB dependency source build detected during cache-only qualification" >&2
            exit 1
          fi
          grep -Fq "mongo-c-driver" "$log"
          grep -Eq 'Restored [1-9][0-9]* package\(s\) from NuGet' "$log"

name: BoringSSL no-Go qualification

on:
  pull_request:
    paths:
      - "ports/boringssl/**"
      - ".github/workflows/validate-boringssl-no-go.yml"
      - ".github/actions/setup-vcpkg-cache/**"
      - "vcpkg-tool-version.txt"
      - "vcpkg-scripts-revision.txt"
      - "scripts/vcpkg-required-commits.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  linux:
    name: Linux cold source build without Go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read

      - name: Prepare BoringSSL host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build nasm

      - name: Cold-build BoringSSL with Go unavailable
        shell: bash
        run: |
          set -euo pipefail

          disabled=()

          restore_go() {
            local entry original disabled_path
            for entry in "${disabled[@]}"; do
              original="${entry%%|*}"
              disabled_path="${entry#*|}"
              if [ -e "$disabled_path" ]; then
                sudo mv "$disabled_path" "$original"
              fi
            done
          }
          trap restore_go EXIT

          while IFS= read -r go_path; do
            [ -n "$go_path" ] || continue
            [ -e "$go_path" ] || continue
            disabled_path="$go_path.qigao-ci-disabled"
            sudo mv "$go_path" "$disabled_path"
            disabled+=("$go_path|$disabled_path")
          done < <(
            type -a -p go 2>/dev/null |
              while IFS= read -r path; do readlink -f "$path"; done |
              awk '!seen[$0]++'
          )

          hash -r
          if command -v go >/dev/null 2>&1; then
            echo "Go is still available after hiding runner toolchains: $(command -v go)" >&2
            exit 1
          fi

          install_root="$RUNNER_TEMP/boringssl-no-go"
          rm -rf "$install_root"

          (
            cd "$RUNNER_TEMP"
            VCPKG_BINARY_SOURCES=clear "$VCPKG_ROOT/vcpkg" install \
              boringssl:x64-linux \
              --classic \
              --overlay-ports="$GITHUB_WORKSPACE/ports" \
              --x-install-root="$install_root"
          )

          test -f "$install_root/x64-linux/include/openssl/ssl.h"
          test -f "$install_root/x64-linux/lib/libssl.a"
          test -f "$install_root/x64-linux/lib/libcrypto.a"

  ios:
    name: iOS cold source build / ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: device arm64, triplet: arm64-ios}
          - {name: simulator arm64, triplet: arm64-ios-simulator}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vcpkg-cache
        with:
          mode: read

      - name: Prepare BoringSSL iOS host dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          brew install ninja nasm

      - name: Cold-build library-only BoringSSL for iOS
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/boringssl-${{ matrix.triplet }}"
          rm -rf "$install_root"

          (
            cd "$RUNNER_TEMP"
            VCPKG_BINARY_SOURCES=clear "$VCPKG_ROOT/vcpkg" install \
              "boringssl:${{ matrix.triplet }}" \
              --classic \
              --overlay-ports="$GITHUB_WORKSPACE/ports" \
              --x-install-root="$install_root"
          )

          prefix="$install_root/${{ matrix.triplet }}"
          test -f "$prefix/include/openssl/ssl.h"
          test -f "$prefix/lib/libssl.a"
          test -f "$prefix/lib/libcrypto.a"
          test ! -e "$prefix/tools/boringssl/bssl"
          test ! -e "$prefix/bin/bssl"

name: Curl-only GitHub Packages transport qualification
on:
  pull_request:
    paths:
      - scripts/github-packages.py
      - scripts/setup-vcpkg-curl-cache.py
      - scripts/restore-manifest-cache.py
      - scripts/publish-vcpkg-curl-cache.py
      - cache-contracts/optional-feature/**
      - scripts/tests/**
      - .github/actions/setup-vcpkg-curl-cache/**
      - .github/actions/setup-re2c-tools/**
      - .github/workflows/curl-only-github-packages.yml
      - .github/workflows/curl-only-vcpkg-producer.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  policy:
    name: Exact ABI, prefix normalization and fail-closed parser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify all native curl package helper syntax and policy
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/github-packages.py scripts/setup-vcpkg-curl-cache.py scripts/restore-manifest-cache.py scripts/publish-vcpkg-curl-cache.py
          python -m unittest discover -s scripts/tests -p 'test_curl_cache_*.py' -v
          test "$(grep -Ec 'mono-complete|brew install mono|dotnet restore|vcpkg fetch nuget' .github/actions/setup-vcpkg-curl-cache/action.yml || true)" -eq 0
      - name: Parse privileged producer workflow using pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          go version
          GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -oneline \
            .github/workflows/curl-only-vcpkg-producer.yml

  real-packages:
    name: Genuine Linux native vcpkg ABI GitHub Packages HTTP restore
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap pinned tool and restore immutable header-only ABI packages
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          triplet: x64-linux
          host-triplet: x64-linux
          manifest-root: cache-contracts/header-only
      - name: Require native offline binary-cache install, no NuGet execution
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install \
            "--x-manifest-root=$GITHUB_WORKSPACE/cache-contracts/header-only" \
            --triplet=x64-linux --host-triplet=x64-linux \
            "--x-install-root=$RUNNER_TEMP/curl-only-smoke-installed" \
            --only-binarycaching
          test -f "$RUNNER_TEMP/curl-only-smoke-installed/x64-linux/share/simde/vcpkg_abi_info.txt"
      - name: Roundtrip and independently check NuGet producer against published exact ABI cache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/qigao-curl-vcpkg-abi/packages.config"
          test -s "$config"
          # This is deliberately read-only: existing immutable versions are
          # byte-checked; any absent version is reported as publish_dry_run.
          python scripts/publish-vcpkg-curl-cache.py \
            --packages-config "$config" --cache "$VCPKG_BINARY_CACHE" \
            | tee "$RUNNER_TEMP/curl-producer-dry-run.log"
          grep -E 'publish_summary total=[1-9][0-9]*' "$RUNNER_TEMP/curl-producer-dry-run.log"
          ! grep -Eq '(uploaded=[1-9]|publish_rejected)' "$RUNNER_TEMP/curl-producer-dry-run.log"

  source-built-native-abi:
    name: Fresh source-built simde ABI ZIP to canonical NuGet roundtrip (NO PUBLISH)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare native compiler tools before ABI calculation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm curl
      - name: Bootstrap pinned vcpkg and central exact package transport
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          triplet: x64-linux
          host-triplet: x64-linux
          manifest-root: cache-contracts/header-only
      - name: Build actual native files-cache ZIP and derive source-independent ABI plan
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/source-built-native-L1"
          installed="$RUNNER_TEMP/source-built-native-installed"
          probe="$RUNNER_TEMP/source-built-abi-probe"
          plan="$RUNNER_TEMP/source-built-exact.packages.config"
          manifest="$GITHUB_WORKSPACE/cache-contracts/header-only"
          rm -rf "$cache" "$installed" "$probe" "$plan"
          mkdir -p "$cache"
          export VCPKG_BINARY_CACHE="$cache"
          export VCPKG_BINARY_SOURCES="clear;files,$cache,write"
          # A real source compilation MUST fill an initially empty local cache.
          test -z "$(find "$cache" -name '*.zip' -type f -print -quit)"
          "$VCPKG_ROOT/vcpkg" install \
            "--x-manifest-root=$manifest" "--x-install-root=$installed" \
            --triplet=x64-linux --host-triplet=x64-linux
          test -n "$(find "$cache" -name '*.zip' -type f -print -quit)"
          # vcpkg must resolve ABI against an empty installation, not the
          # already installed source-build root which can hide every package.
          test ! -e "$probe"
          "$VCPKG_ROOT/vcpkg" install \
            "--x-manifest-root=$manifest" "--x-install-root=$probe" \
            --triplet=x64-linux --host-triplet=x64-linux --dry-run \
            "--x-write-nuget-packages-config=$plan"
          test -s "$plan"
          python3 - "$plan" "$cache" "$RUNNER_TEMP/source-built-nupkg" <<'PY'
          import importlib.util
          import pathlib
          import sys
          import xml.etree.ElementTree as ET
          plan, cache, output = map(pathlib.Path, sys.argv[1:])
          spec = importlib.util.spec_from_file_location(
              "native_publisher", "scripts/publish-vcpkg-curl-cache.py")
          assert spec and spec.loader
          publisher = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(publisher)
          root = ET.parse(plan).getroot()
          assert root.tag == "packages"
          items = list(root)
          assert items, "source-build dry-run did not emit any exact package ABIs"
          output.mkdir(parents=True, exist_ok=True)
          for element in items:
              assert element.tag == "package"
              assert set(element.attrib) == {"id", "version"}
              identity, version = element.attrib["id"], element.attrib["version"]
              matched = publisher.ABI_VERSION.fullmatch(version)
              assert matched, (identity, version)
              abi = matched[1]
              source = cache / abi[:2] / (abi + ".zip")
              assert source.is_file(), "exact source ABI was not materialized: " + abi
              publisher.identify_source(source, identity, version)
              nupkg = output / (identity + "." + version + ".nupkg")
              publisher.build_nupkg(source, identity, version, nupkg)
              assert publisher.check_roundtrip(source, nupkg, identity, version) == \
                     publisher.entries_digest(source)
              print("source_built_native_abi=" + abi +
                    " nupkg_sha256=" + publisher.packages.sha256(nupkg))
          PY
          test -n "$(find "$RUNNER_TEMP/source-built-nupkg" -type f -name '*.nupkg' -print -quit)"
          echo 'New source-built ABI → files ZIP → NuGet → byte-exact files ZIP: qualified, never published' \
            >> "$GITHUB_STEP_SUMMARY"

  optional-feature-abi:
    name: Optional feature explicitly selected over curl-only GitHub Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Restore the exact pinned simde feature only
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          manifest-root: cache-contracts/optional-feature
          triplet: x64-linux
          host-triplet: x64-linux
          features: simde-test
      - name: Install from local ABI cache with explicitly selected feature
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install \
            "--x-manifest-root=$GITHUB_WORKSPACE/cache-contracts/optional-feature" \
            --triplet=x64-linux --host-triplet=x64-linux \
            --x-feature=simde-test \
            "--x-install-root=$RUNNER_TEMP/optional-curl-installed" \
            --only-binarycaching
          test -f "$RUNNER_TEMP/optional-curl-installed/x64-linux/share/simde/vcpkg_abi_info.txt"

  empty-manifest:
    name: Valid empty native manifest requires no NuGet client or HTTP download
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: No optional features selected
        uses: ./.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          manifest-root: cache-contracts/optional-feature
          triplet: x64-linux
          host-triplet: x64-linux
      - name: Demand no materialized cache packages
        shell: bash
        run: |
          set -euo pipefail
          if find "$VCPKG_BINARY_CACHE" -type f -name '*.zip' | grep -q .; then
            echo "An empty manifest must not install hidden package dependencies" >&2
            exit 1
          fi

  re2c-curl:
    name: Real re2c GitHub Package via curl / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-re2c-tools
      - name: Require exact host binary and Unicode data from package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:RE2C_ROOT -or -not $env:RE2C_PACKAGE_VERSION) { throw 'Missing verified re2c package identity' }
          $exe = Join-Path $env:RE2C_ROOT ('bin/re2c' + $(if ($IsWindows) { '.exe' } else { '' }))
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Missing package-owned re2c binary' }
          foreach ($member in @('share/re2c/stdlib/unicode_categories.re','share/re2c/stdlib/unicode_properties.re')) {
            if (-not (Test-Path -LiteralPath (Join-Path $env:RE2C_ROOT $member))) { throw "Missing standard Unicode data: $member" }
          }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Published re2c binary failed' }
